  var HVS=DATA.map(function(d){ return low(d[4]); });
  try{ var sv=parseInt(localStorage.getItem('kanjiPage'),10); if(sv>=0&&sv<PAGES) page=sv; }catch(e){}
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var panel=document.createElement('section'); panel.className='kj-panel'; panel.id='kanjiPanel';
  panel.innerHTML='<div class="kj-bar"><button type="button" class="kj-b" id="kjClose">&#8592; 戻る</button><h2>'+__XH('Hán tự','漢字','Kanji')+'</h2><input type="search" class="kj-q" id="kjQ" placeholder="Tìm 漢字 / âm Hán Việt…" autocomplete="off" spellcheck="false" aria-label="search"><select class="kj-g" id="kjGB" aria-label="同声符"></select><select class="kj-g" id="kjGF" aria-label="同部首"></select><span class="kj-sp"></span>'+
    '<button type="button" class="kj-b nav" id="kjPrev" aria-label="前のページ">&#9664;</button><select class="kj-sel" id="kjSel" aria-label="ページ"></select><span class="kj-pg" id="kjPg"></span><button type="button" class="kj-b nav" id="kjNext" aria-label="次のページ">&#9654;</button><span class="kj-sp"></span><button type="button" class="kj-b" id="kjAll">全てめくる</button></div>'+
    '<div class="kj-grid" id="kjGrid"></div>';
  document.body.appendChild(panel);
  var grid=panel.querySelector('#kjGrid'), sel=panel.querySelector('#kjSel'), pg=panel.querySelector('#kjPg'), prev=panel.querySelector('#kjPrev'), next=panel.querySelector('#kjNext');
  function buildSel(){
    sel.innerHTML='';
    for(var p=0;p<PAGES;p++){
      var a=p*PER, b=Math.min(LIST.length,a+PER)-1, lv={};
      for(var i=a;i<=b;i++) lv['N'+DATA[LIST[i]][1]]=1;
      var o=document.createElement('option'); o.value=p; o.textContent=(a+1)+'–'+(b+1)+'  ·  '+Object.keys(lv).join('/'); sel.appendChild(o);
    }
  }
  buildSel();
  var qi=panel.querySelector('#kjQ');
  var gB=panel.querySelector('#kjGB'), gF=panel.querySelector('#kjGF');
  var CI={}; DATA.forEach(function(d,i){ CI[d[0]]=i; });
  function fillG(selEl,key,ph){
    var h='<option value="">'+ph+'</option>';
    GRP[key].split('|').forEach(function(e,n){
      var c=e.charAt(0), m=Array.from(e.slice(2)), hv=(CI[c]!=null&&DATA[CI[c]][4])?' ('+esc(DATA[CI[c]][4])+')':'';
      h+='<option value="'+n+'">'+esc(c)+hv+' · '+m.length+' — '+esc(m.slice(0,6).join(''))+(m.length>6?'…':'')+'</option>';
    });
    selEl.innerHTML=h;
  }
  fillG(gB,'b','同声符 · phần sau');
  fillG(gF,'f','同部首 · phần trước');
  function applyG(key,selEl){
    var n=selEl.value, other=(selEl===gB)?gF:gB;
    other.value=''; qi.value=''; q='';
    if(n===''){ grp=''; LIST=DATA.map(function(_,i){return i;}); }
    else{
      grp=key+n;
      LIST=Array.from(GRP[key].split('|')[+n].slice(2)).map(function(c){return CI[c];}).filter(function(i){return i!=null;}).sort(function(a,b){return a-b;});
    }
    PAGES=Math.max(1,Math.ceil(LIST.length/PER)); page=0; buildSel(); render();
  }
  gB.addEventListener('change',function(){ applyG('b',gB); });
  gF.addEventListener('change',function(){ applyG('f',gF); });
  function applyQ(v){
    grp=''; gB.value=''; gF.value='';
    q=v; var t=norm(v), out=[], strict=(low(v)!==t), tq=strict?low(v):t;
    if(!t){ LIST=DATA.map(function(_,i){return i;}); }
    else{
      var chars=Array.from(v).filter(function(c){ return /[\u3400-\u9fff\uf900-\ufaff]/.test(c); });
      var hits=[], rest=[];
      DATA.forEach(function(d,i){
        if(chars.length){ if(chars.indexOf(d[0])>=0) hits.push(i); return; }
        var h=strict?HVS[i]:HVN[i], words=h.split(/[\s,;\/、・]+/);
        if(words.indexOf(tq)>=0) hits.push(i);
        else if(h.indexOf(tq)>=0) rest.push(i);
      });
      if(chars.length){ hits.sort(function(x,y){ return chars.indexOf(DATA[x][0])-chars.indexOf(DATA[y][0]); }); }
      LIST=hits.concat(rest);
    }
    PAGES=Math.max(1,Math.ceil(LIST.length/PER)); page=0; buildSel(); render();
  }
  function render(){
    var a=page*PER, h='';
    for(var j=a;j<Math.min(LIST.length,a+PER);j++){
      var i=LIST[j], d=DATA[i];
      h+='<div class="kj-c lv-n'+d[1]+'" tabindex="0" role="button" aria-label="めくる"><div class="kj-in"><div class="kj-fa"><div class="kj-k">'+esc(d[0])+'</div></div>'+
         '<div class="kj-bk"><div class="kj-k">'+esc(d[0])+'</div><div class="kj-r"><div class="on">'+esc(d[2].join(' / '))+'</div><div class="kun">'+esc(d[3].join(' / '))+'</div></div>'+
         '<div class="kj-f"><span class="kj-hv">'+esc(d[4])+'</span><span class="kj-n"><i>N'+d[1]+'</i>'+(i+1)+'</span></div></div></div></div>';
    }
    if(!LIST.length) h='<div class="kj-none">'+__XH('Không tìm thấy kết quả','見つかりません','No results')+'</div>';
    grid.innerHTML=h; grid.scrollTop=0; allOn=false; setAllLabel();
    sel.value=page; pg.textContent=(page+1)+' / '+PAGES;
    prev.disabled=page<=0; next.disabled=page>=PAGES-1;
    if(!q&&!grp){ try{ localStorage.setItem('kanjiPage',String(page)); }catch(e){} }
  }
  function go(n){ n=Math.max(0,Math.min(PAGES-1,n)); if(n===page&&grid.childNodes.length) return; page=n; render(); }
  qi.addEventListener('input',function(){ applyQ(qi.value); });
  prev.addEventListener('click',function(){ go(page-1); });
  next.addEventListener('click',function(){ go(page+1); });
  sel.addEventListener('change',function(){ go(parseInt(sel.value,10)); });
  /* --- lật thẻ: bấm → lật + phóng to 2x tại chỗ (không vượt khung); bấm lại → lật về & trở lại vị trí cũ --- */
  var allOn=false, allBtn=panel.querySelector('#kjAll');
  function unzoom(c){ if(c.classList.contains('zoom')){ c.classList.add('kj-unz'); setTimeout(function(){ c.classList.remove('kj-unz'); },400); } c.classList.remove('zoom','flip'); c.style.removeProperty('--zx'); c.style.removeProperty('--zy'); }
  function flipCard(c){
    if(c.classList.contains('zoom')){ unzoom(c); return; }
    if(allOn){ c.classList.toggle('flip'); return; }          /* đang ở chế độ lật tất cả: không phóng to */
    if(c.classList.contains('flip')){ c.classList.remove('flip'); return; }
    grid.querySelectorAll('.kj-c.zoom').forEach(unzoom);       /* chỉ phóng to một thẻ mỗi lần */
    var g=grid.getBoundingClientRect(), r=c.getBoundingClientRect(), dx=0, dy=0;
    var l=r.left-r.width/2, rt=r.right+r.width/2, t=r.top-r.height/2, bt=r.bottom+r.height/2;
    if(l<g.left) dx=g.left-l; else if(rt>g.right) dx=g.right-rt;
    if(t<g.top) dy=g.top-t; else if(bt>g.bottom) dy=g.bottom-bt;
    c.style.setProperty('--zx',dx+'px'); c.style.setProperty('--zy',dy+'px');
    c.classList.add('flip','zoom');
  }
  function setAllLabel(){ allBtn.textContent=allOn?'全て戻す':'全てめくる'; }
  allBtn.addEventListener('click',function(){
    allOn=!allOn;
    grid.querySelectorAll('.kj-c').forEach(function(c){ unzoom(c); if(allOn) c.classList.add('flip'); });
    setAllLabel();
  });
  grid.addEventListener('click',function(e){ var c=e.target.closest('.kj-c'); if(c) flipCard(c); });
  grid.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('kj-c')){ e.preventDefault(); flipCard(e.target); } });
  var tx=null;
  grid.addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
  grid.addEventListener('touchend',function(e){ if(tx==null) return; var dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>80) go(page+(dx<0?1:-1)); },{passive:true});
  document.addEventListener('keydown',function(e){
    if(!panel.classList.contains('show')) return;
    if(e.target===gB||e.target===gF) return;
    if(e.target===qi){ if(e.key==='Escape'){ if(qi.value){ qi.value=''; applyQ(''); } else qi.blur(); } return; }
    if(e.key==='ArrowRight'||e.key==='PageDown') go(page+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') go(page-1);
    else if(e.key==='Escape') closeK();
  });
  /* nút sidebar: nằm ngay trên ゲーム */
  var kbtn=document.createElement('button'); kbtn.className='side-branch-head kj-btn';
  kbtn.innerHTML='<span class="bt"><b>'+__XH('Hán tự','漢字','Kanji')+'</b></span>';
  var kwrap=document.createElement('div'); kwrap.className='side-branch'; kwrap.appendChild(kbtn);
  var gwrap=gb.parentNode; nav.insertBefore(kwrap,gwrap);
  function openK(){
    var tp=document.getElementById('topicPanel'); if(tp) tp.classList.remove('show');
    var gp=document.getElementById('gamePanel'); if(gp) gp.classList.remove('show'); gb.classList.remove('active');
    nav.querySelectorAll('.side-item').forEach(function(b){ b.classList.remove('active'); });
    var ctrl=nav.querySelector('.side-ctrl'); if(ctrl) ctrl.style.display='none';
    try{ currentTopic=null; }catch(e){}
    kbtn.classList.add('active'); document.body.classList.remove('side-open');
    page=Math.min(page,PAGES-1); render(); panel.classList.add('show');
  }
  function closeK(){ panel.classList.remove('show'); kbtn.classList.remove('active'); }
  kbtn.addEventListener('click',openK);
  panel.querySelector('#kjClose').addEventListener('click',closeK);
  gb.addEventListener('click',closeK);
  var home=nav.querySelector('.side-item.home'); if(home) home.addEventListener('click',closeK);
  var origSel=selectTopic; selectTopic=function(id){ closeK(); origSel(id); };
})();
</script>


<script>
/* ===== Thanh kéo thu gọn header + tìm kiếm toàn bộ nội dung ===== */
(function(){
  var side=document.getElementById('side');
  if(!side||typeof TOPICS==='undefined') return;
  var header=side.querySelector('header'), nav=side.querySelector('.side-nav');
  if(!header||!nav) return;

  /* ---------- 1) Thanh kéo ---------- */
  var grip=document.createElement('button');
  grip.type='button'; grip.className='hdr-grip';
  grip.title='Kéo lên để ẩn logo & tên app · kéo xuống để hiện lại';
  grip.setAttribute('aria-label','Ẩn/hiện logo và tên ứng dụng');

  var collapsed=false;
  try{ localStorage.removeItem('hdrCollapsed'); }catch(e){}
  var full=function(){ return header.scrollHeight; };
  function setState(c,animate){
    collapsed=c;
    grip.setAttribute('aria-expanded',c?'false':'true');
    try{ localStorage.setItem('hdrCollapsed',c?'1':'0'); }catch(e){}
    header.classList.toggle('dragging',!animate);
    if(c){
      header.style.height=header.getBoundingClientRect().height+'px';
      void header.offsetHeight;
      header.style.height='0px';
    }else{
      header.style.height=full()+'px';
    }
  }
  /* mở thì trả về auto để tự co giãn theo độ rộng sidebar */
  header.addEventListener('transitionend',function(e){
    if(e.propertyName==='height' && !collapsed) header.style.height='auto';
  });
  if(collapsed){ header.classList.add('dragging'); header.style.height='0px'; }
  grip.setAttribute('aria-expanded',collapsed?'false':'true');

  var drag=null;
  grip.addEventListener('pointerdown',function(e){
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add('active');
    drag={y:e.clientY,h:header.getBoundingClientRect().height,full:full(),moved:false,dy:0};
    header.classList.add('dragging');
    header.style.height=drag.h+'px';
  });
  grip.addEventListener('pointermove',function(e){
    if(!drag) return;
    var dy=e.clientY-drag.y; drag.dy=dy;
    if(Math.abs(dy)>3) drag.moved=true;
    if(drag.moved) header.style.height=Math.max(0,Math.min(drag.full,drag.h+dy))+'px';
  });
  function endDrag(e){
    if(!drag) return;
    var d=drag; drag=null; grip.classList.remove('active');
    try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
    if(!d.moved){ header.style.height=d.h+'px'; setState(!collapsed,true); return; }
    var h=parseFloat(header.style.height)||0;
    header.classList.remove('dragging');
    var c=h<d.full*0.5;
    /* thả ở giữa: theo hướng kéo */
    if(Math.abs(d.dy)>6){ c = d.dy<0 ? h<d.full*0.85 : h<d.full*0.15; }
    setState(c,true);
  }
  grip.addEventListener('pointerup',endDrag);
  grip.addEventListener('pointercancel',endDrag);
  grip.addEventListener('click',function(e){ if(e.detail===0) setState(!collapsed,true); }); /* bàn phím */
  window.addEventListener('resize',function(){ if(!collapsed && header.style.height!=='auto') header.style.height='auto'; });

  /* ---------- 2) Ô tìm kiếm ---------- */
  var box=document.createElement('div'); box.className='srch';
  box.innerHTML='<div class="srch-box" role="search">'
    +'<svg class="srch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
    +'<input id="sideSearch" type="search" placeholder="検索" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="検索">'
    +'<button type="button" class="srch-clear" aria-label="クリア">&#10005;</button></div>'
    +'<div class="srch-count" aria-live="polite"></div>';
  header.after(box);
  var results=document.createElement('div'); results.className='srch-results'; results.id='srchResults';
  box.after(results);
  var input=box.querySelector('input'), clearBtn=box.querySelector('.srch-clear'), countEl=box.querySelector('.srch-count');

  /* chuẩn hóa: bỏ dấu tiếng Việt, katakana→hiragana, full-width→half-width, không phân biệt hoa/thường */
  function norm(s){
    return String(s==null?'':s).normalize('NFKC').toLowerCase()
      .replace(/[ァ-ヶ]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')
      .replace(/\s+/g,' ').trim();
  }
  function strings(o,out,depth){
    if(o==null||depth>5) return out;
    if(typeof o==='string'){ out.push(o); return out; }
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) strings(o[i],out,depth+1); return out; }
    if(typeof o==='object'){ for(var k in o) if(k!=='level') strings(o[k],out,depth+1); }
    return out;
  }
  function topicName(t){ return t.id.replace(/^\d+\.\s*/,''); }

  var INDEX=null;
  function build(){
    var ix=[];
    TOPICS.forEach(function(t,ti){
      var nm=topicName(t);
      ix.push({k:'t',ti:ti,idx:-1,p:norm(nm+' '+t.title),r:'',m:'',x:'',w:t.title,rd:'',mn:(t.icon?t.icon+' ':'')+nm,tn:''});
      (t.vocab||[]).forEach(function(v,i){
        var w=v.word||'', ws=[w], ms=[v.meaning||'', v.hanviet||''], rs=[v.reading||''];
        if(v.pair) v.pair.forEach(function(q){ ws.push(q.word||''); rs.push(q.reading||''); ms.push(q.meaning||''); });
        var used=[w,v.reading,v.meaning,v.hanviet];
        var rest=strings({a:v.note,b:v.example,c:v.example_reading,d:v.example_meaning,e:v.examples,f:v.chars,g:v.poem,h:v.pair,i:v.pair_label},[],0);
        ix.push({k:'v',ti:ti,idx:i,lv:v.level||'',p:norm(ws.join(' ')),r:norm(rs.join(' ')),m:norm(ms.join(' ')),x:norm(rest.join(' ')),
          w:w,rd:v.reading||'',mn:(v.meaning||'')+(v.hanviet&&v.hanviet!==v.meaning?'  ·  '+v.hanviet:''),tn:nm});
      });
      (t.grammar||[]).forEach(function(g,i){
        ix.push({k:'g',ti:ti,idx:i,p:norm(g.pattern||''),r:'',m:norm(g.usage||''),
          x:norm(strings({a:g.example,b:g.example_reading,c:g.example_meaning},[],0).join(' ')),
          w:g.pattern||'',rd:'',mn:g.usage||'',tn:nm});
      });
      (t.compare||[]).forEach(function(c,i){
        var items=c.items||[];
        ix.push({k:'c',ti:ti,idx:i,
          p:norm((c.label||'')+' '+items.map(function(w){return w.word||'';}).join(' ')),
          r:norm(items.map(function(w){return w.reading||'';}).join(' ')),
          m:norm(items.map(function(w){return w.meaning||'';}).join(' ')),
          x:norm(strings([c.note,items],[],0).join(' ')),
          w:c.label||'',rd:'',mn:items.map(function(w){return w.meaning||'';}).filter(Boolean).join(' / '),tn:nm});
      });
    });
    var gb=document.querySelector('.game-btn');
    if(gb) ix.push({k:'game',ti:-1,idx:-1,p:norm('しりとり shiritori game trò chơi nối từ ゲーム'),r:'',m:'',x:'',w:'しりとり',rd:'',mn:'Trò chơi nối từ',tn:'ゲーム',el:gb});
    return ix;
  }

  var KIND={t:'題',v:'語',g:'文',c:'比',game:'遊'};
  function score(e,q,toks){
    if(e.p===q) return 0;
    if(e.p.indexOf(q)===0) return 1;
    if(e.r===q) return 1;
    if(e.r.indexOf(q)===0) return 2;
    if(e.p.indexOf(q)>=0) return 3;
    if(e.r.indexOf(q)>=0) return 4;
    if(e.m===q) return 4;
    if((' '+e.m).indexOf(' '+q)>=0) return 5;
    if(e.m.indexOf(q)>=0) return 6;
    if(e.x.indexOf(q)>=0) return 8;
    if(toks.length>1){
      var all=e.p+' '+e.r+' '+e.m, ok=true, ok2=true;
      for(var i=0;i<toks.length;i++){ if(all.indexOf(toks[i])<0) ok=false; if((all+' '+e.x).indexOf(toks[i])<0) ok2=false; }
      if(ok) return 7;
      if(ok2) return 9;
    }
    return -1;
  }

  var shown=0, list=[], curKey=null, PAGE=60, curQ='';
  function render(){
    var frag=document.createDocumentFragment();
    for(var i=shown;i<Math.min(list.length,shown+PAGE);i++){
      var e=list[i], b=document.createElement('button'); b.type='button'; b.className='srch-item'; b.dataset.i=i;
      var color='';
      if(e.k==='v'&&typeof LEVEL_MAP!=='undefined'&&LEVEL_MAP[e.lv]) color=LEVEL_MAP[e.lv].color;
      else if(e.k==='g') color='#5B7A6B';
      else if(e.k==='c') color='#8B5CB8';
      b.innerHTML='<span class="srch-tag"'+(color?' style="--c:'+color+'"':'')+'>'+KIND[e.k]+'</span>'
        +'<span class="srch-main"><span class="srch-w">'+escapeHtml(e.w)+'</span>'+(e.rd?'<span class="srch-r">'+escapeHtml(e.rd)+'</span>':'')
        +(e.mn?'<span class="srch-m">'+escapeHtml(e.mn)+'</span>':'')
        +(e.tn?'<span class="srch-t">'+escapeHtml(e.tn)+(e.k==='g'?__XH(' · Ngữ pháp',' · 文法',' · Grammar'):e.k==='c'?__XH(' · So sánh',' · 比較',' · Compare'):'')+'</span>':'')+'</span>';
      if(curKey===e.k+':'+e.ti+':'+e.idx) b.classList.add('cur');
      frag.appendChild(b);
    }
    var old=results.querySelector('.srch-more'); if(old) old.remove();
    results.appendChild(frag);
    shown=Math.min(list.length,shown+PAGE);
    if(shown<list.length){
      var m=document.createElement('button'); m.type='button'; m.className='srch-more';
      m.textContent=__X('Hiện thêm ('+(list.length-shown)+')','もっと表示 ('+(list.length-shown)+')','Show more ('+(list.length-shown)+')'); results.appendChild(m);
    }
  }

  function run(){
    var raw=input.value, q=norm(raw);
    box.classList.toggle('has-q',!!raw);
    curQ=q;
    if(!q){ side.classList.remove('searching'); results.innerHTML=''; countEl.textContent=''; list=[]; shown=0; return; }
    if(!INDEX) INDEX=build();
    var toks=q.split(' ').filter(Boolean), hits=[];
    for(var i=0;i<INDEX.length;i++){
      var s=score(INDEX[i],q,toks);
      if(s>=0) hits.push({e:INDEX[i],s:s,o:i});
    }
    hits.sort(function(a,b){ return a.s-b.s || (a.e.k==='t'?-1:0)-(b.e.k==='t'?-1:0) || a.e.p.length-b.e.p.length || a.o-b.o; });
    list=hits.map(function(h){return h.e;}); shown=0;
    side.classList.add('searching'); results.innerHTML=''; (function(){ var t=results.offsetTop-box.offsetHeight-4; if(side.scrollTop>t) side.scrollTop=Math.max(0,t); })();
    if(!list.length){
      countEl.textContent='';
      results.innerHTML = `<div class="srch-empty">${__XH('Không tìm thấy “'+escapeHtml(raw.trim())+'”.<br>Hãy thử từ khóa ngắn hơn, hoặc nhập nghĩa tiếng Việt, chữ Hán hoặc cách đọc.','“'+escapeHtml(raw.trim())+'” が見つかりません。<br>より短いキーワードを試すか、ベトナム語の意味、漢字、または読み方を入力してください。','No results for “'+escapeHtml(raw.trim())+'”.<br>Try a shorter keyword, or enter the Vietnamese meaning, kanji, or reading.')}</div>`;
      return;
    }
    countEl.textContent=list.length+' 件';
    render();
  }
  var tmr=0;
  input.addEventListener('input',function(){ clearTimeout(tmr); tmr=setTimeout(run,110); });
  input.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ input.value=''; run(); }
    else if(e.key==='Enter'){ clearTimeout(tmr); run(); var f=results.querySelector('.srch-item'); if(f) f.click(); }
    else if(e.key==='ArrowDown'){ var f2=results.querySelector('.srch-item'); if(f2){ e.preventDefault(); f2.focus(); } }
  });
  results.addEventListener('keydown',function(e){
    var cur=document.activeElement; if(!cur||!cur.classList.contains('srch-item')) return;
    if(e.key==='ArrowDown'&&cur.nextElementSibling&&cur.nextElementSibling.classList.contains('srch-item')){ e.preventDefault(); cur.nextElementSibling.focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(cur.previousElementSibling) cur.previousElementSibling.focus(); else input.focus(); }
  });
  clearBtn.addEventListener('click',function(){ input.value=''; run(); input.focus(); });

  /* ---------- 3) Nhấp kết quả → nhảy tới đúng vị trí ---------- */
  function focusCard(c){
    var go=function(){ c.scrollIntoView({block:'center'}); };
    go(); setTimeout(go,160); setTimeout(go,520);
    c.classList.remove('srch-hit'); void c.offsetWidth; c.classList.add('srch-hit');
    setTimeout(function(){ c.classList.remove('srch-hit'); },3600);
  }
  function locate(sel){
    var tries=0;
    (function wait(){
      var c=document.querySelector('#itemContainer '+sel);
      if(c){ focusCard(c); return; }
      if(++tries<240) requestAnimationFrame(wait);
    })();
  }
  results.addEventListener('click',function(ev){
    var more=ev.target.closest('.srch-more'); if(more){ render(); return; }
    var b=ev.target.closest('.srch-item'); if(!b) return;
    var e=list[+b.dataset.i]; if(!e) return;
    results.querySelectorAll('.srch-item.cur').forEach(function(x){ x.classList.remove('cur'); });
    b.classList.add('cur'); curKey=e.k+':'+e.ti+':'+e.idx;

    if(e.k==='t'){ return; }
    locate('.item-card[data-idx="'+e.idx+'"]');
  });
})();

var me={kind:'hak',mode:mode,pk:tw?'mix':(cfg.k||'mix'),lv:tw?'all':(cfg.l||'all'),wk:cfg.wk||[],run:S.hkn,fl:1,fc:0,lives:HK_LIVES,i:0,right:0,wrong:0,rq:[],recent:[],miss:{},st:{o:[0,0],k:[0,0],v:[0,0]},q:null,ans:null,ok:null,act:0,t0:Date.now(),fin:0,over:null,won:0,banner:'',el:0};
if(!tw&&me.lv=='weak'&&!me.wk.length)me.wk=hkWeak().map(function(k){return k.c});
B=me;hkQ();if(!B.q){abort();return}
if(tw){me.tid=setInterval(function(){if(B!==me){clearInterval(me.tid);return}if(me.fin||me.over||!me.q||me.ans!=null)return;
var left=(me.dl-Date.now())/1000;if(left<=0){hakAns(-1);draw();return}
var a=document.getElementById('kgTm'),b=document.getElementById('kgTb'),w=document.getElementById('kgTmw');
if(a)a.textContent=fmt(left);if(b)b.style.width=(left/me.sec*100)+'%';if(w)w.classList.toggle('low',left<me.sec*.3)},200)}
save()}
function hakAns(j){if(!B||B.kind!='hak'||B.ans!=null||B.fin||B.over||!B.q)return;var q=B.q,ok=j>=0&&q.opts[j]===q.kj;
B.ans=j;B.ok=ok;B.leftA=Math.max(0,(B.dl-Date.now())/1000);B.act+=Date.now()-B.qt0;B.banner='';tick();B.i++;
var st=B.st[q.kind];st[1]++;if(ok){st[0]++;B.right++;if(B.mode=='tower')B.fc++}
else{B.wrong++;B.miss[q.kj.c]=1;if(B.mode=='tower')B.lives--;if(B.rq.length<12)B.rq.push({c:q.kj.c,kind:q.kind,rev:q.rev,due:B.i+3+Math.floor(Math.random()*3)})}
hkRec(q.kj,q.kind,ok);save()}
function hakNext(){if(!B||B.kind!='hak'||B.ans==null||B.fin||B.over)return;
if(B.mode=='tower'){
if(B.lives<=0){hkEnd('lose');return}
if(B.fc>=HK_FLOOR){var cl=B.fl;B.fc=0;if(cl>(S.hkb||0)){S.hkb=cl;S.xp+=10}B.fl++;
var up={3:'N3',5:'N2',7:'N1'}[B.fl],gl=B.lives<HK_LIVES;if(gl)B.lives++;
B.banner='⬆ Qua tầng '+cl+'! Lên tầng '+B.fl+(gl?' · +1 mạng':'')+(up?' · mở thêm chữ '+up:'')+(B.fl>=7?' · 6 đáp án':'');
save();head();
if(cl>=HK_WIN&&!B.won){B.won=1;hkWin();return}}}
hkQ();if(!B.q)hkEnd('done')}
function hkWin(){var first=!S.st['hak|hak'];S.st['hak|hak']=1;B.first=first;B.gain=first?300:0;if(first)S.xp+=300;
B.el=Math.max(1,Math.round(B.act/1000));var key='hak|hak',R=recs(),old=R[key];B.prev=old||null;
if(!old||B.el<old.sec){R[key]={sec:B.el,n:B.i,name:who(),id:(window.FUSOU_USER&&window.FUSOU_USER.id)||'',date:new Date().toLocaleDateString('sv-SE')};B.rec=old?'beat':'first';try{localStorage.setItem(RK_KEY,JSON.stringify(R))}catch(e){}}
award();save();head();B.over='win'}
function hkEnd(why){if(B.fin)return;B.fin=1;B.over=why;if(B.tid)clearInterval(B.tid);B.el=Math.max(1,Math.round(B.act/1000));save();head()}
function hakKey(e){if(!B||B.kind!='hak')return false;var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return false;
if((e.key===' '||e.key==='Spacebar'||e.key==='Enter')&&B.ans!=null&&!B.fin&&!B.over&&tg!=='BUTTON'){e.preventDefault();hakNext();draw();gtop();return true}
if(B.ans==null&&!B.over&&!B.fin&&B.q&&/^[1-6]$/.test(e.key)&&+e.key<=B.q.opts.length){e.preventDefault();hakAns(+e.key-1);draw();return true}
return false}

/* ---- giao diện ---- */
function hkRows(k,hit){var r=function(key,lab,txt){return'<div class="hk-r'+(hit==key?' hit':'')+'"><span>'+lab+'</span><b>'+esc(txt||'—')+'</b></div>'};
return r('o','音 On',k.on.join(' / '))+r('k','訓 Kun',k.kun.map(hkRdc).join(' / '))+r('v','Hán Việt',k.hv)}
function hkCard(k,hit,cls){return'<div class="hk-card'+(cls?' '+cls:'')+'"><div class="hk-kc"><b class="jp">'+esc(k.c)+'</b><i>'+k.l.toUpperCase()+'</i></div><div class="hk-rows">'+hkRows(k,hit)+'</div></div>'}
function hkEx(k){var a=(HKW[k.c]||[]).slice().sort(function(x,y){return Math.abs(x.w.length-2)-Math.abs(y.w.length-2)}).slice(0,2);
return a.length?'<ul class="hk-ex">'+a.map(function(x){return'<li><b class="jp">'+esc(x.w)+'</b>'+(x.r?' <span class="kg-rd">'+esc(x.r)+'</span>':'')+' — '+esc(String(x.m).split('\n')[0])+'</li>'}).join('')+'</ul>':''}
function hkFb(q){var ok=B.ok,k=q.kj,ch=B.ans>=0?q.opts[B.ans]:null;
var o='<div class="kg-fb hk-fb"><div class="kg-fb-h '+(ok?'ok':'bad')+'">'+(ok?'✔ Chính xác':B.ans<0?'⏱ Hết giờ':'✘ Chưa đúng')+'</div>'+hkCard(k,q.kind)+hkEx(k);
if(q.kind=='o'&&k.on.length){var sm=(HKON[k.on[0]]||[]).filter(function(x){return x.c!==k.c}).slice(0,8);if(sm.length)o+='<div class="kg-sub" style="margin:6px 0 0">Cùng âm On '+esc(k.on[0])+': <b class="jp">'+esc(sm.map(function(x){return x.c}).join(' '))+'</b></div>'}
if(!ok&&ch)o+='<div class="kg-fb-h bad">✘ Bạn đã chọn '+(q.rev?'chữ':'<b>'+esc(hkLab(ch,q.kind))+'</b> — đó là '+HK_KL[q.kind]+' của chữ')+':</div>'+hkCard(ch,q.kind,'bad');
var rest=q.opts.filter(function(x){return x!==k&&x!==ch});
if(rest.length)o+='<details'+(ok?'':' open')+'><summary>Các đáp án còn lại</summary>'+rest.map(function(x){return hkCard(x,q.kind)}).join('')+'</details>';
return o+'</div>'}
function hkOpts(q){return'<div class="kg-opts hk-o'+(q.opts.length>4&&q.rev?' o6':'')+'">'+q.opts.map(function(x,j){var k='';if(B.ans!=null){if(x===q.kj)k='ok';else if(j==B.ans)k='bad'}
var inner=q.rev?'<span class="jp">'+esc(x.c)+'</span>'+(B.ans!=null?'<small>'+esc(hkLab(x,q.kind))+'</small>':''):esc(hkLab(x,q.kind));
return'<button class="'+k+'" data-o="'+j+'"'+(B.ans!=null?' disabled':'')+'>'+'<i class="kg-nk">'+(j+1)+'</i>'+inner+'</button>'}).join('')+'</div>'}
function hkHearts(){return new Array(Math.max(0,B.lives)+1).join('❤')+new Array(Math.max(0,HK_LIVES-B.lives)+1).join('♡')}
function hkPracLab(){return({mix:'Hỗn hợp',o:'On',k:'Kun',v:'Hán Việt'})[B.pk]+' · '+(B.lv=='all'?'Tất cả cấp':B.lv=='weak'?'Chữ yếu':B.lv.toUpperCase())}
function playHak(){if(B.over)return hakEnd();var q=B.q,tw=B.mode=='tower',o='';
if(tw){var left=B.ans!=null?(B.leftA||0):Math.max(0,(B.dl-Date.now())/1000),pct=left/B.sec*100;
o+='<div class="kg-bh"><span class="kg-bn">白澤 · Tầng '+B.fl+' <span class="hk-lv">'+hkHearts()+'</span></span><div class="kg-tmw'+(pct<30?' low':'')+'" id="kgTmw"><b id="kgTm">'+fmt(left)+'</b></div></div><div class="kg-tbar"><i id="kgTb" style="width:'+pct+'%"></i></div>'
+'<div class="kg-hud"><span>Tầng '+B.fl+' · '+B.fc+' / '+HK_FLOOR+' chữ</span><div class="kg-hp"><i style="width:'+(B.fc/HK_FLOOR*100)+'%"></i></div><span>'+B.right+' đúng</span></div>'}
else o+='<div class="kg-hud"><span>練習 · '+hkPracLab()+'</span><div class="kg-hp"><i style="width:'+(B.i?B.right/B.i*100:0)+'%"></i></div><span>'+B.right+' / '+B.i+' đúng</span></div>';
o+='<div class="kg-panel'+(B.ok===false?' kg-shake':'')+'">'+(B.banner?'<div class="hk-banner">'+esc(B.banner)+'</div>':'')
+'<div class="kg-sub">'+(q.rev?'Chọn chữ Hán có '+HK_KL[q.kind]+':':'Chữ này có '+HK_KL[q.kind]+' là gì?')+'</div><div class="kg-big'+(q.rev?' hk-lab':'')+'">'+esc(q.rev?hkLab(q.kj,q.kind):q.kj.c)+'</div>'+hkOpts(q);
if(B.ans!=null)o+=hkFb(q)+'<button class="kg-btn" data-act="hnext" style="margin-top:12px">'+(tw&&B.lives<=0?'結果 Xem kết quả':'次へ')+' → <small>hoặc nhấn Space</small></button>';
if(!tw)o+='<button class="kg-btn ghost" data-act="hend" style="margin-top:8px">Kết thúc luyện tập</button>';
return o+'</div>'}
function hakEnd(){var st=B.st,ac=function(k){var s=st[k];return s[1]?Math.round(s[0]/s[1]*100)+'% ('+s[0]+'/'+s[1]+')':'–'};
var stats='<p class="kg-sub" style="text-align:center">On: <b>'+ac('o')+'</b> · Kun: <b>'+ac('k')+'</b> · Hán Việt: <b>'+ac('v')+'</b></p>',tw=B.mode=='tower';
if(B.over=='win')return'<div class="kg-panel kg-win" style="text-align:center"><div class="kg-big" style="color:var(--accent)">白澤 · 降伏</div><p class="kg-sub" style="text-align:center;margin-top:0">Bạch Trạch đã khuất phục · Ấn thử thách về tay bạn</p><div class="kg-sealbox big got">'+hkSeal()+'</div><p><b>Ấn Bạch Trạch</b>'+(B.first?' · +'+B.gain+' XP':' · (đã nhận từ trước)')+'</p>'
+'<div class="kg-tbx"><span>⏱ Qua '+HK_WIN+' tầng trong <strong>'+fmt(B.el)+'</strong> · '+B.i+' câu<br>'+(B.rec=='first'?'🏆 <strong>Kỷ lục mới!</strong> '+esc(who()):B.rec=='beat'?'🏆 <strong>Phá kỷ lục!</strong> '+esc(who())+' phá '+fmt(B.prev.sec)+' của '+esc(B.prev.name):(function(){var r=recGet({id:'hak'},'hak');return r?recTxt(r,r.n):''})())+'</span></div>'+stats
+'<button class="kg-btn" data-act="hcont">登る Leo tiếp (không giới hạn)</button><button class="kg-btn ghost" data-act="menu">Về Bạch Trạch</button><button class="kg-btn ghost" data-act="map">Về bản đồ</button></div>';
var ms=Object.keys(B.miss).filter(function(c){return KJM[c]});
return'<div class="kg-panel kg-lose" style="text-align:center"><div class="kg-big" style="color:var(--accent)">'+(tw?'挑戦失敗 · Hết mạng':'練習 · Kết quả')+'</div>'
+'<p>'+(tw?'Bạn dừng ở <b>tầng '+B.fl+'</b> · đã qua '+(B.fl-1)+' tầng · ':'')+'<b>'+B.right+'</b> / '+B.i+' câu đúng</p>'+stats+'<p>Thời gian trả lời: '+fmt(B.el)+'</p>'
+(tw?'<p>Bạch Trạch lắc đầu: chữ chưa thuộc thì tháp chưa mở. Ôn lại rồi leo tiếp.</p>':'')
+(ms.length?'<div style="text-align:left"><h4 class="kg-h">Chữ cần ôn ('+ms.length+')</h4>'+ms.slice(0,12).map(function(c){return hkCard(KJM[c],'')}).join('')+(ms.length>12?'<p class="kg-sub">… và '+(ms.length-12)+' chữ nữa — xem trong mục Chữ yếu.</p>':'')+'</div>':'')
+(tw?'<button class="kg-btn" data-act="hakt">もう一度 Leo lại</button>':'')
+(ms.length?'<button class="kg-btn'+(tw?' ghost':'')+'" data-act="hakw">復習 Ôn '+ms.length+' chữ vừa sai</button>':'')
+'<button class="kg-btn ghost" data-act="menu">Về Bạch Trạch</button></div>'}
function hkSeg(key,arr,cur){return'<div class="hk-seg">'+arr.map(function(a){return'<button class="'+(cur==a[0]?'on':'')+'" data-hk="'+key+':'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>'}
function hakChapter(){var g=!!S.st['hak|hak'],r=recGet({id:'hak'},'hak'),m=hkMastN(),tot=KJD.length,H=S.hkc,hs=S.hs,weak=hkWeak().length,cnt=hkCount(H.k,H.l),sy=STY(),hst=(sy&&sy.hak)||{};
var ac=function(k){var s=hs[k];return s&&s[1]?Math.round(s[0]/s[1]*100)+'%':'–'};
var o=back()+'<div class="kg-ch" style="--c:'+HK_COL+'"><div class="kg-ch-head"><div class="kg-mk k2"><b>白澤</b></div><div><small>任意 · Thử thách</small><h2>Bạch Trạch</h2><p class="kg-ch-ti">'+esc(hst.title||'漢字 · On · Kun · Hán Việt')+'</p>'+(hst.place?'<span class="kg-mp-pl">'+esc(hst.place)+'</span>':'')+'</div></div>'+picOf('hak');
if(hst.setup)o+='<div class="kg-story">'+paras(hst.setup)+'</div>';
o+='<div class="kg-story"><p>Đây là màn thử thách tuỳ chọn: muốn nhận ấn của ông, bạn phải leo hết '+HK_WIN+' tầng tháp của ông.</p><p>Tầng thấp chỉ có chữ N5–N4. Mỗi câu chỉ có '+HK_SEC+' giây (đồng hồ tạm dừng khi bạn xem lại đáp án). Càng lên cao chữ càng khó: đáp án nhiễu càng gần giống, từ tầng 7 có tới 6 lựa chọn, và có cả câu đảo chiều — cho âm đọc, chọn đúng mặt chữ. Qua mỗi tầng được hồi 1 mạng.</p></div>';
o+='<div class="kg-sx'+(g?' got':'')+'" style="--c:'+HK_COL+'"><div class="kg-sx-seal">'+(g?'<div class="kg-sealbox got">'+hkSeal()+'</div>':'<div class="kg-ghost"><span>白澤</span><small>瑞</small></div>')+'</div>'
+'<div class="kg-sx-main"><b>Tháp '+HK_WIN+' tầng · '+HK_LIVES+' mạng</b><small>Mỗi tầng '+HK_FLOOR+' chữ · On, Kun, Hán Việt xen kẽ · từ N5 lên N1'+(g?' · ✔ đã khuất phục':'')+'</small><small>'+(S.hkb?'Tầng cao nhất: '+S.hkb:'Chưa leo tháp')+' · '+(r?recTxt(r,r.n):'🏆 Chưa có kỷ lục')+'</small></div>'
+'<div class="kg-sx-act"><button class="kg-btn" data-act="hakt">挑戦 Leo tháp<small>'+HK_LIVES+' mạng · '+HK_SEC+' giây / câu</small></button></div></div>';
if(g&&hst.resolve)o+='<div class="kg-story kg-story2">'+paras(hst.resolve)+'</div>';
if(g&&hst.moral)o+='<div class="kg-pact"><b>誓</b><span>'+esc(hst.moral)+'</span></div>';
o+='<h3 class="kg-h kg-qh">Tiến độ hán tự</h3><p class="kg-sub">Đã thuộc <b>'+m+' / '+tot+'</b> chữ (đúng cả On, Kun, Hán Việt ở 2 lượt chơi khác nhau).</p><div class="hk-prog"><i style="width:'+(tot?m/tot*100:0)+'%"></i></div><p class="kg-sub">Tỉ lệ đúng · On '+ac('o')+' · Kun '+ac('k')+' · Hán Việt '+ac('v')+'</p>';

+hkSeg('k',[['mix','Hỗn hợp'],['o','On 音'],['k','Kun 訓'],['v','Hán Việt']],H.k)
+hkSeg('l',[['n5','N5'],['n4','N4'],['n3','N3'],['n2','N2'],['n1','N1'],['all','Tất cả'],['weak','Chữ yếu ('+weak+')']],H.l)
+'<button class="kg-btn" data-act="hakp"'+(cnt?'':' disabled')+'>練習 Bắt đầu luyện<small>'+cnt+' chữ phù hợp</small></button></div>';
return o}
function hkShuin(){var g=!!S.st['hak|hak'];return'<h3 class="kg-h kg-lh" style="--c:'+HK_COL+'"><span>白澤</span>任意 · Tháp Bạch Trạch<small>'+(g?'✔':'chưa')+'</small></h3><div class="kg-stamps"><div class="kg-book"><div class="kg-sealbox'+(g?' got':'')+'">'+(g?hkSeal():'<div class="kg-ghost"><span>白澤</span><small>瑞</small></div>')+'</div><b>漢字 · On · Kun · Hán Việt</b><div class="kg-sub" style="margin:2px 0 0;font-size:calc(12px*var(--fs,1))">Tầng cao nhất '+(S.hkb||0)+' · thuộc '+hkMastN()+' / '+KJD.length+' chữ</div></div></div>'}

/* ================= TAB 3 · TỪ VỰNG (đã thu thập) ================= */
function none(){return'<p class="kg-sub">Chưa có từ vựng cấp '+S.lv.toUpperCase()+'.</p>'}

<script id="kg-nextbar-js">
(function(){
  var mq=window.matchMedia('(max-width:820px),(pointer:coarse)'),raf=0,SEL='.kg-btn[data-act="next"],.kg-btn[data-act="hnext"]';
  /* đưa nút 次へ lên ngay sau khối 4 đáp án (.kg-opts); phần giải nghĩa tự nằm dưới nút */
  function place(b){
    var p=b.parentElement,o=null;if(!p)return;
    for(var i=0;i<p.children.length;i++){if(p.children[i].classList.contains('kg-opts')){o=p.children[i];break}}

  }
  function sync(){raf=0;if(!mq.matches)return;var l=document.querySelectorAll(SEL);for(var i=0;i<l.length;i++)place(l[i])}
  function qs(){if(!raf)raf=requestAnimationFrame(sync)}
  /* sau khi qua câu: cuộn về đầu câu hỏi mới (đồng hồ + câu hỏi) */
  function toQuestion(){

    setTimeout(function(){requestAnimationFrame(go)},30);setTimeout(go,260);
  }
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest(SEL);/* vị trí câu hỏi do ui-refresh-js căn giữa */},true);
  new MutationObserver(qs).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',qs);qs();
})();
</script>

  function pools(){ var v=[],g=[]; TOPICS.forEach(function(t){ (t.vocab||[]).forEach(function(o){ if(o&&o.word&&o.meaning) v.push(o); }); (t.grammar||[]).forEach(function(o){ if(o&&o.pattern&&o.usage) g.push(o); }); }); return {v:v,g:g}; }
  function distract(pool,pref,key,ans,n){
    var seen={},out=[]; seen[ans]=1;
    function take(arr){ shuffle(arr).some(function(o){ var k=key(o); if(k&&!seen[k]){ seen[k]=1; out.push(o); } return out.length>=n; }); }
    take(pref); if(out.length<n) take(pool); return out;
  }
  function exOf(o){ var e=o.example||(o.examples&&o.examples[0]&&o.examples[0].example)||''; return e; }
  function exList(o){
    var a=(o.examples&&o.examples.length)?o.examples:[{example:o.example,example_meaning:o.example_meaning}];
    return a.filter(function(e){ return e&&e.example; });
  }

  /* ---- đáp án nhiễu: từ có hình chữ / cách đọc gần giống đáp án ---- */
  var CONF='未末|土士|日曰白目自|大犬太天夫|待持特侍寺|午牛|己已巳|万方|力刀|入人|千干|王玉主|休体|検険験倹|候侯|買貫|税説脱悦|眠眼|材村|拾捨|痛通|係孫|軽経径|週周過|院完|返反|貸貨|住往|理埋|板坂|低底抵|洗先|昨作|館管官|形刑型|暑署|晴清情請精|時持|別列|困因|国圏|園遠|鳥烏島|雨両|書昼画|間聞問|開関閉|遊道|強弱|広拡公|古右石|夕外|少小|木本|答合|近折|話語読|冷令|校交|親新|織識職|辞辛|感憾|構購講|最撮|観歓勧|提堤|輸愉|複復腹|祈折|幸辛|指持|役没|納細紙|暮墓慕募|荷何河|現規視|陽場湯|暗音|結詰|銀限|歌欲|決快|絵会|紅虹|練錬|買置|待侍|借惜|暖緩|倒到|汗汁|状伏|抗坑|祝況|冒胃|稲稿|弁并|雪雲|雷電|栄栗|洋羊|茶荼|港巷|橋矯|酒洒|隣憐'.split('|');
  var CG={}; CONF.forEach(function(g,i){ g.split('').forEach(function(c){ (CG[c]=CG[c]||[]).push(i); }); });
  var KJ=/[一-鿿々]/g;
  function kj(w){ return String(w||'').match(KJ)||[]; }
  function confusable(a,b){ var x=CG[a],y=CG[b]; if(!x||!y||a===b) return false; return x.some(function(i){ return y.indexOf(i)>=0; }); }
  function simW(a,b){
    var wa=a.word, wb=b.word; if(!wb||wa===wb) return -1;
    var ka=kj(wa), kb=kj(wb), s=0, i, j;
    ka.forEach(function(c){ if(kb.indexOf(c)>=0) s+=6; else kb.some(function(d){ return confusable(c,d); })&&(s+=5); });
    if(wa.charAt(0)===wb.charAt(0)) s+=2;
    if(wa.charAt(wa.length-1)===wb.charAt(wb.length-1)) s+=2;
    if(wa.length===wb.length) s+=2; else if(Math.abs(wa.length-wb.length)===1) s+=1;
    var ra=a.reading||'', rb=b.reading||'';
    if(ra&&rb){ if(ra===rb) s+=4; else { var p=0; while(p<ra.length&&p<rb.length&&ra.charAt(p)===rb.charAt(p)) p++; var q=0; while(q<ra.length&&q<rb.length&&ra.charAt(ra.length-1-q)===rb.charAt(rb.length-1-q)) q++; s+=Math.min(3,p+q); } }
    return s;
  }
  function simStr(a,b){ var x=String(a).replace(/[〜~\s]/g,''), y=String(b).replace(/[〜~\s]/g,''); if(!y||x===y) return -1; var s=0,seen={}; x.split('').forEach(function(c){ if(!seen[c]&&y.indexOf(c)>=0){ seen[c]=1; s+=2; } }); if(x.length===y.length) s+=1; return s; }
  function lookalikes(o,pool,pref,leak,n){
    var ans=o.word, sm=clipKey(o.meaning), out=[], seen={}; seen[ans]=1;
    function ok(z){ return z.word&&!seen[z.word]&&clipKey(z.meaning)!==sm&&(!leak||leak.indexOf(z.word)<0); }
    var scored=[]; pool.forEach(function(z){ if(!ok(z)) return; var s=simW(o,z); if(s>0) scored.push({z:z,s:s}); });
    scored.sort(function(a,b){ return b.s-a.s; });
    var top=shuffle(scored.slice(0,10));
    top.some(function(x){ if(!seen[x.z.word]){ seen[x.z.word]=1; out.push(x.z); } return out.length>=n; });
    if(out.length<n) shuffle(pref).some(function(z){ if(ok(z)){ seen[z.word]=1; out.push(z); } return out.length>=n; });
    if(out.length<n) shuffle(pool).some(function(z){ if(ok(z)){ seen[z.word]=1; out.push(z); } return out.length>=n; });
    return out;
  }
  function clipKey(m){ return String(m==null?'':m).split('\n')[0].trim(); }
  function wOpt(z,ok){ return {t:z.word,jp:1,ok:ok?1:0,rv:(z.reading?z.reading+' · ':'')+clip(z.meaning,60)}; }

  function mkQ(kind,o,pref,pool){
    var isV=kind.charAt(0)==='v', second=kind.charAt(1)==='2', q={src:o};
    var kM=function(z){ return clip(z.meaning||z.usage,80); };
    var ans, ds, opts;
    if(isV){
      q.exp={w:o.word,r:o.reading||'',m:clip(o.meaning,160),e:exOf(o)};
      var ex=null;
      if(!second){ exList(o).some(function(e){ if(String(e.example).indexOf(o.word)>=0){ ex=e; return true; } return false; }); }
      if(!second&&ex){
        q.lab='Điền từ thích hợp vào chỗ trống'; q.cloze=1;
        q.main=String(ex.example).split(o.word).join('＿＿＿'); q.sub=ex.example_meaning||''; q.exp.e=ex.example;
        ds=lookalikes(o,pool,pref,ex.example,3); opts=[wOpt(o,1)].concat(ds.map(function(z){ return wOpt(z,0); }));
      } else if(!second){
        q.lab='Nghĩa của từ này là gì?'; q.main=o.word; q.sub=o.reading||'';
        ans=kM(o); ds=distract(pool,pref,kM,ans,3); opts=[{t:ans,ok:1}].concat(ds.map(function(z){return {t:kM(z)};}));
      } else {
        q.lab='Từ tiếng Nhật nào có nghĩa này?'; q.main=clip(o.meaning,90); q.sub='';
        ds=lookalikes(o,pool,pref,null,3); opts=[wOpt(o,1)].concat(ds.map(function(z){ return wOpt(z,0); }));
      }
    } else {
      q.exp={w:o.pattern,r:'',m:clip(o.usage,160),e:exOf(o)};
      var kU=function(z){ return clip(z.usage,80); }, kP=function(z){ return z.pattern; };
      var gex=exList(o)[0];
      var gOpts=function(){
        var seen={}, out=[], sc=[]; seen[o.pattern]=1;
        pool.concat(pref).forEach(function(z){ if(!z.pattern||seen[z.pattern]||z.usage===o.usage) return; seen[z.pattern]=1; var s=simStr(o.pattern,z.pattern); sc.push({z:z,s:Math.max(0,s)+Math.random()}); });
        sc.sort(function(a,b){ return b.s-a.s; });
        shuffle(sc.slice(0,10)).slice(0,3).forEach(function(x){ out.push(x.z); });
        return [{t:o.pattern,ok:1,rv:clip(o.usage,60)}].concat(out.map(function(z){ return {t:z.pattern,ok:0,rv:clip(z.usage,60)}; }));
      };
      if(!second&&gex){ q.lab='Câu này dùng mẫu ngữ pháp nào?'; q.main=gex.example; q.sub=gex.example_meaning||''; q.exp.e=gex.example; opts=gOpts(); }
      else if(!second){ q.lab='Mẫu ngữ pháp này dùng để làm gì?'; q.main=o.pattern; q.sub='';
        ans=kU(o); ds=distract(pool,pref,kU,ans,3); opts=[{t:ans,ok:1}].concat(ds.map(function(z){return {t:kU(z)};})); }
      else { q.lab='Mẫu ngữ pháp nào phù hợp với cách dùng này?'; q.main=clip(o.usage,100); q.sub=''; opts=gOpts(); }
    }
    q.opts=shuffle(opts); return q;
  }
  function buildQuiz(){
    var d=rvLoad(), P=pools(), A=[], B=[];
    d.items.forEach(function(it){
      if(it.b!=='vocab'&&it.b!=='grammar') return;
      var x=itemOf(it); if(!x) return;
      var t=x.t, o=t[it.b][it.i]; if(!o) return;
      if(it.b==='vocab'){ if(!o.word||!o.meaning) return;
        var pv=(t.vocab||[]).filter(function(z){return z!==o&&z.word&&z.meaning;});
        var ka=mkQ('v1',o,pv,P.v), kb=mkQ('v2',o,pv,P.v); ka.key=kb.key=o._o||okey(t,o); A.push(ka); B.push(kb); }
      else { if(!o.pattern||!o.usage) return;
        var pg=(t.grammar||[]).filter(function(z){return z!==o&&z.pattern&&z.usage;});
        var ga=mkQ('g1',o,pg,P.g), gb=mkQ('g2',o,pg,P.g); ga.key=gb.key=o._o||okey(t,o); A.push(ga); B.push(gb); }
    });
    A=shuffle(A); B=shuffle(B);
    if(A.length>1&&B[0].src===A[A.length-1].src){ var t0=B[0]; B[0]=B[1]; B[1]=t0; }
    return A.concat(B);
  }
  function rvQuiz(){
    var qs=buildQuiz();
    if(!qs.length){ rvList(); return; }
    Q={qs:qs,i:0,ok:0,wrong:[],ans:false}; qShow();
  }
  var LETTER=['1','2','3','4'];
  function qShow(){
    var q=Q.qs[Q.i], n=Q.qs.length; Q.ans=false;
    var body=shell(rv,'復習 · Ôn tập hôm nay',__XH('Câu <b>'+(Q.i+1)+'</b> / '+n+' · Đúng <b>'+Q.ok+'</b>. Mỗi từ vựng và mẫu ngữ pháp đã mở được hỏi 2 lần bằng 2 kiểu câu hỏi khác nhau.','問 <b>'+(Q.i+1)+'</b> / '+n+' · 正解 <b>'+Q.ok+'</b>。開いた語彙と文法は、2種類の問題形式で2回ずつ出題されます。','Question <b>'+(Q.i+1)+'</b> / '+n+' · Correct <b>'+Q.ok+'</b>. Each vocabulary item and grammar pattern you opened is asked twice, in two different question styles.'),
      '<button type="button" class="dp-btn ghost" data-rv="list">Danh sách đã học</button><button type="button" class="dp-btn ghost" data-rv="close">✕ Thoát</button>');
    rv.classList.remove('mask');
    var h='<div class="kg-hp rq-bar"><i style="width:'+Math.round(Q.i/n*100)+'%"></i></div>'+
      '<div class="rq-q"><span class="rq-lab">'+E(q.lab)+'</span><div class="rq-main'+(q.main.length>10?' long':'')+'">'+E(q.main)+'</div>'+(q.sub?'<div class="rq-sub">'+E(q.sub)+'</div>':'')+'</div>'+
      '<div class="kg-opts">'+q.opts.map(function(o,k){ return '<button type="button" class="rq-opt" data-k="'+k+'"><span class="rq-no">'+LETTER[k]+'</span>'+(o.jp?'<span class="jp">'+E(o.t)+'</span>':E(o.t))+(o.rv?'<small class="rq-rv" hidden>'+E(o.rv)+'</small>':'')+'</button>'; }).join('')+'</div>'+
      '<div class="rq-fb" id="rqFb"></div>';
    body.innerHTML=h;
  }
  function qAnswer(k){
    if(!Q||Q.ans) return; Q.ans=true;
    var q=Q.qs[Q.i], btns=rv.querySelectorAll('.rq-opt'), right=!!q.opts[k].ok;
    btns.forEach(function(b,j){ b.disabled=true; var r=b.querySelector('.rq-rv'); if(r) r.hidden=false; if(q.opts[j].ok) b.classList.add('ok'); else if(j===k) b.classList.add('bad'); });
    if(right) Q.ok++; else Q.wrong.push(q);
    var last=Q.i>=Q.qs.length-1, x=q.exp;
    rv.querySelector('#rqFb').innerHTML='<div class="rq-ex '+(right?'good':'miss')+'"><b>'+(right?'Chính xác!':'Chưa đúng')+'</b> '+E(x.w)+(x.r?' ('+E(x.r)+')':'')+' — '+E(x.m)+(x.e?'<br><span>例：'+E(x.e)+'</span>':'')+'</div><button type="button" class="kg-btn" data-rv="next">'+(last?'Xem kết quả':'次へ →')+'</button>';
    var nb=rv.querySelector('[data-rv="next"]'); if(nb) nb.focus({preventScroll:true});
  }
  function qResult(){
    var n=Q.qs.length, sc=Math.round(Q.ok/n*100), pass=sc>=90, d=rvLoad(), nk=0;
    if(pass){ var ks={}; Q.qs.forEach(function(q){ if(q.key) ks[q.key]=1; }); nk=Object.keys(ks).length; markDone(Object.keys(ks)); }
    if(!d.best||sc>d.best){ d.best=sc; rvSave(d); }
    var body=shell(rv,'結果 · Kết quả ôn tập',__XH('Bài ôn tập hôm nay gồm '+n+' câu hỏi. Điểm được tính trên thang 100.','今日の復習テストは '+n+' 問です。100点満点で採点されます。','Today’s review quiz has '+n+' questions, scored out of 100.'),
      '<button type="button" class="dp-btn" data-rv="quiz">Làm lại</button><button type="button" class="dp-btn ghost" data-rv="list">Danh sách đã học</button><button type="button" class="dp-btn ghost" data-rv="close">✕ Đóng</button>');
    var wr=Q.wrong.map(function(q){ return '<li><b>'+E(q.exp.w)+'</b> '+(q.exp.r?'('+E(q.exp.r)+') ':'')+'— '+E(q.exp.m)+'</li>'; });
    var seen={}; wr=wr.filter(function(x){ if(seen[x]) return false; seen[x]=1; return true; });
    body.innerHTML='<div class="rq-res '+(pass?'pass':'')+'"><div class="rq-score"><b>'+sc+'</b><span>/ 100</span></div><div class="rq-cnt">'+__XH('Đúng '+Q.ok+' / '+n+' câu'+(d.best>sc?' · Điểm cao nhất hôm nay: '+d.best:''),'正解 '+Q.ok+' / '+n+' 問'+(d.best>sc?' · 今日の最高点：'+d.best:''),'Correct '+Q.ok+' / '+n+' questions'+(d.best>sc?' · Best today: '+d.best:''))+'</div>'+
      (pass?'<p class="rq-msg">'+__XH('Bạn làm rất tốt! Cảm ơn bạn vì buổi học ngày hôm nay.','よくできました！今日の学習、ありがとうございました。','Great job! Thank you for studying today.')+'</p><p class="rq-cnt">'+__XH('Đã ghi nhớ '+nk+' mục. Lần sau 「Tự động」 sẽ bỏ qua các mục này.','記憶済み '+nk+' 件。次回の「おまかせ」ではこれらをスキップします。','Memorized '+nk+' items. Next time, Auto-pick will skip them.')+'</p>':'<p class="rq-msg">'+__XH('Cần đạt từ 90/100 để hoàn thành buổi học hôm nay. Hãy xem lại các mục sai bên dưới rồi làm lại nhé.','今日の学習を完了するには90/100点以上が必要です。下の間違えた項目を見直して、もう一度挑戦しましょう。','You need at least 90/100 to complete today’s session. Review the missed items below, then try again.')+'</p>')+'</div>'+
      (wr.length?'<div class="dp-sec"><b>Cần ôn lại</b><span>'+wr.length+' mục</span></div><ul class="rq-wr">'+wr.join('')+'</ul>':'');
  }
  function rvHide(){ rv.hidden=true; rv.innerHTML=''; document.body.style.overflow=el.hidden?'':'hidden'; }
  rv.addEventListener('click',function(e){
    var o=e.target.closest('.rq-opt'); if(o){ qAnswer(+o.dataset.k); return; }
    var b=e.target.closest('[data-rv]'); if(!b) return; var a=b.dataset.rv;
    if(a==='close') rvHide();
    else if(a==='quiz') rvQuiz();
    else if(a==='list') rvList();
    else if(a==='next'){ if(!Q) return; Q.i++; if(Q.i>=Q.qs.length) qResult(); else qShow(); }
    else if(a==='mask'){ RMASK=!RMASK; rvList(); }
    else if(a==='clear'){ if(confirm(__X('Xóa toàn bộ danh sách ôn tập của hôm nay?','今日の復習リストをすべて削除しますか？','Delete today’s entire review list?'))){ var d=rvLoad(); d.items=[]; rvSave(d); badge(); rvList(); } }
  });
  bar.addEventListener('click',function(e){
    var b=e.target.closest('[data-rv]'); if(!b) return;
    if(b.dataset.rv==='open') rvQuiz(); else { document.body.classList.remove('side-open'); show(); }
  });
  document.addEventListener('keydown',function(e){
    if(!rv.hidden&&Q&&rv.querySelector('.rq-opt')){
      var k='1234'.indexOf(e.key);
      if(k>=0&&!Q.ans){ qAnswer(k); return; }
      if((e.key==='Enter'||e.key===' ')&&Q.ans){ var nb=rv.querySelector('[data-rv="next"]'); if(nb){ e.preventDefault(); nb.click(); return; } }
    }
    if(e.key!=='Escape'||document.querySelector('.overlay.show')) return;
    if(!rv.hidden) rvHide(); else if(!el.hidden) hide();
  });

  /* hiện ngay sau khi đăng nhập xong (cổng đăng nhập đóng lại) */
  function check(){
    if(window.FUSOU_USER&&!shown){ shown=true; PEND=null; badge(); loadVT(); show(true); }
  }
  if(gate){ new MutationObserver(check).observe(gate,{attributes:true,attributeFilter:['class','hidden']}); }
  document.addEventListener('fusou:login',function(){ badge(); check(); });
  document.addEventListener('fusou:logout',function(){ shown=false; VT=[]; PEND=null; ST.chosen=false; ST.mode=null; ST.sel=[]; renderSide(); hide(); rvHide(); badge(); });
  check(); badge();
  var hb=document.querySelector('.side-item.home');
  if(hb) hb.addEventListener('click',function(){ document.body.classList.remove('side-open'); document.querySelectorAll('#rndSide .side-item').forEach(function(b){ b.classList.remove('active'); }); show(); });
})();
</script>

<script id="ui-refresh-js">
/* Giữ khung câu hỏi (HUD + câu hỏi + 4 đáp án) ở chính giữa màn hình.
   - Chỉ căn lại khi hiện CÂU MỚI; khi vừa chọn đáp án (hiện phần giải nghĩa phía dưới) thì giữ nguyên vị trí cuộn.
   - Chạy trong microtask của MutationObserver => trước khi trình duyệt vẽ, nên không bị giật/nhảy lên đầu hay cuối trang. */
(function(){
  var PL=document.getElementById('kgPlay'),PV=document.getElementById('kgPV'),RV=document.getElementById('reviewPanel');
  /* chặn các lệnh scrollTop=0 có sẵn (draw/gtop/render ôn tập) kéo khung câu hỏi lên đầu; chỉ ui-refresh được phép cuộn */
  var own=false,D=Object.getOwnPropertyDescriptor(Element.prototype,'scrollTop');
  [PL,RV].forEach(function(el){if(!el||!D)return;
    Object.defineProperty(el,'scrollTop',{configurable:true,get:function(){return D.get.call(el)},
      set:function(v){if(own||v!==0||el.hidden||(el===PL&&!el.classList.contains('on'))){D.set.call(el,v)}}});});
  function answered(r){return !!r.querySelector('.kg-fb,.rq-ex,.kg-opts button:disabled')}
  function center(sc,a,b){
    if(!a||!b)return;
    var s=sc.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),
        top=ra.top-s.top+sc.scrollTop,bot=rb.bottom-s.top+sc.scrollTop,h=sc.clientHeight,t=(top+bot)/2-h/2;
    if(bot-top>h-120)t=top-90;           /* khối cao hơn màn hình: bám đầu khối */
    t=Math.max(0,Math.round(t));
    if(Math.abs(sc.scrollTop-t)>1){own=true;sc.scrollTop=t;own=false}
  }
  function recenterPlay(){
    if(!PL||!PL.classList.contains('on')||answered(PV))return;
    center(PL,PV.firstElementChild,PV.querySelector('.kg-opts')||PV.lastElementChild);
  }
  function recenterReview(){
    if(!RV||RV.hidden)return;
    var q=RV.querySelector('.rq-q'),was=RV.classList.contains('rq-mode');RV.classList.toggle('rq-mode',!!q);if(was&&!q){own=true;RV.scrollTop=0;own=false}
    if(!q||answered(RV))return;
    center(RV,RV.querySelector('.rq-bar')||q,RV.querySelector('.kg-opts')||q);
  }
  if(PV)new MutationObserver(recenterPlay).observe(PV,{childList:true});
  if(RV)new MutationObserver(recenterReview).observe(RV,{childList:true,subtree:true});
  /* Space không bao giờ cuộn khung câu hỏi (game: thách đấu, thu thập từ vựng, 漢字, nối…; và cả ôn tập).
     Chạy ở pha capture, chỉ chặn hành vi cuộn mặc định; việc "Space = câu sau" vẫn do các trình xử lý phím sẵn có đảm nhiệm.
     Bỏ qua ô nhập liệu; và khi đang focus một nút thì để nút tự kích hoạt như bình thường. */
  document.addEventListener('keydown',function(e){
    if(e.key!==' '&&e.key!=='Spacebar'&&e.code!=='Space')return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target,tg=t&&t.tagName;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tg)||(t&&t.isContentEditable))return;
    var playing=PL&&PL.classList.contains('on'),reviewing=RV&&!RV.hidden&&RV.querySelector('.rq-opt,.rq-res');
    if(!playing&&!reviewing)return;
    if(tg==='BUTTON'&&((PL&&PL.contains(t))||(RV&&RV.contains(t))))return;
    e.preventDefault();
  },true);
  window.addEventListener('resize',function(){recenterPlay();recenterReview()});
})();
</script>

<script>
/* hình quỷ ở header game: dò img/ui/game1.<đuôi>, đo chiều cao theo header */
(function(){
  var title=document.querySelector('.kg-title'), head=document.querySelector('.kg-head'), bar=document.querySelector('.kg-head .kg-bar');
  if(!title||!head||!bar) return;
  var tb=title.querySelector('b');   /* bọc từng chữ để mỗi chữ lên/xuống/nghiêng riêng (chữ uốn lượn) */
  if(tb&&!tb.querySelector('i')){ var tx=tb.textContent; tb.setAttribute('aria-label',tx); tb.innerHTML=Array.from(tx).map(function(c){return '<i aria-hidden="true">'+c+'</i>';}).join(''); }
  var im=document.createElement('img'); im.className='kg-oni'; im.alt=''; im.draggable=false; head.appendChild(im);
  var KG_ONI_SCALE=.7;   /* tỉ lệ kích thước con quỷ so với chiều cao header (1 = cũ, .7 = nhỏ hơn 30%) */
  function fit(){
    var h=head.getBoundingClientRect(), b=bar.getBoundingClientRect();
    if(!b.height) return;                               /* game đang ẩn: lần mở sau sẽ đo lại */
    var H=Math.max(40,b.bottom-h.top)*KG_ONI_SCALE, ratio=(im.naturalWidth&&im.naturalHeight)?im.naturalWidth/im.naturalHeight:.8;
    im.style.setProperty('--kg-oni-top','0px');
    im.style.setProperty('--kg-oni-h',H+'px');
    if(!im.classList.contains('moved')) im.classList.toggle('in',h.right+12+H*ratio>innerWidth-6);   /* hết chỗ bên phải → lùi vào trong */
  }
  if(window.ResizeObserver){ var ro=new ResizeObserver(fit); ro.observe(head); ro.observe(title); }
  window.addEventListener('resize',fit); im.addEventListener('load',fit);
  /* kéo thả: giữ chuột (hoặc chạm) kéo tới đâu cũng được, thả ra là đứng yên ở đó; bấm đúp để trả về chỗ cũ */
  var drag=null;
  function clamp(x,y){ var w=im.offsetWidth,h=im.offsetHeight; return [Math.min(Math.max(0,x),Math.max(0,innerWidth-w)),Math.min(Math.max(0,y),Math.max(0,innerHeight-h))]; }
  function put(x,y){ var c=clamp(x,y); im.style.left=c[0]+'px'; im.style.top=c[1]+'px'; }
  im.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0) return;
    var r=im.getBoundingClientRect();
    if(!im.classList.contains('moved')){ im.style.height=r.height+'px'; im.classList.add('moved'); put(r.left,r.top); }   /* chuyển sang toạ độ màn hình, giữ nguyên kích thước */
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top};
    im.classList.add('dragging'); try{im.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  im.addEventListener('pointermove',function(e){ if(drag) put(e.clientX-drag.dx,e.clientY-drag.dy); });
  function end(e){ if(!drag) return; drag=null; im.classList.remove('dragging'); try{im.releasePointerCapture(e.pointerId);}catch(_){} }
  im.addEventListener('pointerup',end); im.addEventListener('pointercancel',end);
  im.addEventListener('dragstart',function(e){ e.preventDefault(); });
  im.addEventListener('dblclick',function(){ im.classList.remove('moved'); im.style.left=im.style.top=im.style.height=''; fit(); });
  window.addEventListener('resize',function(){ if(im.classList.contains('moved')) put(parseFloat(im.style.left)||0,parseFloat(im.style.top)||0); });
  var E=['png','webp','jpg','jpeg','gif','avif'],i=0;
  (function next(){ if(i>=E.length) return; var u='img/ui/game1.'+E[i++],t=new Image(); t.onload=function(){ im.src=u; fit(); blinkInit(u); }; t.onerror=next; t.src=u; })();
  /* chớp mắt: đổi qua lại giữa game1.<đuôi> (mở mắt) và game1b.<đuôi> (nhắm mắt); thiếu file game1b thì bỏ qua, không lỗi */
  function blinkInit(open){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var shutSrc=open.replace('game1.','game1b.'), pre=new Image(), timer=null;
    function shut(ms,cb){ im.src=shutSrc; setTimeout(function(){ im.src=open; if(cb) cb(); },ms); }
    function next(){
      clearTimeout(timer);
      timer=setTimeout(function(){
        if(document.hidden||im.getBoundingClientRect().height<2||im.classList.contains('dragging')){ next(); return; }   /* game ẩn / đang kéo: bỏ lượt */
        shut(130,function(){ if(Math.random()<.25) setTimeout(function(){ shut(110,next); },150); else next(); });          /* thỉnh thoảng chớp đúp */
      },2200+Math.random()*3300);
    }
    pre.onload=next; pre.src=shutSrc;
  }
})();
</script>
<script>
/* danh sách ngôn ngữ: đưa ra ngoài thanh, đặt bên trái thanh, đáy thẳng hàng nút ngôn ngữ, mọc lên trên, luôn nằm trong màn hình */
(function(){var P=document.getElementById('ctlPanel'),cur=P&&P.querySelector('.lsw-cur'),fl=P&&P.querySelector('.lsw-fly');if(!fl||!cur)return;
  fl.classList.add('fl-out');fl.setAttribute('data-no-i18n','');document.body.appendChild(fl);
  function place(){if(fl.hidden)return;var r=cur.getBoundingClientRect(),q=P.getBoundingClientRect(),vh=window.innerHeight;
    fl.style.right=(window.innerWidth-q.left+8)+'px';
    fl.style.bottom=Math.max(8,vh-r.bottom)+'px';
    fl.style.maxHeight=Math.max(120,r.bottom-8)+'px'}
  cur.addEventListener('click',function(){setTimeout(place,0)});
  window.addEventListener('resize',place);P.addEventListener('scroll',place);
  new MutationObserver(place).observe(fl,{attributes:true,attributeFilter:['hidden']})})();
</script>
