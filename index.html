<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扶桑言葉磨 — Learn with passion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --fs:1;
    --bg: #E1D4BF;
    --bg-card: #E8DFCF;
    --bg-subtle: #E4D9C6;
    --ink: #2E2B26;
    --ink-soft: #6F6A5E;
    --ink-faint: #9C9689;
    --accent: #C96442;
    --accent-dark: #AE5236;
    --accent-soft: #F1E2D3;
    --accent-soft-2: #ECD9C6;
    --border: #CBBEA9;
    --border-soft: #D6C8B3;
    --grammar: #5B7A6B;
    --grammar-soft: #E3EAE3;
    --advanced: #8B5CB8;
    --advanced-dark: #6E4494;
    --advanced-soft: #EFE3F7;
    --advanced-soft-2: #E3CFF2;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow-card: 0 1px 2px rgba(60, 50, 30, 0.06), 0 1px 1px rgba(60,50,30,0.04);
    --shadow-modal: 0 20px 60px rgba(40, 30, 15, 0.25);
    --btn-border: #B5A98F;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0F1115; --bg-card: #171A21; --bg-subtle: #13161C;
    --ink: #ECEEF2; --ink-soft: #AAB0BD; --ink-faint: #8A91A0;
    --accent: #C4502D; --accent-dark: #FFB59A;
    --accent-soft: #2A1F1C; --accent-soft-2: #382823;
    --border: #2A2F3A; --border-soft: #1F232C;
    --grammar: #86C5A6; --grammar-soft: #172823;
    --advanced: #8450BE; --advanced-dark: #D6BEF2;
    --advanced-soft: #231B31; --advanced-soft-2: #30254A;
    --shadow-card: 0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.35);
    --shadow-modal: 0 20px 60px rgba(0,0,0,.65);
    --btn-border: #5A6272;
  }
  :root[data-theme="dark"] .btn-random:hover{ background: #AD4222; }
  :root[data-theme="dark"] .overlay{ background: rgba(0,0,0,.6); }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans CJK JP", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.55;
  }

  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 90px;
  }

  /* ---------- Header ---------- */
  header{
    position: relative; overflow: hidden;
    display:flex; align-items:center; justify-content: space-between;
    gap: 24px 32px; flex-wrap: wrap;
    margin-bottom: 34px;
    padding: 36px 36px 30px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow-card), 0 14px 36px -18px rgba(60,45,25,.28);
  }
  header::before{
    content:""; position:absolute; left:0; right:0; top:0; height:6px;
    background: linear-gradient(90deg,#3F8F5F 0 20%,#2E7FA6 20% 40%,#C08A22 40% 60%,#C25A34 60% 80%,#8B5CB8 80% 100%);
  }
  .brand{ display:flex; align-items:center; gap: 24px; min-width: 0; }
  .brand-mark{
    width: 84px; height: 84px; border-radius: 24px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #000));
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(44px*var(--fs,1)); font-weight: 700; flex-shrink: 0;
    box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .brand-text h1{ margin: 0; font-size:calc(36px*var(--fs,1)); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .brand-text p{ margin: 8px 0 0; font-size:calc(16.5px*var(--fs,1)); line-height: 1.45; color: var(--ink-soft); }
  .theme-zone{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap: 8px;
    align-self: stretch; padding-left: 32px; border-left: 1px solid var(--border);
  }
  .theme-label{ font-size:calc(11.5px*var(--fs,1)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .theme-switch{ display:inline-flex; gap: 4px; padding: 4px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 999px; }
  .theme-opt{
    font-family: inherit; font-size:calc(14px*var(--fs,1)); font-weight: 600; color: var(--ink-soft);
    background: transparent; border: 0; border-radius: 999px; padding: 8px 16px;
    display:inline-flex; align-items:center; gap: 7px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-opt:hover{ color: var(--ink); }
  .theme-opt .theme-ico{ width:28px; height:28px; border-radius:50%; object-fit:cover; background:#fff; flex:none; display:block; }
  .theme-opt[aria-checked="true"]{ background: var(--accent); color: #fff; box-shadow: var(--shadow-card); }
  @media (max-width: 760px){
    header{ padding: 30px 22px 22px; border-radius: 22px; }
    .brand{ gap: 16px; }
    .brand-mark{ width: 64px; height: 64px; border-radius: 19px; font-size:calc(32px*var(--fs,1)); }
    .brand-text h1{ font-size:calc(26px*var(--fs,1)); }
    .brand-text p{ font-size:calc(14.5px*var(--fs,1)); }
    .theme-zone{ width: 100%; flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 0 0; border-left: 0; border-top: 1px solid var(--border); }
  }

  /* ---------- Hero / random panel ---------- */
  .hero{
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 30px 30px 26px;
    box-shadow: var(--shadow-card);
    margin-bottom: 26px;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-copy h2{
    margin: 0 0 6px;
    font-size:calc(18px*var(--fs,1));
    font-weight: 620;
  }
  .hero-copy p{
    margin: 0;
    color: var(--ink-soft);
    font-size:calc(14px*var(--fs,1));
    max-width: 46ch;
  }

  .btn-random{
    display:inline-flex;
    align-items:center;
    gap: 9px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    font-size:calc(14.5px*var(--fs,1));
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-random:hover{ background: var(--accent-dark); }
  .btn-random:active{ transform: scale(0.98); }
  .btn-random .dice{ font-size:calc(17px*var(--fs,1)); display:inline-block; transition: transform .35s ease; }
  .btn-random.spin .dice{ transform: rotate(300deg); }

  /* topic pill picker */
  .topic-pills{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
  }
  .pill{
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: 999px;
    font-size:calc(12.8px*var(--fs,1));
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
    transition: all .12s ease;
  }
  .pill:hover{ border-color: var(--accent); color: var(--ink); }
  .pill.active{
    background: var(--accent-soft);
    border-color: var(--accent-soft-2);
    color: var(--accent-dark);
    font-weight: 600;
  }

  /* ---------- Current topic panel ---------- */
  .topic-panel{
    display:none;
  }
  .topic-panel.show{ display:block; }

  .topic-header{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 6px 0 18px;
  }
  .topic-icon{ display:none; }
  .topic-header h2{
    margin: 0 0 4px;
    font-family: 'Inter','Zen Maru Gothic', -apple-system, "Hiragino Sans", sans-serif;
    font-size:calc(30px*var(--fs,1));
    font-weight: 900;
    letter-spacing: -0.01em;
    color: var(--ink);
    position: relative;
    padding-left: 16px;
  }
  .topic-header h2::before{
    content:"";
    position:absolute; left:0; top: 4px; bottom: 4px;
    width: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .topic-meta{
    font-size:calc(13px*var(--fs,1));
    color: var(--ink-soft);
  }

  /* tabs */
  .tabs{
    display:flex;
    gap: 6px;
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 4px;
    width: fit-content;
    margin-bottom: 20px;
  }
  .tab-btn{
    border:none;
    background: transparent;
    padding: 9px 18px;
    border-radius: 9px;
    font-size:calc(13.5px*var(--fs,1));
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: var(--bg-card);
    color: var(--ink);
    box-shadow: var(--shadow-card);
  }

  /* item grid */
  .item-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .item-card{
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 16px 17px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease, box-shadow .15s ease;
    text-align: left;
  }
  .item-card:hover{
    border-color: var(--accent-soft-2);
    box-shadow: var(--shadow-card);
    transform: translateY(-1px);
  }
  .item-card .jp{
    font-size:calc(19px*var(--fs,1));
    font-weight: 650;
    margin-bottom: 3px;
  }
  .item-card .reading{
    font-size:calc(12.5px*var(--fs,1));
    color: var(--ink-faint);
  }
  .item-card.grammar .jp{ font-size:calc(16.5px*var(--fs,1)); }
  .badge-type{
    display:inline-block;
    font-size:calc(10.5px*var(--fs,1));
    font-weight: 700;
    letter-spacing: .02em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 9px;
  }
  .badge-vocab{ background: var(--accent-soft); color: var(--accent-dark); }
  .badge-grammar{ background: var(--grammar-soft); color: var(--grammar); }
  .badge-advanced{ background: var(--advanced); color: #fff; }

  /* ===== Bộ chọn chủ đề ===== */
  .picker{ margin-bottom: 40px; }
  .picker-head{ margin-bottom: 20px; }
  .picker-head h2{
    margin: 0 0 6px;
    font-size:calc(25px*var(--fs,1));
    font-weight: 660;
    letter-spacing: -0.02em;
  }
  .picker-head p{
    margin: 0;
    font-size:calc(14px*var(--fs,1));
    color: var(--ink-soft);
  }
  .section-divider{
    display:flex; align-items:center; gap: 14px;
    margin: 34px 0 16px;
  }
  .section-divider:first-child{ margin-top: 0; }
  .section-divider span{
    font-size:calc(11.5px*var(--fs,1));
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .section-divider::after{
    content:"";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .topic-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .topic-grid.ref-grid{
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 6px;
  }
  .topic-card{
    position: relative;
    text-align: left;
    background: var(--bg-card);
    border: 1.5px solid var(--accent-soft-2);
    border-radius: var(--radius-md);
    padding: 22px 20px 18px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .topic-card::before{
    content:"";
    position:absolute; inset: 0 auto 0 0;
    width: 4px;
    background: var(--accent);
    opacity: 1;
  }
  .topic-card:hover{
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 12px 28px rgba(60, 45, 25, 0.12);
  }
  .topic-card.is-ref{
    padding: 15px 16px 13px;
    border: 1px dashed var(--border);
    background: var(--bg-subtle);
    box-shadow: none;
  }
  .topic-card.is-ref::before{
    background: var(--grammar);
    width: 3px;
  }
  .topic-card.is-ref:hover{
    transform: translateY(-2px);
    border-color: var(--grammar);
    box-shadow: 0 6px 16px rgba(60, 45, 25, 0.08);
  }
  .tc-top{
    margin-bottom: 10px;
  }
  .tc-eyebrow{
    font-size:calc(11px*var(--fs,1));
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-dark);
  }
  .is-ref .tc-eyebrow{
    color: var(--grammar);
    font-size:calc(10px*var(--fs,1));
  }
  .tc-jp{
    font-size:calc(13px*var(--fs,1));
    color: var(--ink-faint);
    font-weight: 500;
  }
  .tc-title{
    margin: 0 0 10px;
    font-family: 'Inter','Zen Maru Gothic', -apple-system, "Hiragino Sans", sans-serif;
    font-size:calc(25px*var(--fs,1));
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.28;
    color: var(--ink);
  }
  .is-ref .tc-title{
    font-size:calc(17px*var(--fs,1));
    font-weight: 700;
    color: var(--ink-soft);
  }
  .tc-meta{
    display:flex; gap: 12px;
    font-size:calc(12.5px*var(--fs,1));
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .is-ref .tc-meta{ font-size:calc(11.5px*var(--fs,1)); margin-bottom: 8px; }
  .tc-meta b{ color: var(--ink); font-weight: 620; }
  .tc-bar{
    display:flex;
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--border-soft);
    margin-bottom: 12px;
  }
  .tc-bar i{ display:block; height: 100%; }
  .tc-go{
    font-size:calc(12.5px*var(--fs,1));
    font-weight: 600;
    color: var(--accent-dark);
    display:inline-flex; align-items:center; gap: 5px;
  }
  .topic-card:hover .tc-go span{ transform: translateX(3px); }
  .tc-go span{ display:inline-block; transition: transform .18s ease; }

  .btn-back{
    display:inline-flex; align-items:center; gap: 10.5px;
    position: sticky;
    top: calc(10px + env(safe-area-inset-top, 0px));
    z-index: 30;
    background: var(--bg);
    border: 2px solid var(--btn-border);
    color: var(--ink-soft);
    font-family: inherit;
    font-size:calc(19.5px*var(--fs,1));
    font-weight: 550;
    padding: 10.5px 19.5px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 18px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn-back:hover{
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-soft);
  }

  @media (max-width: 560px){
    .topic-grid{ grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 11px; }
    .topic-card{ padding: 15px 14px 14px; }
    .tc-title{ font-size:calc(19px*var(--fs,1)); }
    .picker-head h2{ font-size:calc(21px*var(--fs,1)); }
  }

  /* ===== Phân loại theo cấp độ ===== */
  .lv-n5{ --lv: #3F8F5F; --lv-dark: #2F6F49; --lv-soft: #E2F0E6; --lv-soft-2: #C9E3D2; }
  .lv-n4{ --lv: #2E7FA6; --lv-dark: #226484; --lv-soft: #DEECF4; --lv-soft-2: #C3DCEA; }
  .lv-n3{ --lv: #C08A22; --lv-dark: #96691A; --lv-soft: #F7EBD3; --lv-soft-2: #EDD9AE; }
  .lv-n2{ --lv: #C25A34; --lv-dark: #9B4527; --lv-soft: #F8E3D9; --lv-soft-2: #EFCBBA; }
  .lv-s1{ --lv: #D14D72; --lv-dark: #A63855; --lv-soft: #FBE4EA; --lv-soft-2: #F3C7D3; }
  .lv-s2{ --lv: #7A5CD1; --lv-dark: #5E43A8; --lv-soft: #EBE5FA; --lv-soft-2: #D6CBF3; }
  .lv-s3{ --lv: #D1822E; --lv-dark: #A56222; --lv-soft: #FAEBD9; --lv-soft-2: #F0D5B4; }
  .lv-s4{ --lv: #2E9BA6; --lv-dark: #227781; --lv-soft: #DEF1F3; --lv-soft-2: #BEE1E5; }
  .lv-s5{ --lv: #4E8C3F; --lv-dark: #3B6C30; --lv-soft: #E6F1E2; --lv-soft-2: #CCE2C5; }
  .lv-f0{ --lv: #3F8F5F; --lv-dark: #2F6F49; --lv-soft: #E2F0E6; --lv-soft-2: #C9E3D2; }
  .lv-a1{ --lv: #C96442; --lv-dark: #AE5236; --lv-soft: #F8E6DC; --lv-soft-2: #EFCDBB; }
  .lv-b1{ --lv: #2E7FA6; --lv-dark: #226383; --lv-soft: #DEEDF5; --lv-soft-2: #BCDAE8; }
  .lv-p1{ --lv: #C96442; --lv-dark: #AE5236; --lv-soft: #F8E6DC; --lv-soft-2: #EFCDBB; }
  .lv-p2{ --lv: #2E7FA6; --lv-dark: #226383; --lv-soft: #DEEDF5; --lv-soft-2: #BCDAE8; }
  .lv-p3{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }
  .lv-f1{ --lv: #C96442; --lv-dark: #AE5236; --lv-soft: #F8E6DC; --lv-soft-2: #EFCDBB; }
  .lv-f2{ --lv: #2E7FA6; --lv-dark: #226383; --lv-soft: #DEEDF5; --lv-soft-2: #BCDAE8; }
  .lv-f3{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }
  .lv-n1{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }

  .level-group{ margin-top: 22px; }
  .level-group:first-child{ margin-top: 4px; }
  .level-head{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: 11px; flex-wrap: wrap;
  }
  .level-tag{
    background: var(--lv);
    color:#fff;
    font-size:calc(11px*var(--fs,1));
    font-weight: 700;
    letter-spacing: .06em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .level-name{
    font-size:calc(13.5px*var(--fs,1));
    font-weight: 600;
    color: var(--lv-dark);
  }
  .level-count{
    font-size:calc(12.5px*var(--fs,1));
    color: var(--ink-faint);
    margin-left: auto;
  }
  .level-line{
    height: 1px;
    background: var(--lv-soft-2);
    margin-bottom: 12px;
  }
  .item-card.lv{
    background: linear-gradient(180deg, var(--lv-soft) 0%, var(--bg-card) 70%);
    border: 1px solid var(--lv-soft-2);
  }
  .item-card.lv:hover{ border-color: var(--lv); }
  .item-card.lv .jp{ color: var(--lv-dark); }
  .badge-level{ background: var(--lv); color:#fff; }
  .modal.lv .modal-meaning,
  .modal.lv .modal-hanviet{
    color: var(--lv-dark);
    background: var(--lv-soft);
  }
  .modal.lv .compare-word{ color: var(--lv-dark); }

  /* chú thích màu */
  .legend{
    display:flex; flex-wrap: wrap; gap: 8px;
    margin: 2px 0 16px;
  }
  .legend button{
    display:inline-flex; align-items:center; gap: 6px;
    font-family: inherit;
    font-size:calc(12px*var(--fs,1));
    font-weight: 550;
    color: var(--ink-soft);
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 4px 10px 4px 8px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease, transform .12s ease;
  }
  .legend button:hover{
    border-color: var(--lg-color, var(--accent));
    color: var(--ink);
    background: var(--bg-card);
    transform: translateY(-1px);
  }
  .legend button:active{ transform: translateY(0); }
  .legend button.flash{
    animation: legendFlash .7s ease;
  }
  @keyframes legendFlash{
    0%   { background: var(--lg-color, var(--accent)); color: #fff; border-color: var(--lg-color, var(--accent)); }
    100% { background: var(--bg-subtle); color: var(--ink-soft); border-color: var(--border-soft); }
  }
  .legend i{
    width: 9px; height: 9px; border-radius: 50%;
    display:inline-block;
    flex-shrink: 0;
  }
  .level-group{ scroll-margin-top: 80px; }

  /* ===== Credit ===== */
  .credit{
    position: fixed;
    right: 16px;
    bottom: 14px;
    z-index: 40;
    display: inline-flex;
    align-items: center;
    font-size:calc(11.5px*var(--fs,1));
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--ink-faint);
    user-select: none;
    opacity: 0.75;
    transition: opacity .2s ease;
  }
  .credit:hover{ opacity: 1; }
  .credit b{
    font-weight: 650;
    color: var(--ink-soft);
    background: none;
    cursor: pointer;
    padding: 2px 3px;
    margin-left: 3px;
    border-radius: 5px;
    transition: color .15s ease, background .15s ease;
  }
  .credit b:hover{
    color: var(--accent-dark);
    background: var(--accent-soft);
  }
  .credit-bubble{
    position: fixed;
    right: 16px;
    bottom: 42px;
    z-index: 41;
    max-width: 250px;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
    box-shadow: var(--shadow-modal);
    padding: 12px 14px;
    font-size:calc(13px*var(--fs,1));
    line-height: 1.5;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px) scale(0.97);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .credit-bubble.show{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  @media (max-width: 480px){
    .credit{ right: 10px; bottom: 10px; font-size:calc(10.5px*var(--fs,1)); }
    .credit-bubble{ right: 10px; left: 10px; max-width: none; bottom: 38px; }
  }

  /* advanced (N1) section */
  .advanced-section{
    margin-top: 34px;
    padding-top: 24px;
    border-top: 1px dashed var(--border);
  }
  .advanced-label{
    display:flex;
    align-items:center;
    gap: 9px;
    font-size:calc(14.5px*var(--fs,1));
    font-weight: 700;
    color: var(--advanced-dark);
    margin-bottom: 14px;
  }
  .advanced-label .n1-tag{
    background: var(--advanced);
    color: #fff;
    font-size:calc(11px*var(--fs,1));
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: .03em;
  }
  .advanced-label .hint{
    font-size:calc(12px*var(--fs,1));
    font-weight: 500;
    color: var(--ink-faint);
  }
  .item-card.advanced{
    background: linear-gradient(180deg, var(--advanced-soft) 0%, var(--bg-card) 65%);
    border: 1px solid var(--advanced-soft-2);
  }
  .item-card.advanced:hover{
    border-color: var(--advanced);
    box-shadow: 0 4px 14px rgba(139, 92, 184, 0.18);
  }
  .item-card.advanced .jp{ color: var(--advanced-dark); }
  .modal.advanced .modal-meaning{
    color: var(--advanced-dark);
    background: var(--advanced-soft);
  }
  .modal.advanced .modal-hanviet{
    color: var(--advanced-dark);
    background: var(--advanced-soft);
  }

  /* empty state */
  .empty-state{
    text-align:center;
    padding: 70px 20px;
    color: var(--ink-faint);
  }
  .empty-state .emoji{ font-size:calc(38px*var(--fs,1)); margin-bottom: 14px; display:block; }
  .empty-state p{ margin: 0; font-size:calc(14.5px*var(--fs,1)); }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(30, 24, 15, 0.46);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
  }
  .overlay.show{ display:flex; }

  .modal{
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    max-width: 520px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: var(--shadow-modal);
    padding: 34px 34px 30px;
    position: relative;
    animation: pop .18s ease;
  }
  @keyframes pop{
    from{ opacity:0; transform: scale(0.97) translateY(6px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .modal-close{
    position: absolute;
    top: 18px; right: 18px;
    width: 32px; height: 32px;
    border-radius: 9px;
    border: none;
    background: var(--bg-subtle);
    color: var(--ink-soft);
    font-size:calc(16px*var(--fs,1));
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s ease;
  }
  .modal-close:hover{ background: var(--border-soft); color: var(--ink); }

  .modal .badge-type{ margin-bottom: 14px; }

  .modal-headword{
    font-size:calc(34px*var(--fs,1));
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    padding-right: 30px;
  }
  .modal-reading{
    font-size:calc(15px*var(--fs,1));
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .modal-hanviet{
    font-size:calc(13.5px*var(--fs,1));
    color: var(--accent-dark);
    background: var(--accent-soft);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 7px;
    margin-bottom: 14px;
  }
  .modal-meaning{
    font-size:calc(17px*var(--fs,1));
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--accent-soft);
    display:inline-block;
    padding: 7px 14px;
    border-radius: 10px;
    margin-bottom: 22px;
  }
  .modal.grammar .modal-meaning{
    color: var(--grammar);
    background: var(--grammar-soft);
  }
  .modal.compare .modal-meaning{
    color: var(--grammar);
    background: var(--grammar-soft);
  }

  .modal-note{
    font-size:calc(13.5px*var(--fs,1));
    line-height: 1.6;
    color: var(--ink-soft);
    background: var(--bg-subtle);
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 18px;
  }

  .compare-jp{ font-size:calc(16px*var(--fs,1)); line-height: 1.4; }
  .compare-list{ display:flex; flex-direction:column; gap: 12px; }
  .compare-item{
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .compare-item-head{
    display:flex; align-items:baseline; gap: 10px;
    margin-bottom: 4px;
  }
  .compare-word{ font-size:calc(19px*var(--fs,1)); font-weight: 700; color: var(--grammar); }
  .compare-reading{ font-size:calc(12.5px*var(--fs,1)); color: var(--ink-faint); }
  .compare-meaning{ font-size:calc(14px*var(--fs,1)); font-weight: 600; margin-bottom: 8px; }
  .compare-example .example-reading,
  .compare-example .example-meaning{ font-size:calc(12.5px*var(--fs,1)); }
  .compare-example .example-jp{ margin-bottom: 4px; }
  .compare-example .example-reading{ padding-bottom: 6px; margin-bottom: 6px; }

  .char-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .char-chip{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 8px;border:1px solid var(--border-soft);border-radius:9px;background:var(--bg-subtle)}
  .char-chip b{font-size:calc(22px*var(--fs,1));font-weight:600}
  .char-chip i{font-size:calc(13.5px*var(--fs,1));font-weight:800;font-style:normal;color:var(--accent-dark)}
  .modal-meaning{white-space:pre-line}
  .poem-box{ background: var(--bg-subtle); border-left: 3px solid var(--accent-dark); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 18px; text-align: center; }
  .poem-label{ font-size:calc(11px*var(--fs,1)); font-weight: 700; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 8px; }
  .poem-han{ font-family: 'Noto Serif JP','Noto Serif SC',serif; font-size:calc(19px*var(--fs,1)); line-height: 1.9; letter-spacing: .12em; color: var(--accent-dark); }
  .poem-hv{ font-size:calc(13px*var(--fs,1)); font-style: italic; color: var(--ink-faint); margin: 6px 0; line-height: 1.6; }
  .poem-vi{ font-size:calc(13.5px*var(--fs,1)); color: var(--ink-soft); line-height: 1.6; }
  .modal-section-label{
    font-size:calc(11.5px*var(--fs,1));
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: .04em;
    margin-bottom: 10px;
  }
  .example-box{
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 18px 19px;
  }
  .example-jp{
    font-size:calc(17px*var(--fs,1));
    font-weight: 600;
    line-height: 1.65;
    margin-bottom: 8px;
  }
  .example-reading{
    font-size:calc(13.5px*var(--fs,1));
    color: var(--ink-faint);
    line-height: 1.6;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border);
  }
  .example-meaning{
    font-size:calc(14.5px*var(--fs,1));
    color: var(--ink-soft);
    line-height: 1.6;
  }
  /* Slang: nhiều ví dụ trong cùng một ô -> giữ xuống dòng (chỉ áp dụng cho modal từ vựng Slang) */
  .modal[class*="lv-s"] .example-jp,
  .modal[class*="lv-s"] .example-reading,
  .modal[class*="lv-s"] .example-meaning{ white-space: pre-line; }

  footer{
    text-align:center;
    color: var(--ink-faint);
    font-size:calc(12.5px*var(--fs,1));
    margin-top: 50px;
  }

  @media (max-width: 560px){
    .wrap{ padding: 26px 14px 70px; }
    .hero{ padding: 22px 20px 22px; }
    .hero-top{ flex-direction: column; align-items: stretch; }
    .btn-random{ justify-content:center; }
    .modal{ padding: 28px 22px 24px; }
    .modal-headword{ font-size:calc(28px*var(--fs,1)); }
    .item-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }

  ::-webkit-scrollbar{ width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ===== Minimal refresh (override layer) ===== */
  :root{ --radius-lg:16px; --radius-md:12px; --radius-sm:8px; --shadow-card:none; --ink-soft:#5E594D; --ink-faint:#6F695D; }
  :root[data-theme="dark"]{ --shadow-card:none; --ink-soft:#B8BECA; --ink-faint:#9AA2B1; }
  body{ font-family:"Inter","Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",sans-serif; }
  /* một màu nhấn: cấp độ chỉ còn là chấm màu */
  [class^="lv-"],[class*=" lv-"]{ --lv-soft:var(--bg-subtle); --lv-soft-2:var(--border-soft); --lv-dark:var(--ink); }
  .level-tag,.badge-level{ background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:calc(12px*var(--fs,1)); letter-spacing:.04em; display:inline-flex; align-items:center; gap:7px; }
  .level-tag::before,.badge-level::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--lv); flex-shrink:0; }
  .item-card.lv .jp,.item-card.advanced .jp{ color:var(--ink); }
  /* chữ Nhật là nhân vật chính */
  .item-card .jp{ font-size:calc(22px*var(--fs,1)); font-weight:600; }
  .item-card.grammar .jp{ font-size:calc(17px*var(--fs,1)); }
  .item-card .reading{ font-size:calc(13.5px*var(--fs,1)); color:var(--ink-soft); }
  .item-card{ border-color:var(--border); }
  .item-card:hover{ border-color:var(--ink-faint); transform:none; }
  .badge-type{ font-size:calc(11.5px*var(--fs,1)); }
  .topic-header h2{ font-family:inherit; font-weight:700; font-size:calc(28px*var(--fs,1)); }
  /* tab gạch chân */
  .tabs{ background:transparent; border:0; border-bottom:1px solid var(--border); border-radius:0; padding:0; gap:26px; width:100%; }
  .tab-btn{ border-radius:0; padding:12px 2px; margin-bottom:-1px; border-bottom:2px solid transparent; font-size:calc(15px*var(--fs,1)); }
  .tab-btn.active{ background:transparent; box-shadow:none; border-bottom-color:var(--accent); color:var(--ink); }
  /* masthead phẳng */
  header{ background:transparent; border:0; box-shadow:none; border-radius:0; overflow:visible; padding:30px 0 26px; margin-bottom:30px; border-bottom:1px solid var(--border); }
  header::before{ display:none; }
  .brand{ gap:18px; }
  .brand-mark{ width:56px; height:56px; border-radius:var(--radius-md); background:var(--accent); box-shadow:none; font-size:calc(28px*var(--fs,1)); }
  .brand-text h1{ font-size:calc(30px*var(--fs,1)); font-weight:700; }
  .brand-text p{ font-size:calc(15px*var(--fs,1)); margin-top:6px; }
  /* thanh trên cùng */
  .topbar{ position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 95%,transparent); border-bottom:1px solid var(--border-soft); }
  .topbar-in{ max-width:900px; margin:0 auto; padding:10px 20px; padding-top:calc(10px + env(safe-area-inset-top,0px)); min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .topbar .btn-back{ display:none; position:static; margin:0; }
  body:has(.topic-panel.show) .topbar .btn-back{ display:inline-flex; }
  .topbar .theme-switch{ margin-left:auto; }
  .level-group{ scroll-margin-top:96px; }
  @media (max-width:760px){
    header{ padding:22px 0 20px; border-radius:0; }
    .brand-mark{ width:48px; height:48px; font-size:calc(24px*var(--fs,1)); }
    .brand-text h1{ font-size:calc(24px*var(--fs,1)); }
    .brand-text p{ font-size:calc(14px*var(--fs,1)); }
  }

  /* ===== Ảnh nền mờ: 2 lớp, đổi chéo mờ dần ===== */
  :root{ --bg-art-opacity: .30; }
  :root[data-theme="dark"]{ --bg-art-opacity: .30; --border:#262B35; --border-soft:#1C2028; }
  .bg-layer{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-position:center; background-size:cover; background-repeat:no-repeat;
    opacity:0; transition: opacity 1.8s ease; will-change: opacity;
  }
  .bg-layer.on{ opacity: var(--bg-art-opacity); }
  /* chế độ tối: ảnh mờ hơn ở vùng nội dung giữa trang, rõ hơn ở hai bên */
  :root[data-theme="dark"] .bg-layer{
    -webkit-mask-image: linear-gradient(90deg,#000 0%,rgba(0,0,0,.82) calc(50% - 470px),rgba(0,0,0,.82) calc(50% + 470px),#000 100%);
    mask-image: linear-gradient(90deg,#000 0%,rgba(0,0,0,.82) calc(50% - 470px),rgba(0,0,0,.82) calc(50% + 470px),#000 100%);
  }
  :root[data-theme="dark"] .bg-layer.sketch{ filter:none; }
  /* ===== Dark · ảnh chưa khai báo bố cục: nền mờ lấp đầy + ảnh gốc nét ở giữa, 4 cạnh tan dần ===== */
  :root[data-theme="dark"] .bg-layer.fill{ background-image:none !important; }
  :root[data-theme="dark"] .bg-layer.fill.on{ opacity:.62; }
  :root[data-theme="dark"] .bg-layer.fill::before,
  :root[data-theme="dark"] .bg-layer.fill::after{ content:""; position:absolute; background-repeat:no-repeat; background-image:var(--bgu); }
  :root[data-theme="dark"] .bg-layer.fill::before{           /* lớp nền: cùng ảnh, phủ kín, mờ + tối */
    inset:-90px; background-size:cover; background-position:center;
    filter:blur(46px) brightness(.5) saturate(.85);
  }
  :root[data-theme="dark"] .bg-layer.fill::after{            /* lớp ảnh nét: kích thước gốc, mép mờ dần */
    inset:0; background-size:var(--iw) var(--ih); background-position:var(--ix) var(--iy);
    filter:brightness(.82) saturate(.92);
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--ft),#000 calc(100% - var(--ft)),transparent 100%),linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--ft)),transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0,#000 var(--ft),#000 calc(100% - var(--ft)),transparent 100%),linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--ft)),transparent 100%);
    mask-composite:intersect;
    -webkit-mask-size:var(--iw) var(--ih); mask-size:var(--iw) var(--ih);
    -webkit-mask-position:var(--ix) var(--iy); mask-position:var(--ix) var(--iy);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }
 /* bộ lọc mực vàng đã nướng sẵn vào ảnh */
  /* ánh ấm rất nhẹ ở hai góc để nền tối không bị lạnh */
  :root[data-theme="dark"] body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(ellipse at 12% 0%, rgba(196,80,45,.10), transparent 55%),
                radial-gradient(ellipse at 92% 100%, rgba(240,190,120,.07), transparent 50%);
  }
  :root[data-theme="dark"] .item-card{ border-color: var(--border-soft); }

  /* ===== Dark · Option C "Urushi": đen sơn mài – đỏ son – vàng kim ===== */
:root[data-theme="dark"]{
  --bg:#0D0B0C; --bg-card:#17110F; --bg-subtle:#120D0C;
  --ink:#F3EBDD; --ink-soft:#CFC3B0; --ink-faint:#A09482;
  --accent:#C4502D; --accent-dark:#F0A58A;
  --accent-soft:#2A1A15; --accent-soft-2:#3A241C;
  --border:#33262A; --border-soft:#241A1A;
  --gold:#C9A961; --gold-hi:#EBD59B;
  --btn-border:#6B5A44;
  --shadow-modal:0 30px 80px rgba(0,0,0,.8);
}
:root[data-theme="dark"] .overlay{ background:rgba(6,3,3,.84); }
/* thẻ từ vựng: viền sáng dốc từ góc trên, glow theo màu cấp độ */
:root[data-theme="dark"] .item-card,
:root[data-theme="dark"] .item-card.lv,
:root[data-theme="dark"] .item-card.advanced{
  --c: var(--lv, var(--gold-hi));
  border:1px solid transparent;
  background:
    linear-gradient(180deg, #1E1613, var(--bg-card)) padding-box,
    linear-gradient(155deg, color-mix(in srgb,var(--c) 55%,#fff) 0%, color-mix(in srgb,var(--c) 30%,transparent) 50%, color-mix(in srgb,var(--c) 60%,transparent) 100%) border-box;
  box-shadow: 0 0 16px -6px color-mix(in srgb,var(--c) 70%,transparent), inset 0 1px 0 rgba(235,213,155,.12);
  transition: box-shadow .2s ease, transform .2s ease;
}
:root[data-theme="dark"] .item-card:hover,
:root[data-theme="dark"] .item-card.lv:hover,
:root[data-theme="dark"] .item-card.advanced:hover{
  transform:translateY(-2px);
  box-shadow: 0 0 24px -2px color-mix(in srgb,var(--c) 80%,transparent), 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent), 0 12px 26px rgba(0,0,0,.55);
}
:root[data-theme="dark"] .item-card .jp,
:root[data-theme="dark"] .item-card.lv .jp,
:root[data-theme="dark"] .item-card.advanced .jp{
  font-family:"EB Garamond","Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN",serif; color:var(--gold-hi); font-weight:600;
}
:root[data-theme="dark"] .item-card .reading{ color:var(--ink-soft); }
/* khung giải thích: viền kép kiểu khung tranh */
:root[data-theme="dark"] .modal{
  border:1px solid transparent;
  background:
    linear-gradient(180deg,#1D1512,#140E0C) padding-box,
    linear-gradient(150deg, var(--gold-hi), rgba(201,169,97,.28) 45%, rgba(196,80,45,.65) 100%) border-box;
  box-shadow: 0 0 0 1px rgba(201,169,97,.14), 0 0 70px -12px rgba(201,169,97,.35), var(--shadow-modal);
  outline:1px solid rgba(201,169,97,.28); outline-offset:-9px;
}
:root[data-theme="dark"] .modal-headword{
  font-family:"EB Garamond","Shippori Mincho","Noto Serif JP",serif; color:var(--gold-hi); text-shadow:0 0 28px rgba(235,213,155,.35);
}
:root[data-theme="dark"] .modal-reading{ color:var(--ink-soft); letter-spacing:.06em; }
:root[data-theme="dark"] .modal .modal-meaning,
:root[data-theme="dark"] .modal.lv .modal-meaning,
:root[data-theme="dark"] .modal.advanced .modal-meaning,

  /* hiệu năng: thẻ ngoài màn hình không bị layout/paint */

  /* ===== Header hoa gọn hơn (đỡ chiếm chỗ list) + kéo chỉnh độ rộng sidebar ===== */

  .side-resizer{ position:fixed; top:0; bottom:0; left:calc(var(--side-w) - 4px); width:8px; cursor:col-resize; z-index:60; touch-action:none; }

  @media (max-width:900px){ .side-resizer{ display:none; } .wrap{ grid-template-columns:none; } }

  /* ===== Huy hiệu hoa: cả 2 viền (trong + ngoài) lượn sóng ===== */
  .side header .brand .brand-mark{
    position:relative; isolation:isolate; border:0 !important; border-radius:0 !important;

  .side header .brand .brand-mark .mk-wave{ position:absolute; inset:-12%; width:124%; height:124%; z-index:1; pointer-events:none; overflow:visible; }
  .mk-wave path{ fill:none; stroke-linejoin:round; }
  .mk-wave .w-in{ stroke:var(--bgold); stroke-width:1.3; }
  .mk-wave .w-out{ stroke:var(--bgold); stroke-width:1; opacity:.55; }
  .side header .brand .brand-mark img{ position:relative; z-index:2; }

  /* thẻ game: cùng kiểu với thẻ Chủ đề / Ngữ pháp */
  .side-branch-head.game-btn.active{ border-color:var(--accent); }
  :root[data-theme="dark"] .side-branch-head.game-btn.active{ border-color:var(--gold); box-shadow:0 0 16px -6px rgba(201,169,97,.5); }

  /* ===== ゲーム: しりとり ===== */
  .game-panel{ display:none; grid-column:2; width:100%; max-width:860px; padding:40px 44px 90px; }
  .game-panel.show{ display:block; }
  .side-item.game-btn{ font-size:calc(17px*var(--fs,1)); font-weight:650; margin-top:8px; }
  .side-item.game-btn .n{ font-size:calc(18px*var(--fs,1)); min-width:26px; }
  :root[data-theme="dark"] .side-item.game-btn{ color:var(--gold-hi); }
  /* tối giản: một ô nhập dài + nút スタート; ảnh nền (.bg-layer) giữ nguyên phía sau */
  #gamePanel.game-panel{ position:relative; min-height:calc(100vh - 60px); padding:64px 24px 80px; background:transparent!important; border:0!important; border-radius:0!important; box-shadow:none!important; }
  #gamePanel.game-panel.show{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sh-rec{ position:absolute; top:22px; right:28px; display:flex; align-items:baseline; gap:10px; font-size:calc(14px*var(--fs,1)); letter-spacing:.14em; color:var(--ink-soft); }
  .sh-rec b{ font-size:calc(30px*var(--fs,1)); font-weight:700; letter-spacing:0; color:var(--ink); }
  /* Khi mở Shiritori: nền mờ nhẹ (~30%), chữ đậm và to hơn, không đóng khung */
  html:has(#gamePanel.show) .bg-layer{ filter:blur(2px); transition:filter .4s ease, opacity .4s ease; }
  html:has(#gamePanel.show) .bg-layer.on,
  html:has(#gamePanel.show)[data-theme="dark"] .bg-layer.fill.on{ opacity:calc(var(--bg-art-opacity)*.7) !important; }
  .sh-stage{ width:min(630px,100%); }
  #gamePanel .sh-cpu{ font-size:calc(56px*var(--fs,1)); font-weight:900; }
  #gamePanel .sh-guide, #gamePanel .sh-rec{ color:var(--ink); font-weight:700; font-size:calc(17px*var(--fs,1)); }
  #gamePanel .sh-in{ font-size:calc(22px*var(--fs,1)); font-weight:700; border-width:2px; }
  #gamePanel .sh-mean{ font-weight:600; font-size:calc(17px*var(--fs,1)); color:var(--ink); }
  .sh-cpu{ min-height:calc(76px*var(--fs,1)); display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:calc(46px*var(--fs,1)); font-weight:700; letter-spacing:.1em; line-height:1.2; text-align:center; }
  .sh-cpu .hl, .sh-mean .w .hl{ color:var(--accent); }
  .sh-cpu ruby rt, .sh-mean ruby rt{ font-size:.38em; font-weight:500; color:var(--ink-soft); letter-spacing:.04em; }
  .sh-guide{ margin:0 0 12px 4px; font-size:calc(15px*var(--fs,1)); letter-spacing:.06em; color:var(--ink-soft); text-align:left; }
  .sh-guide b{ color:var(--ink); font-size:1.15em; }
  /* ô nhập: cùng kiểu ô tên đăng nhập (.lg-in) nhưng rộng 630px = 1,5 × 420px */
  .sh-in{ display:block; width:100%; padding:17px 20px 17px 58px; font:inherit; font-size:calc(19px*var(--fs,1)); font-weight:500; letter-spacing:.03em; color:var(--ink); background-color:transparent; border:1.5px solid var(--ink); border-radius:16px; outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B2924' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4L19 9l-4-4L4 16z'/><path d='M13.5 6.5l4 4'/></svg>");
    background-repeat:no-repeat; background-position:18px center; background-size:26px; }
  :root[data-theme="dark"] .sh-in{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ECEEF2' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4L19 9l-4-4L4 16z'/><path d='M13.5 6.5l4 4'/></svg>"); }
  .sh-ime{ margin:8px 4px 0; font-size:calc(13px*var(--fs,1)); letter-spacing:.04em; color:var(--ink-soft); text-align:left; }
  .sh-start{ display:block; margin-top:4px; }
  .sh-rule{ margin-left:.6em; }
  .sh-k{ font-size:1.3em; line-height:1.2; }
  :root[data-theme="dark"] .sh-guide b{ color:#8EC5FF; }
  .sh-guide b{ font-size:1.5em; color:#d23b2e; font-weight:900; line-height:1.2; }
  .sh-ime{ transform-origin:left center; }
  .sh-ime.warn{ animation:shime 7.6s cubic-bezier(.4,0,.2,1) 1; font-weight:700; }
  @keyframes shime{
    0%{transform:scale(1);opacity:1;color:var(--ink-soft)}
    5%{transform:scale(1.3);opacity:1;color:#d23b2e}
    8%{transform:scale(1.3);opacity:.1;color:#d23b2e} 11%{transform:scale(1.3);opacity:1;color:#d23b2e}
    14%{transform:scale(1.3);opacity:.1;color:#d23b2e} 17%{transform:scale(1.3);opacity:1;color:#d23b2e}
    84%{transform:scale(1.3);opacity:1;color:#d23b2e}
    100%{transform:scale(1);opacity:1;color:var(--ink-soft)} }
  .sh-in::placeholder{ color:var(--ink-faint); font-weight:400; }
  .sh-in:focus{ outline:2px solid var(--accent); outline-offset:2px; }
  .sh-in:disabled{ opacity:.5; }
  .sh-in.shake{ animation:kgsk .3s; }
  .sh-mean{ min-height:calc(78px*var(--fs,1)); margin:18px 4px 0; text-align:left; }
  .sh-mean .w{ font-size:calc(24px*var(--fs,1)); font-weight:700; line-height:1.3; }
  .sh-mean .m{ margin-top:4px; font-size:calc(16px*var(--fs,1)); color:var(--ink-soft); line-height:1.55; }
  .sh-mean .m i{ font-style:normal; color:var(--ink-faint); }
  .sh-mean .why{ margin-top:6px; font-size:calc(15px*var(--fs,1)); font-weight:600; }
  .sh-mean.bad .why, .sh-mean.warn .why{ color:#C0392B; }
  :root[data-theme="dark"] .sh-mean.bad .why, :root[data-theme="dark"] .sh-mean.warn .why{ color:#FF8A75; }
  .sh-over{ margin:14px 0 0; text-align:center; }
  .sh-over h3{ margin:0 0 6px; font-size:calc(30px*var(--fs,1)); font-weight:700; letter-spacing:.2em; }
  .sh-over p{ margin:2px 0; font-size:calc(16px*var(--fs,1)); color:var(--ink-soft); }
  .sh-over p b{ font-size:1.3em; color:var(--ink); }
  /* nút スタート: cùng kiểu nút .lg-go của màn login */
  .sh-go{ display:block; width:min(320px,100%); margin:26px auto 0; padding:20px 16px; font:inherit; font-size:calc(26px*var(--fs,1)); font-weight:500; letter-spacing:.2em; color:#E8DFCF; background:#3A3833; border:0; border-radius:12px; cursor:pointer; }
  .sh-go[hidden]{ display:none; }
  .sh-go span{ display:inline-flex; align-items:center; gap:20px; }
  .sh-go span::before, .sh-go span::after{ content:""; width:34px; height:1px; background:currentColor; opacity:.85; }
  .sh-go:hover{ filter:brightness(1.12); }
  .sh-go:active{ transform:translateY(1px); }
  .sh-go:disabled{ opacity:.6; cursor:wait; }
  :root[data-theme="dark"] .sh-go{ background:#2A211C; color:var(--ink); border:1px solid #5A4A3A; }
  @media (max-width:900px){
    #gamePanel.game-panel{ padding:56px 16px 70px; }
    .sh-rec{ right:16px; top:14px; }
    .sh-cpu, #gamePanel .sh-cpu{ font-size:calc(42px*var(--fs,1)); }
  }

  /* ===== Header gọn: hoa (không viền) + tên app cùng hàng, thanh kéo thu gọn, ô tìm kiếm ===== */
  .side header{
    display:block !important; padding:0 !important; margin:0 !important; background:none !important;
    border:0 !important; border-image:none !important; overflow:hidden; flex-shrink:0;
    transition:height .24s ease;
  }
  .side header.dragging{ transition:none; }
  .side header .brand{
    flex-direction:row !important; align-items:center !important; text-align:left !important;
    gap:12px !important; padding:14px 18px 8px;
  }
  .side header .brand .brand-mark,
  :root[data-theme="dark"] .side header .brand .brand-mark{
    width:50px !important; height:50px !important; flex:none;
    border:0 !important; border-radius:0 !important; background:none !important;
    box-shadow:none !important; filter:none !important; padding:0 !important; overflow:visible;
  }
  .side header .brand .brand-mark::before{ display:none !important; }
  .side header .brand .brand-mark img{ width:100% !important; height:100% !important; object-fit:contain; display:block; }
  .side header .brand-text{ align-items:flex-start !important; min-width:0; }
  .side header .brand-text h1{ font-size:calc(21px*var(--fs,1)); letter-spacing:.2em; padding-left:0; white-space:nowrap; }
  .side header .brand-text h1::after{ display:none !important; }
  .side header .brand-text p{ margin:3px 0 0 !important; font-size:0 !important; line-height:1 !important; display:block !important; }
  .side header .brand-lv{ font-size:calc(10.5px*var(--fs,1)) !important; gap:7px !important; letter-spacing:.2em !important; }
  .side header .brand-lv i:first-child{ display:none; }

  .hdr-grip{
    --g:#B08D4C; flex-shrink:0; position:relative; display:block; width:100%; height:18px; padding:0; margin:0;
    background:transparent; border:0; cursor:ns-resize; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  :root[data-theme="dark"] .hdr-grip{ --g:#C9A961; }
  .hdr-grip::before{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:linear-gradient(90deg,transparent,var(--g) 18%,var(--g) 82%,transparent); opacity:.65; }
  .hdr-grip::after{ content:""; position:absolute; left:50%; top:50%; width:46px; height:5px; transform:translate(-50%,-50%); border-radius:3px; background:var(--g); opacity:.6; transition:opacity .15s ease, width .15s ease; }
  .hdr-grip:hover::after, .hdr-grip:focus-visible::after, .hdr-grip.active::after{ opacity:1; width:60px; }
  .hdr-grip:focus-visible{ outline:none; }
  @media (pointer:coarse){ .hdr-grip{ height:24px; } }

  .srch{ flex-shrink:0; padding:6px 14px 10px; }
  .srch-box{
    display:flex; align-items:center; gap:8px; height:42px; padding:0 8px 0 12px;
    background:var(--bg-subtle); border:1px solid var(--border); border-radius:12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .srch-box:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
  :root[data-theme="dark"] .srch-box{ border-color:rgba(201,169,97,.3); }
  :root[data-theme="dark"] .srch-box:focus-within{ border-color:var(--gold,#C9A961); box-shadow:0 0 0 3px rgba(201,169,97,.18); }
  .srch-ico{ width:17px; height:17px; flex:none; color:var(--ink-faint); }
  .srch-box input{
    flex:1; min-width:0; height:100%; font:inherit; font-size:calc(16px*var(--fs,1)); color:var(--ink);
    background:transparent; border:0; outline:none; padding:0; -webkit-appearance:none; appearance:none;
  }
  .srch-box input::placeholder{ color:var(--ink-faint); }
  .srch-box input::-webkit-search-cancel-button{ display:none; }
  .srch-clear{
    flex:none; width:26px; height:26px; border-radius:50%; border:0; cursor:pointer; font:inherit; font-size:calc(15px*var(--fs,1)); line-height:1;
    color:var(--ink-soft); background:color-mix(in srgb,var(--ink) 10%,transparent); display:none; align-items:center; justify-content:center;
  }
  .srch-clear:hover{ background:color-mix(in srgb,var(--ink) 18%,transparent); }
  .srch.has-q .srch-clear{ display:inline-flex; }
  .srch-count{ margin:6px 4px 0; font-size:calc(12px*var(--fs,1)); color:var(--ink-faint); min-height:0; }
  .srch-count:empty{ display:none; }

  .srch-results{ display:none; flex:1; min-height:0; overflow-y:auto; padding:2px 12px 16px; }
  .side.searching .srch-results{ display:block; }
  .side.searching .side-nav{ display:none; }
  .srch-item{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; font:inherit; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:11px; padding:9px 10px; margin-bottom:2px; cursor:pointer;
  }
  .srch-item:hover, .srch-item:focus-visible{ background:var(--bg-subtle); border-color:var(--border); outline:none; }
  .srch-item.cur{ background:var(--accent-soft); border-color:var(--accent-soft-2); }
  :root[data-theme="dark"] .srch-item.cur{ background:rgba(201,169,97,.1); border-color:rgba(201,169,97,.4); }
  .srch-tag{
    --c:var(--accent); flex:none; min-width:30px; height:24px; padding:0 6px; margin-top:2px; border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center; font-size:calc(12px*var(--fs,1)); font-weight:700; letter-spacing:.02em;
    color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  }
  .srch-main{ min-width:0; flex:1; }
  .srch-w{ font-size:calc(17px*var(--fs,1)); font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
  .srch-r{ font-size:calc(12.5px*var(--fs,1)); font-weight:500; color:var(--ink-faint); margin-left:7px; }
  .srch-m{ font-size:calc(14px*var(--fs,1)); line-height:1.4; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .srch-t{ margin-top:2px; font-size:calc(11.5px*var(--fs,1)); color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srch-more{ display:block; width:100%; margin:8px 0 0; padding:10px; font:inherit; font-size:calc(14px*var(--fs,1)); font-weight:600; color:var(--ink-soft); background:var(--bg-subtle); border:1px solid var(--border); border-radius:11px; cursor:pointer; }
  .srch-more:hover{ border-color:var(--ink-faint); }
  .srch-empty{ padding:26px 12px; text-align:center; color:var(--ink-faint); font-size:calc(14.5px*var(--fs,1)); line-height:1.7; }

  @keyframes srchPulse{
    0%,100%{ box-shadow:0 0 0 0 transparent; transform:none; }
    25%,65%{ box-shadow:0 0 0 4px var(--accent), 0 0 24px 3px color-mix(in srgb,var(--accent) 55%,transparent); transform:scale(1.07); }
  }
  @keyframes srchPulseD{
    0%,100%{ box-shadow:0 0 0 0 transparent; transform:none; }
    25%,65%{ box-shadow:0 0 0 4px #C9A961, 0 0 24px 3px rgba(201,169,97,.55); transform:scale(1.07); }
  }
  .item-card.srch-hit{ position:relative; z-index:3; animation:srchPulse 1.1s ease-in-out 3; }
  :root[data-theme="dark"] .item-card.srch-hit{ animation-name:srchPulseD; }
  /* ===== v6: logo + tên to gấp 1.5, header trượt theo danh sách, danh sách bo tròn nổi trên nền ===== */
  .side{
    --side-bg:var(--bg); background:var(--side-bg);
    overflow-x:hidden; overflow-y:auto; scrollbar-width:thin;
    scroll-padding-top:70px; scroll-padding-bottom:84px;
  }
  :root[data-theme="dark"] .side{ --side-bg:#120D0B; background:var(--side-bg); }

  /* logo hoa 50→75px (giảm 20% → 60px), tên 21→31.5px, dòng N5→N1 10.5→15.75px */
  .side header .brand{ gap:18px !important; padding:18px 20px 10px; }
  .side header .brand .brand-mark,
  :root[data-theme="dark"] .side header .brand .brand-mark{ width:60px !important; height:60px !important; }
  .side header .brand-text{ min-width:0; }
  .side header .brand-text h1{ font-size:calc(31.5px*var(--fs,1)); }
  .side header .brand-text p{ margin:4px 0 0 !important; }
  .side header .brand-lv{ font-size:calc(15.75px*var(--fs,1)) !important; gap:10px !important; }

  /* ô tìm kiếm ghim phía trên, header + logo cuộn lên cùng danh sách */
  .srch{ position:sticky; top:0; z-index:5; background:var(--side-bg); padding:6px 14px 10px; }
  .hdr-grip{ display:none !important; }
  .srch::after{ content:""; position:absolute; left:0; right:0; top:100%; height:12px; pointer-events:none;
    background:linear-gradient(var(--side-bg),transparent); }

  /* danh sách: không tự cuộn riêng nữa, bo viền mềm + đổ bóng nhẹ cho nổi hơn nền */
  .side-nav, .srch-results{
    flex:none; min-height:auto; overflow:visible;
    margin:2px 12px 16px; padding:8px 10px 12px;
    background:var(--bg-card); border:1px solid var(--border); border-radius:20px;
    box-shadow:0 1px 2px rgba(60,45,25,.06), 0 12px 28px -14px rgba(60,45,25,.38);
  }
  .srch-results{ padding:8px 8px 10px; }
  :root[data-theme="dark"] .side-nav, :root[data-theme="dark"] .srch-results{
    background:linear-gradient(180deg,#1C1411,#16100E); border-color:rgba(201,169,97,.28);
    box-shadow:0 14px 30px -14px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.35), inset 0 1px 0 rgba(201,169,97,.08);
  }

  /* nút sáng/tối vẫn luôn hiện ở đáy */

  .kj-sp{ flex:1; }
  .kj-b{ font:inherit; font-size:calc(14px*var(--fs,1)); font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer; color:var(--ink); background:var(--bg-subtle); border:1px solid var(--border); }
  .kj-b:hover:not(:disabled){ border-color:var(--accent); }

  .kj-b.nav{ font-size:calc(18px*var(--fs,1)); padding:4px 18px; line-height:1.2; }
  .kj-sel{ font:inherit; font-size:calc(14px*var(--fs,1)); padding:6px 10px; border-radius:10px; color:var(--ink); background:var(--bg-subtle); border:1px solid var(--border); max-width:46vw; }
  .kj-pg{ font-size:calc(13px*var(--fs,1)); color:var(--ink-faint); min-width:54px; text-align:center; }
  .kj-grid{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(8,1fr); overflow:hidden; }
  .kj-c{ position:relative; perspective:900px; cursor:pointer; border-right:1px solid var(--border-soft,var(--border)); border-bottom:1px solid var(--border-soft,var(--border)); min-width:0; min-height:0; outline:none; -webkit-tap-highlight-color:transparent; }
  .kj-in{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.1,.2,1); }
  .kj-c.flip .kj-in{ transform:rotateY(180deg); }
  /* bấm lật → phóng to gấp đôi ngay tại vị trí, bấm lần nữa → lật lại & về chỗ cũ */
  .kj-c{ transition:none; }
  .kj-c.zoom,.kj-c.kj-unz:not(.zoom){ transition:transform .35s cubic-bezier(.4,.1,.2,1), box-shadow .35s ease; }
  .kj-c.zoom{ z-index:30; background:var(--bg-card); border-color:transparent; border-radius:9px; transform:translate(var(--zx,0px),var(--zy,0px)) scale(2);
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lv,var(--accent)) 50%,var(--bg-card)), 0 18px 40px -10px color-mix(in srgb,var(--lv,var(--accent)) 28%,rgba(0,0,0,.25)); }
  .kj-c.zoom .kj-fa,.kj-c.zoom .kj-bk{ border-radius:9px; }
  .kj-c.zoom .kj-bk{ background:linear-gradient(180deg,color-mix(in srgb,var(--lv,var(--accent)) 8%,var(--bg-card)) 0%,var(--bg-card) 78%); }
  /* tên level: chữ trắng trên nút màu theo cấp độ (N5 xanh lá, N4 xanh dương, N3 vàng, N2 cam, N1 tím) */
  .kj-n i{ background:color-mix(in srgb,var(--lv,var(--accent)) 72%,#fff); color:#fff; padding:1px 7px; border-radius:999px; letter-spacing:.04em; }
  .kj-c:focus-visible{ box-shadow:inset 0 0 0 2px var(--accent); }
  .kj-fa,.kj-bk{ position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; overflow:hidden; }
  .kj-fa{ display:flex; align-items:center; justify-content:center; }
  /* hover giống thẻ トピック: viền + phát sáng nhẹ theo màu level, nhích lên một chút */
  .kj-c:not(.zoom):not(.kj-unz):hover{ transition:none; }
  .kj-c:not(.zoom):hover{ z-index:6; border-color:transparent; border-radius:10px; transform:translateY(-2px);
    background:linear-gradient(180deg,color-mix(in srgb,var(--lv,var(--accent)) 9%,var(--bg-card)) 0%,var(--bg-card) 80%);
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lv,var(--accent)) 55%,var(--bg-card)), 0 6px 16px -4px color-mix(in srgb,var(--lv,var(--accent)) 32%,transparent); }
  .kj-c:not(.zoom):hover .kj-fa,.kj-c:not(.zoom):hover .kj-bk{ border-radius:10px; }
  :root[data-theme="dark"] .kj-c:not(.zoom):hover{
    background:linear-gradient(180deg,#1E1613,var(--bg-card));
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lv,var(--accent)) 60%,transparent), 0 0 22px -2px color-mix(in srgb,var(--lv,var(--accent)) 70%,transparent), 0 10px 22px rgba(0,0,0,.5); }
  .kj-bk{ transform:rotateY(180deg); display:grid; grid-template-columns:auto 1fr; grid-template-rows:1fr auto; column-gap:.5vw; padding:.4vh .6vw .5vh; background:color-mix(in srgb,var(--accent) 8%,var(--bg)); }
  .kj-bk .kj-k{ grid-row:1; grid-column:1; align-self:center; }
  .kj-k{ font-family:"EB Garamond","Shippori Mincho","Noto Serif JP","Noto Serif CJK JP",serif; font-size:calc(clamp(22px,min(5.9vh,4vw),67px)*var(--fs,1)); line-height:1.05; color:var(--ink); }
  :root[data-theme="dark"] .kj-k{ color:var(--gold-hi,var(--ink)); }
  .kj-r{ grid-row:1; grid-column:2; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; text-align:right; min-width:0; padding:.3vh 0; font-size:calc(clamp(9px,1.3vh,13px)*var(--fs,1)); line-height:1.25; color:var(--ink-soft); overflow:hidden; }
  .kj-r .on{ color:var(--ink-soft); } .kj-r .kun{ color:var(--ink-faint); }
  .kj-f{ grid-row:2; grid-column:1 / 3; display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .kj-hv{ font-family:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-weight:700; font-size:calc(clamp(11px,1.6vh,16px)*var(--fs,1)); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (max-width:1000px){

    .kj-k{ font-size:calc(clamp(27px,7.2vw,51px)*var(--fs,1)); } .kj-r{ font-size:calc(11px*var(--fs,1)); } .kj-hv{ font-size:calc(13px*var(--fs,1)); } .kj-n{ font-size:calc(10px*var(--fs,1)); }
  }
  @media (max-width:640px){ .kj-grid{ grid-template-columns:repeat(3,1fr); } .kj-bar{ flex-wrap:wrap; } }

.kg-stimg{width:100%;height:100%;object-fit:contain;display:block}.kg-sealbox{width:120px;height:120px;margin:0 auto 8px}.kg-sealbox.big{width:170px;height:170px}.kg-sealbox.got{transform:rotate(-5deg);animation:kgst .55s ease-out}

.kg-ghost span{font-size:calc(52px*var(--fs,1));font-weight:800;line-height:1}.kg-ghost small{font-size:calc(12px*var(--fs,1));font-weight:700}
.kg-sv{width:100%;height:100%;display:block}.kg-sv1{filter:drop-shadow(0 0 7px rgba(232,199,102,.6))}.kg-sv2{filter:drop-shadow(1px 2px 0 rgba(0,0,0,.18))}
.kg-sv .r{fill:var(--accent)}.kg-sv .rd{fill:#8E2318}.kg-sv .rs{fill:none;stroke:var(--accent)}.kg-sv .p{fill:var(--bg-card)}.kg-sv .ps{fill:none;stroke:var(--bg-card)}.kg-sv .g{fill:#F0D27A}.kg-sv .gs{fill:none;stroke:#F0D27A}
/* ===== v3 ===== */
.kg-x{font-size:calc(30px*var(--fs,1));line-height:1;width:58px;height:58px;min-width:0;padding:0;display:flex;align-items:center;justify-content:center}
.kg-logo{margin-left:auto}
.kg-modes{display:grid;gap:10px}.kg-modes .kg-btn{margin-top:0}
.kg-btn small{display:block;font-weight:500;font-size:calc(12px*var(--fs,1));opacity:.85;margin-top:3px}
.kg-btn:disabled{opacity:.4;cursor:default}
.kg-inp{width:100%;font:inherit;font-size:calc(26px*var(--fs,1));padding:14px;margin-top:14px;border:2px solid var(--edge);background:var(--bg);color:var(--ink);text-align:center}
/* ===== v4: header redesign ===== */
.kg-head{display:block;padding-bottom:14px}
.kg-top{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:12px}
.kg-x{border-radius:0;transition:background .15s,transform .15s}.kg-x:hover{background:var(--accent);transform:rotate(-4deg)}
.kg-title{text-align:center;line-height:1.1}
.kg-title b{display:block;font-size:calc(36px*var(--fs,1));font-weight:800;letter-spacing:.24em;padding-left:.24em}
.kg-title small{display:block;margin-top:6px;font-size:calc(12px*var(--fs,1));letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap}
.kg-title small::before,.kg-title small::after{content:"";display:inline-block;width:18px;height:1px;background:var(--ink-faint);vertical-align:middle;margin:0 8px}
.kg-rseal{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:3px solid var(--accent);color:var(--accent);font-size:calc(32px*var(--fs,1));font-weight:800;transform:rotate(-4deg);border-radius:3px;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--accent)}
.kg-rankrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.kg-rankrow b{font-size:calc(17px*var(--fs,1))}.kg-rankrow small{color:var(--ink-soft);font-size:calc(13px*var(--fs,1))}
.kg-bar{height:10px}
@media (max-width:440px){.kg-title small::before,.kg-title small::after{display:none}.kg-title b{font-size:calc(30px*var(--fs,1))}.kg-top{gap:8px}}
.kg-h,.kg-sub{text-align:left}.kg-panel .kg-sub{text-align:inherit}
.kg-book .kg-sub{text-align:center}

/* ===== v5: dark = 夜の和紙 (cùng ngôn ngữ với bản sáng) ===== */
:root{--edge:#1F1B16}
:root[data-theme="dark"]{--bg-art-opacity:.42}
:root[data-theme="dark"] body::after{background:radial-gradient(ellipse at 8% 0%,rgba(224,96,74,.07),transparent 55%)}
:root[data-theme="dark"] .overlay{background:rgba(10,8,6,.72)}
:root[data-theme="dark"] header,:root[data-theme="dark"] .topbar{border-bottom-color:var(--edge)!important}
:root[data-theme="dark"] .brand-mark{box-shadow:3px 3px 0 var(--accent)!important}
:root[data-theme="dark"] .side header .brand .brand-mark{filter:none!important}
:root[data-theme="dark"] .side .brand{--bgold:#C8A15A;--bgold-hi:#F0E7D4;--mk-bg:#2A231C;--mk-glow:none;--ti:linear-gradient(180deg,#F5EBD6,#D8C8A4)}
:root[data-theme="dark"] .theme-switch{--bgold:#C8A15A;--mk-bg:#2A231C;--mk-glow:none;--on-ink:#F0E7D4;border-color:var(--edge)}
:root[data-theme="dark"] .side{background:var(--side-bg);border-right:1px solid var(--border);box-shadow:none}
:root[data-theme="dark"] .side header{border-bottom-color:var(--edge)}
:root[data-theme="dark"] .side-nav,:root[data-theme="dark"] .srch-results{background:var(--bg-card);border-color:var(--border);box-shadow:0 10px 24px -14px rgba(0,0,0,.7)}
:root[data-theme="dark"] .side-label{color:var(--ink-faint)}
:root[data-theme="dark"] .side-label::after{background:var(--border)}
:root[data-theme="dark"] .side-item:hover{background:rgba(240,231,212,.05)}
:root[data-theme="dark"] .side-item.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);color:var(--ink)}
:root[data-theme="dark"] .side-item.home,:root[data-theme="dark"] .side-item.game-btn{color:var(--ink)}
:root[data-theme="dark"] .side-ctrl{border-left-color:var(--border)}
:root[data-theme="dark"] .side-ctrl .tab-btn.active{border-left-color:var(--accent)}
:root[data-theme="dark"] .side-foot{border-top-color:var(--border)}
:root[data-theme="dark"] .side-branch-head{background:var(--bg-card);border-color:var(--border)}
:root[data-theme="dark"] .side-branch-head b{color:var(--ink)}
:root[data-theme="dark"] .side-branch-head:hover,:root[data-theme="dark"] .side-branch.open > .side-branch-head,:root[data-theme="dark"] .side-branch-head.game-btn.active{border-color:var(--accent);box-shadow:none}
:root[data-theme="dark"] .side-branch.open > .side-branch-head .chev{color:var(--accent)}
:root[data-theme="dark"] .side-sub{border-left-color:var(--border)}
:root[data-theme="dark"] .side-resizer:hover::after,:root[data-theme="dark"] body.side-resizing .side-resizer::after{background:var(--accent)}
:root[data-theme="dark"] .hdr-grip{--g:var(--ink-faint)}
:root[data-theme="dark"] .welcome h2,:root[data-theme="dark"] .game-head h2{color:var(--ink)}
:root[data-theme="dark"] .topic-card,:root[data-theme="dark"] .item-card,:root[data-theme="dark"] .item-card.lv,:root[data-theme="dark"] .item-card.advanced,:root[data-theme="dark"] .compare-item,:root[data-theme="dark"] .example-box,:root[data-theme="dark"] .poem-box,:root[data-theme="dark"] .game-panel{border:1px solid var(--edge)!important;background:linear-gradient(180deg,var(--card-top),var(--bg-card))!important;box-shadow:var(--shadow-card)!important}
:root[data-theme="dark"] .item-card:hover,:root[data-theme="dark"] .item-card.lv:hover,:root[data-theme="dark"] .item-card.advanced:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--accent)!important}
:root[data-theme="dark"] .item-card .jp,:root[data-theme="dark"] .item-card.lv .jp,:root[data-theme="dark"] .item-card.advanced .jp{color:var(--ink)}
:root[data-theme="dark"] .modal{border:1px solid var(--edge)!important;background:var(--bg-card)!important;box-shadow:var(--shadow-modal)!important;outline:none}
:root[data-theme="dark"] .modal-headword{color:var(--ink);text-shadow:none}
:root[data-theme="dark"] .modal-close{border-color:var(--edge);color:var(--ink)}
:root[data-theme="dark"] .modal-section-label{color:var(--accent-dark);letter-spacing:.1em;text-transform:none}
:root[data-theme="dark"] .level-head{border-bottom-color:var(--edge)}
:root[data-theme="dark"] .level-tag,:root[data-theme="dark"] .badge-level{border-color:var(--edge)}
:root[data-theme="dark"] .tab-btn.active{border-bottom-color:var(--accent)}
:root[data-theme="dark"] .srch-box{border-color:var(--border)}
:root[data-theme="dark"] .srch-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,96,74,.2)}
:root[data-theme="dark"] .srch-item.cur{background:var(--accent-soft);border-color:var(--accent)}
:root[data-theme="dark"] .g-chip[aria-pressed="true"],:root[data-theme="dark"] .g-msg.me,:root[data-theme="dark"] .game-end{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
:root[data-theme="dark"] .game-need .big{color:var(--ink);border-color:var(--accent)}
:root[data-theme="dark"] .g-msg .w .hl{color:var(--accent-dark)}
:root[data-theme="dark"] .g-btn.primary{background:var(--accent);border-color:var(--accent);color:#1B1713}
:root[data-theme="dark"] .kg-side{box-shadow:3px 3px 0 var(--edge)}
:root[data-theme="dark"] .side{--side-bg:var(--sidebg)}
:root[data-theme="dark"] .side-foot{background:var(--side-bg)}
:root[data-theme="dark"] .theme-switch{border:1px solid var(--edge)!important}
:root[data-theme="dark"] .theme-opt[aria-checked="true"]{background:var(--accent-soft)!important;border-color:var(--accent)!important;box-shadow:none!important;color:var(--ink)}
:root[data-theme="dark"] .kg-tile.lock{opacity:.75;border-color:var(--ink-faint);background:var(--bg-subtle)}
:root[data-theme="dark"] .kg-ghost{border-color:var(--ink-faint);color:var(--ink-faint);opacity:.6}
:root[data-theme="dark"] .kg-tile{border-color:var(--border)}
:root[data-theme="dark"] .kg-sv .r{fill:#CC4331}:root[data-theme="dark"] .kg-sv .rs{stroke:#CC4331}
:root[data-theme="dark"] .theme-switch{background:var(--bg-subtle)!important}

/* ===== hiệu năng: họa tiết giấy nằm trên lớp cố định (vẽ 1 lần, không vẽ lại khi cuộn) ===== */
body::before,.kg-root::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,60,.045) 3px 4px)}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] .kg-root::before{background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,236,200,.025) 3px 4px)}

/* ===== v6: giảm chói ở chế độ tối (Dịu mặc định · Vừa · Rõ) ===== */
:root[data-theme="dark"] .tab-btn.active{background:var(--accent-soft)!important;color:var(--ink)!important;border-color:var(--accent)!important}
:root[data-theme="dark"] .kg-nav button.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
:root[data-theme="dark"] .kg-x{background:var(--bg-card);color:var(--ink);border-color:var(--edge)}
:root[data-theme="dark"] .kg-btn{background:var(--accent);color:#F3E9D6;border-color:var(--accent)}
:root[data-theme="dark"] .kg-btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
:root[data-theme="dark"] .kg-lvbar button.on,:root[data-theme="dark"] .kg-opts button.ok,:root[data-theme="dark"] .kg-opts button.bad,:root[data-theme="dark"] .kg-side,:root[data-theme="dark"] .g-btn.primary{color:#F3E9D6}
:root[data-theme="dark"][data-contrast="hi"] .tab-btn.active{background:var(--ink)!important;color:var(--bg)!important}
:root[data-theme="dark"][data-contrast="hi"] .kg-nav button.on{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"][data-contrast="hi"] .kg-x{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"][data-contrast="hi"] .kg-btn{background:var(--ink);color:var(--bg);border-color:var(--edge)}
:root[data-theme="dark"][data-contrast="hi"] .kg-btn.ghost{background:transparent;color:var(--ink)}
/* コントラスト: thanh nổi, nằm ngoài sidebar (bên phải nút ダーク, sát mép dưới). Sau 10s thu thành chấm xanh */
.kg-contrast{position:fixed;z-index:9990;left:var(--ct-l,382px);bottom:12px;display:none;align-items:center;gap:8px;font-family:inherit}
:root[data-theme="dark"] .kg-contrast{display:flex}
.kg-contrast.away{display:none!important}
.kg-contrast .ct-dot{flex:none;width:22px;height:22px;padding:0;border-radius:50%!important;border:2px solid var(--bg-card);background:#3FBF7F;cursor:pointer;box-shadow:0 0 0 1px rgba(63,191,127,.55),0 0 10px 1px rgba(63,191,127,.55);transition:transform .15s}
.kg-contrast .ct-dot:hover{transform:scale(1.15)}
.kg-contrast.open .ct-dot{box-shadow:0 0 0 1px rgba(63,191,127,.55)}
.kg-contrast .ct-body{display:none;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-card);border:1px solid var(--edge,var(--border));box-shadow:3px 3px 0 var(--edge,var(--border));border-radius:10px}
.kg-contrast.open .ct-body{display:flex;animation:ctIn .22s ease-out both}
@keyframes ctIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.kg-contrast span{font-size:calc(12px*var(--fs,1));color:var(--ink-soft);margin:0 4px 0 2px;flex:none;white-space:nowrap}
.kg-contrast .ct-body button{font:inherit;font-size:calc(13px*var(--fs,1));font-weight:700;padding:7px 12px;border:1px solid var(--border);background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:6px;white-space:nowrap}
.kg-contrast .ct-body button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
@media (max-width:900px){.kg-contrast .ct-body{flex-direction:column;align-items:stretch}.kg-contrast{align-items:flex-end}}

/* =====================================================================
   ĐĂNG NHẬP THEO TÊN (login gate) — đồng bộ phong cách 朱印帖
   Muốn chỉnh giao diện riêng từng người: dùng html[data-user="airi"] (xem cuối khối)
   ===================================================================== */
.lg{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--ink);overflow:auto;transition:opacity .4s ease,visibility .4s}
.lg::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,60,.045) 3px 4px)}
.lg.out{opacity:0;visibility:hidden;pointer-events:none}
.lg[hidden]{display:none}
html.lg-open body{overflow:hidden}
.lg-card{position:relative;width:min(440px,100%);margin:auto;padding:40px 34px 30px;text-align:center;background:var(--bg-card);border:1px solid var(--edge,var(--btn-border));border-radius:var(--radius-md);box-shadow:var(--shadow-modal);overflow:hidden}
.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#3F8F5F 0 20%,#2E7FA6 20% 40%,#C08A22 40% 60%,#C25A34 60% 80%,#8B5CB8 80% 100%)}
.lg-brand{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:26px}
.lg-mark{width:56px;height:56px;flex:none;border-radius:4px;transform:rotate(-5deg);background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#000));box-shadow:3px 3px 0 var(--edge,var(--btn-border));display:flex;align-items:center;justify-content:center;overflow:hidden}
.lg-mark img{width:100%;height:100%;object-fit:cover;display:block}
.lg-brand h1{margin:0;font-size:calc(28px*var(--fs,1));font-weight:800;letter-spacing:.16em;line-height:1.15;text-align:left}
.lg-brand p{margin:4px 0 0;font-size:calc(12.5px*var(--fs,1));letter-spacing:.06em;color:var(--ink-soft);text-align:left}
/* con dấu: ô giấy washi — ảnh dấu được "nhân" (multiply) lên nền giấy */
.lg-seal{width:152px;height:152px;margin:0 auto 22px;position:relative;transform:rotate(-3deg);transition:transform .3s}
.lg-paper{position:absolute;inset:0;overflow:hidden;background:#E8DFCF;border:3px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:border-color .3s,box-shadow .3s}
.lg-paper img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.32);mix-blend-mode:multiply;filter:brightness(1.07) contrast(1.1);opacity:0;transition:opacity .25s}
.lg-ph,.lg-ini{font-size:calc(46px*var(--fs,1));font-weight:800;line-height:1;color:var(--border);user-select:none}
.lg-ini{display:none;color:var(--accent)}
.lg-seal.has .lg-paper{border:1px solid var(--edge,var(--btn-border));box-shadow:4px 4px 0 var(--edge,var(--btn-border))}
.lg-seal.has .lg-paper img{opacity:1}
.lg-seal.has .lg-ph{display:none}
.lg-seal.noimg .lg-paper{border:4px solid var(--accent);box-shadow:none}
.lg-seal.noimg .lg-paper img,.lg-seal.noimg .lg-ph{display:none}
.lg-seal.noimg .lg-ini{display:block}
.lg-seal.stamp{animation:lgst .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes lgst{0%{transform:scale(2.4) rotate(-22deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.lg-lab{display:block;font-size:calc(15px*var(--fs,1));font-weight:700;letter-spacing:.1em;margin:0 0 4px}
.lg-hint{display:block;font-size:calc(12.5px*var(--fs,1));color:var(--ink-soft);margin-bottom:12px}
.lg-in{display:block;width:100%;padding:12px 14px;font:inherit;font-size:calc(19px*var(--fs,1));font-weight:700;letter-spacing:.08em;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--edge,var(--btn-border));border-radius:2px;outline:none}
.lg-in::placeholder{color:var(--ink-faint);font-weight:500;letter-spacing:.04em}
.lg-in:focus{outline:2px solid var(--accent);outline-offset:2px}
.lg-in.shake{animation:kgsk .3s}
.lg-err{min-height:1.5em;margin:10px 0 2px;font-size:calc(13px*var(--fs,1));color:var(--accent);font-weight:700}
.lg-go{display:block;width:100%;margin-top:6px;padding:13px 16px;font:inherit;font-size:calc(17px*var(--fs,1));font-weight:800;letter-spacing:.14em;color:var(--bg);background:var(--ink);border:2px solid var(--edge,var(--btn-border));border-radius:2px;box-shadow:3px 3px 0 var(--accent);cursor:pointer;transition:transform .1s,box-shadow .1s}
.lg-go:hover{filter:brightness(1.12)}
.lg-go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent)}
.lg-hello{display:none}
.lg[data-stage="hello"] .lg-form{display:none}
.lg[data-stage="hello"] .lg-hello{display:block}
.lg-greet{margin:0 0 8px;font-size:calc(30px*var(--fs,1));font-weight:800;letter-spacing:.05em;line-height:1.3;word-break:break-word;animation:lgup .5s .45s ease-out both}
.lg-sub{margin:0 0 18px;font-size:calc(15px*var(--fs,1));line-height:1.7;color:var(--ink-soft);animation:lgup .5s .65s ease-out both}
.lg-hello .lg-go{animation:lgup .5s .85s ease-out both}
@keyframes lgup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* dòng nhỏ Client: nằm dưới nút, không làm đổi bố cục */
.lg-guest-line{margin:14px 0 0;font-size:calc(13px*var(--fs,1));color:var(--ink-soft);line-height:1.5}
.lg-guest{display:inline;padding:0;margin:0;font:inherit;font-weight:700;color:var(--accent);background:none;border:0;border-bottom:1px dashed var(--accent);cursor:pointer}
.lg-guest b{font-weight:800;letter-spacing:.06em}
.lg-guest:hover{filter:brightness(.85)}
.lg-guest:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* chip đổi người dùng, nằm cạnh dòng "Made by" */
.lg-chip{font:inherit;font-size:inherit;color:var(--ink-soft);background:none;border:0;border-bottom:1px dotted var(--ink-faint);padding:0 1px;margin-right:12px;cursor:pointer}
.lg-chip:hover{color:var(--accent-dark);border-bottom-color:var(--accent)}
@media (max-width:480px){.lg-card{padding:34px 22px 26px}.lg-brand h1{font-size:calc(24px*var(--fs,1))}.lg-greet{font-size:calc(26px*var(--fs,1))}}
@media (prefers-reduced-motion:reduce){.lg-seal.stamp,.lg-greet,.lg-sub,.lg-hello .lg-go,.lg-in.shake{animation:none}.lg{transition:none}}
/* ---- Giao diện riêng từng người (ví dụ, bỏ comment để dùng) ----
html[data-user="airi"][data-theme]{ --accent:#C2547A; }
html[data-user="ryosuke"][data-theme]{ --accent:#2E7FA6; }
*/

/* ---- con dấu mờ góc phải màn hình (đối xứng huy hiệu hoa ở góc trái) ---- */
:root{--lg-corner-o:.42;--lg-corner-size:84px}
.lg-corner{position:fixed;top:12px;right:20px;width:var(--lg-corner-size);height:var(--lg-corner-size);z-index:1;pointer-events:none;opacity:0;transform:rotate(-6deg);transition:opacity 1s ease .25s;mix-blend-mode:multiply}
.lg-corner.has,.lg-corner.noimg{opacity:var(--lg-corner-o)}
.lg-corner img{position:absolute;left:50%;top:50%;width:195%;max-width:none;height:auto;transform:translate(-50%,-50%);filter:brightness(1.07) contrast(1.1);-webkit-mask-image:radial-gradient(circle closest-side,#000 60%,transparent 72%);mask-image:radial-gradient(circle closest-side,#000 60%,transparent 72%)}
.lg-corner span{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:calc(40px*var(--fs,1));font-weight:800;color:var(--accent);border:4px solid var(--accent);border-radius:4px}
.lg-corner.noimg img{display:none}.lg-corner.noimg span{display:flex}
:root[data-theme="dark"]{--lg-corner-o:.55}
:root[data-theme="dark"] .lg-corner{mix-blend-mode:screen}
