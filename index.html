.kg-lvbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kg-opts{grid-template-columns:1fr 1fr;gap:12px}
.kg-opts button{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:calc(19px*var(--fs,1));font-weight:700;padding:14px 10px;border-width:2px;box-shadow:3px 3px 0 var(--border);line-height:1.35}
.kg-opts button .jp{font-size:calc(30px*var(--fs,1));font-weight:800}.kg-opts button small{font-size:calc(13px*var(--fs,1));opacity:.8;font-weight:500}
.kg-opts button:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.kg-stamps{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.kg-stimg{width:100%;height:100%;object-fit:contain;display:block}.kg-sealbox{width:120px;height:120px;margin:0 auto 8px}.kg-sealbox.big{width:170px;height:170px}.kg-sealbox.got{transform:rotate(-5deg);animation:kgst .55s ease-out}
.kg-ghost{width:100%;height:100%;border:3px dashed var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--border)}
.kg-ghost span{font-size:calc(52px*var(--fs,1));font-weight:800;line-height:1}.kg-ghost small{font-size:calc(12px*var(--fs,1));font-weight:700}
.kg-sv{width:100%;height:100%;display:block}.kg-sv1{filter:drop-shadow(0 0 7px rgba(232,199,102,.6))}.kg-sv2{filter:drop-shadow(1px 2px 0 rgba(0,0,0,.18))}
.kg-sv .r{fill:var(--accent)}.kg-sv .rd{fill:#8E2318}.kg-sv .rs{fill:none;stroke:var(--accent)}.kg-sv .p{fill:var(--bg-card)}.kg-sv .ps{fill:none;stroke:var(--bg-card)}.kg-sv .g{fill:#F0D27A}.kg-sv .gs{fill:none;stroke:#F0D27A}
/* ===== v3 ===== */
.kg-x{font-size:calc(30px*var(--fs,1));line-height:1;width:58px;height:58px;min-width:0;padding:0;display:flex;align-items:center;justify-content:center}
.kg-logo{margin-left:auto}
.kg-modes{display:grid;gap:10px}.kg-modes .kg-btn{margin-top:0}
.kg-btn small{display:block;font-weight:500;font-size:calc(12px*var(--fs,1));opacity:.85;margin-top:3px}
.kg-btn:disabled{opacity:.4;cursor:default}
.kg-inp{width:100%;font:inherit;font-size:calc(26px*var(--fs,1));padding:14px;margin-top:14px;border:2px solid var(--edge);background:var(--bg);color:var(--ink);text-align:center}
/* ===== v4: header redesign ===== */
.kg-head{display:block;padding-bottom:14px}
.kg-top{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:12px}
.kg-x{border-radius:0;transition:background .15s,transform .15s}.kg-x:hover{background:var(--accent);transform:rotate(-4deg)}
.kg-title{text-align:center;line-height:1.1}
.kg-title b{display:block;font-size:calc(36px*var(--fs,1));font-weight:800;letter-spacing:.24em;padding-left:.24em}
.kg-title small{display:block;margin-top:6px;font-size:calc(12px*var(--fs,1));letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap}
.kg-title small::before,.kg-title small::after{content:"";display:inline-block;width:18px;height:1px;background:var(--ink-faint);vertical-align:middle;margin:0 8px}
.kg-rseal{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:3px solid var(--accent);color:var(--accent);font-size:calc(32px*var(--fs,1));font-weight:800;transform:rotate(-4deg);border-radius:3px;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--accent)}
.kg-rankrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.kg-rankrow b{font-size:calc(17px*var(--fs,1))}.kg-rankrow small{color:var(--ink-soft);font-size:calc(13px*var(--fs,1))}
.kg-bar{height:10px}
@media (max-width:440px){.kg-title small::before,.kg-title small::after{display:none}.kg-title b{font-size:calc(30px*var(--fs,1))}.kg-top{gap:8px}}
.kg-h,.kg-sub{text-align:left}.kg-panel .kg-sub{text-align:inherit}
.kg-book .kg-sub{text-align:center}

/* ===== v5: dark = 夜の和紙 (cùng ngôn ngữ với bản sáng) ===== */
:root{--edge:#1F1B16}
:root[data-theme="dark"]{--bg-art-opacity:.42}
:root[data-theme="dark"] body::after{background:radial-gradient(ellipse at 8% 0%,rgba(224,96,74,.07),transparent 55%)}
:root[data-theme="dark"] .overlay{background:rgba(10,8,6,.72)}
:root[data-theme="dark"] header,:root[data-theme="dark"] .topbar{border-bottom-color:var(--edge)!important}
:root[data-theme="dark"] .brand-mark{box-shadow:3px 3px 0 var(--accent)!important}
:root[data-theme="dark"] .side header .brand .brand-mark{filter:none!important}
:root[data-theme="dark"] .side .brand{--bgold:#C8A15A;--bgold-hi:#F0E7D4;--mk-bg:#2A231C;--mk-glow:none;--ti:linear-gradient(180deg,#F5EBD6,#D8C8A4)}
:root[data-theme="dark"] .theme-switch{--bgold:#C8A15A;--mk-bg:#2A231C;--mk-glow:none;--on-ink:#F0E7D4;border-color:var(--edge)}
:root[data-theme="dark"] .side{background:var(--side-bg);border-right:1px solid var(--border);box-shadow:none}
:root[data-theme="dark"] .side header{border-bottom-color:var(--edge)}
:root[data-theme="dark"] .side-nav,:root[data-theme="dark"] .srch-results{background:var(--bg-card);border-color:var(--border);box-shadow:0 10px 24px -14px rgba(0,0,0,.7)}
:root[data-theme="dark"] .side-label{color:var(--ink-faint)}
:root[data-theme="dark"] .side-label::after{background:var(--border)}
:root[data-theme="dark"] .side-item:hover{background:rgba(240,231,212,.05)}
:root[data-theme="dark"] .side-item.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);color:var(--ink)}
:root[data-theme="dark"] .side-item.home,:root[data-theme="dark"] .side-item.game-btn{color:var(--ink)}
:root[data-theme="dark"] .side-ctrl{border-left-color:var(--border)}
:root[data-theme="dark"] .side-ctrl .tab-btn.active{border-left-color:var(--accent)}
:root[data-theme="dark"] .side-foot{border-top-color:var(--border)}
:root[data-theme="dark"] .side-branch-head{background:var(--bg-card);border-color:var(--border)}
:root[data-theme="dark"] .side-branch-head b{color:var(--ink)}
:root[data-theme="dark"] .side-branch-head:hover,:root[data-theme="dark"] .side-branch.open > .side-branch-head,:root[data-theme="dark"] .side-branch-head.game-btn.active{border-color:var(--accent);box-shadow:none}
:root[data-theme="dark"] .side-branch.open > .side-branch-head .chev{color:var(--accent)}
:root[data-theme="dark"] .side-sub{border-left-color:var(--border)}
:root[data-theme="dark"] .side-resizer:hover::after,:root[data-theme="dark"] body.side-resizing .side-resizer::after{background:var(--accent)}
:root[data-theme="dark"] .hdr-grip{--g:var(--ink-faint)}
:root[data-theme="dark"] .welcome h2,:root[data-theme="dark"] .game-head h2{color:var(--ink)}
:root[data-theme="dark"] .topic-card,:root[data-theme="dark"] .item-card,:root[data-theme="dark"] .item-card.lv,:root[data-theme="dark"] .item-card.advanced,:root[data-theme="dark"] .compare-item,:root[data-theme="dark"] .example-box,:root[data-theme="dark"] .poem-box,:root[data-theme="dark"] .game-panel{border:1px solid var(--edge)!important;background:linear-gradient(180deg,var(--card-top),var(--bg-card))!important;box-shadow:var(--shadow-card)!important}
:root[data-theme="dark"] .item-card:hover,:root[data-theme="dark"] .item-card.lv:hover,:root[data-theme="dark"] .item-card.advanced:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--accent)!important}
:root[data-theme="dark"] .item-card .jp,:root[data-theme="dark"] .item-card.lv .jp,:root[data-theme="dark"] .item-card.advanced .jp{color:var(--ink)}
:root[data-theme="dark"] .modal{border:1px solid var(--edge)!important;background:var(--bg-card)!important;box-shadow:var(--shadow-modal)!important;outline:none}
:root[data-theme="dark"] .modal-headword{color:var(--ink);text-shadow:none}
:root[data-theme="dark"] .modal-close{border-color:var(--edge);color:var(--ink)}
:root[data-theme="dark"] .modal-section-label{color:var(--accent-dark);letter-spacing:.1em;text-transform:none}
:root[data-theme="dark"] .level-head{border-bottom-color:var(--edge)}
:root[data-theme="dark"] .level-tag,:root[data-theme="dark"] .badge-level{border-color:var(--edge)}
:root[data-theme="dark"] .tab-btn.active{border-bottom-color:var(--accent)}
:root[data-theme="dark"] .srch-box{border-color:var(--border)}
:root[data-theme="dark"] .srch-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,96,74,.2)}
:root[data-theme="dark"] .srch-item.cur{background:var(--accent-soft);border-color:var(--accent)}
:root[data-theme="dark"] .g-chip[aria-pressed="true"],:root[data-theme="dark"] .g-msg.me,:root[data-theme="dark"] .game-end{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
:root[data-theme="dark"] .game-need .big{color:var(--ink);border-color:var(--accent)}
:root[data-theme="dark"] .g-msg .w .hl{color:var(--accent-dark)}
:root[data-theme="dark"] .g-btn.primary{background:var(--accent);border-color:var(--accent);color:#1B1713}
:root[data-theme="dark"] .kg-side{box-shadow:3px 3px 0 var(--edge)}
:root[data-theme="dark"] .side{--side-bg:var(--sidebg)}
:root[data-theme="dark"] .side-foot{background:var(--side-bg)}
:root[data-theme="dark"] .theme-switch{border:1px solid var(--edge)!important}
:root[data-theme="dark"] .theme-opt[aria-checked="true"]{background:var(--accent-soft)!important;border-color:var(--accent)!important;box-shadow:none!important;color:var(--ink)}
:root[data-theme="dark"] .kg-tile.lock{opacity:.75;border-color:var(--ink-faint);background:var(--bg-subtle)}
:root[data-theme="dark"] .kg-ghost{border-color:var(--ink-faint);color:var(--ink-faint);opacity:.6}
:root[data-theme="dark"] .kg-tile{border-color:var(--border)}
:root[data-theme="dark"] .kg-sv .r{fill:#CC4331}:root[data-theme="dark"] .kg-sv .rs{stroke:#CC4331}
:root[data-theme="dark"] .theme-switch{background:var(--bg-subtle)!important}

/* ===== hiệu năng: họa tiết giấy nằm trên lớp cố định (vẽ 1 lần, không vẽ lại khi cuộn) ===== */
body::before,.kg-root::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,60,.045) 3px 4px)}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] .kg-root::before{background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,236,200,.025) 3px 4px)}

/* ===== v6: giảm chói ở chế độ tối (Dịu mặc định · Vừa · Rõ) ===== */
:root[data-theme="dark"] .tab-btn.active{background:var(--accent-soft)!important;color:var(--ink)!important;border-color:var(--accent)!important}
:root[data-theme="dark"] .kg-nav button.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
:root[data-theme="dark"] .kg-x{background:var(--bg-card);color:var(--ink);border-color:var(--edge)}
:root[data-theme="dark"] .kg-btn{background:var(--accent);color:#F3E9D6;border-color:var(--accent)}
:root[data-theme="dark"] .kg-btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
:root[data-theme="dark"] .kg-lvbar button.on,:root[data-theme="dark"] .kg-opts button.ok,:root[data-theme="dark"] .kg-opts button.bad,:root[data-theme="dark"] .kg-side,:root[data-theme="dark"] .g-btn.primary{color:#F3E9D6}
:root[data-theme="dark"][data-contrast="hi"] .tab-btn.active{background:var(--ink)!important;color:var(--bg)!important}
:root[data-theme="dark"][data-contrast="hi"] .kg-nav button.on{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"][data-contrast="hi"] .kg-x{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"][data-contrast="hi"] .kg-btn{background:var(--ink);color:var(--bg);border-color:var(--edge)}
:root[data-theme="dark"][data-contrast="hi"] .kg-btn.ghost{background:transparent;color:var(--ink)}
/* コントラスト: thanh nổi, nằm ngoài sidebar (bên phải nút ダーク, sát mép dưới). Sau 10s thu thành chấm xanh */
.kg-contrast{position:fixed;z-index:9990;left:var(--ct-l,382px);bottom:12px;display:none;align-items:center;gap:8px;font-family:inherit}
:root[data-theme="dark"] .kg-contrast{display:flex}
.kg-contrast.away{display:none!important}
.kg-contrast .ct-dot{flex:none;width:22px;height:22px;padding:0;border-radius:50%!important;border:2px solid var(--bg-card);background:#3FBF7F;cursor:pointer;box-shadow:0 0 0 1px rgba(63,191,127,.55),0 0 10px 1px rgba(63,191,127,.55);transition:transform .15s}
.kg-contrast .ct-dot:hover{transform:scale(1.15)}
.kg-contrast.open .ct-dot{box-shadow:0 0 0 1px rgba(63,191,127,.55)}
.kg-contrast .ct-body{display:none;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-card);border:1px solid var(--edge,var(--border));box-shadow:3px 3px 0 var(--edge,var(--border));border-radius:10px}
.kg-contrast.open .ct-body{display:flex;animation:ctIn .22s ease-out both}
@keyframes ctIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.kg-contrast span{font-size:calc(12px*var(--fs,1));color:var(--ink-soft);margin:0 4px 0 2px;flex:none;white-space:nowrap}
.kg-contrast .ct-body button{font:inherit;font-size:calc(13px*var(--fs,1));font-weight:700;padding:7px 12px;border:1px solid var(--border);background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:6px;white-space:nowrap}
.kg-contrast .ct-body button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
@media (max-width:900px){.kg-contrast .ct-body{flex-direction:column;align-items:stretch}.kg-contrast{align-items:flex-end}}

/* =====================================================================
   ĐĂNG NHẬP THEO TÊN (login gate) — đồng bộ phong cách 朱印帖
   Muốn chỉnh giao diện riêng từng người: dùng html[data-user="airi"] (xem cuối khối)
   ===================================================================== */
.lg{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--ink);overflow:auto;transition:opacity .4s ease,visibility .4s}
.lg::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,60,.045) 3px 4px)}
.lg.out{opacity:0;visibility:hidden;pointer-events:none}
.lg[hidden]{display:none}
html.lg-open body{overflow:hidden}
.lg-card{position:relative;width:min(440px,100%);margin:auto;padding:40px 34px 30px;text-align:center;background:var(--bg-card);border:1px solid var(--edge,var(--btn-border));border-radius:var(--radius-md);box-shadow:var(--shadow-modal);overflow:hidden}
.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#3F8F5F 0 20%,#2E7FA6 20% 40%,#C08A22 40% 60%,#C25A34 60% 80%,#8B5CB8 80% 100%)}
.lg-brand{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:26px}
.lg-mark{width:56px;height:56px;flex:none;border-radius:4px;transform:rotate(-5deg);background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#000));box-shadow:3px 3px 0 var(--edge,var(--btn-border));display:flex;align-items:center;justify-content:center;overflow:hidden}
.lg-mark img{width:100%;height:100%;object-fit:cover;display:block}
.lg-brand h1{margin:0;font-size:calc(28px*var(--fs,1));font-weight:800;letter-spacing:.16em;line-height:1.15;text-align:left}
.lg-brand p{margin:4px 0 0;font-size:calc(12.5px*var(--fs,1));letter-spacing:.06em;color:var(--ink-soft);text-align:left}
/* con dấu: ô giấy washi — ảnh dấu được "nhân" (multiply) lên nền giấy */
.lg-seal{width:152px;height:152px;margin:0 auto 22px;position:relative;transform:rotate(-3deg);transition:transform .3s}
.lg-paper{position:absolute;inset:0;overflow:hidden;background:#E8DFCF;border:3px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:border-color .3s,box-shadow .3s}
.lg-paper img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.32);mix-blend-mode:multiply;filter:brightness(1.07) contrast(1.1);opacity:0;transition:opacity .25s}
.lg-ph,.lg-ini{font-size:calc(46px*var(--fs,1));font-weight:800;line-height:1;color:var(--border);user-select:none}
.lg-ini{display:none;color:var(--accent)}
.lg-seal.has .lg-paper{border:1px solid var(--edge,var(--btn-border));box-shadow:4px 4px 0 var(--edge,var(--btn-border))}
.lg-seal.has .lg-paper img{opacity:1}
.lg-seal.has .lg-ph{display:none}
.lg-seal.noimg .lg-paper{border:4px solid var(--accent);box-shadow:none}
.lg-seal.noimg .lg-paper img,.lg-seal.noimg .lg-ph{display:none}
.lg-seal.noimg .lg-ini{display:block}
.lg-seal.stamp{animation:lgst .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes lgst{0%{transform:scale(2.4) rotate(-22deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.lg-lab{display:block;font-size:calc(15px*var(--fs,1));font-weight:700;letter-spacing:.1em;margin:0 0 4px}
.lg-hint{display:block;font-size:calc(12.5px*var(--fs,1));color:var(--ink-soft);margin-bottom:12px}
.lg-in{display:block;width:100%;padding:12px 14px;font:inherit;font-size:calc(19px*var(--fs,1));font-weight:700;letter-spacing:.08em;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--edge,var(--btn-border));border-radius:2px;outline:none}
.lg-in::placeholder{color:var(--ink-faint);font-weight:500;letter-spacing:.04em}
.lg-in:focus{outline:2px solid var(--accent);outline-offset:2px}
.lg-in.shake{animation:kgsk .3s}
.lg-err{min-height:1.5em;margin:10px 0 2px;font-size:calc(13px*var(--fs,1));color:var(--accent);font-weight:700}
.lg-go{display:block;width:100%;margin-top:6px;padding:13px 16px;font:inherit;font-size:calc(17px*var(--fs,1));font-weight:800;letter-spacing:.14em;color:var(--bg);background:var(--ink);border:2px solid var(--edge,var(--btn-border));border-radius:2px;box-shadow:3px 3px 0 var(--accent);cursor:pointer;transition:transform .1s,box-shadow .1s}
.lg-go:hover{filter:brightness(1.12)}
.lg-go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent)}
.lg-hello{display:none}
.lg[data-stage="hello"] .lg-form{display:none}
.lg[data-stage="hello"] .lg-hello{display:block}
.lg-greet{margin:0 0 8px;font-size:calc(30px*var(--fs,1));font-weight:800;letter-spacing:.05em;line-height:1.3;word-break:break-word;animation:lgup .5s .45s ease-out both}
.lg-sub{margin:0 0 18px;font-size:calc(15px*var(--fs,1));line-height:1.7;color:var(--ink-soft);animation:lgup .5s .65s ease-out both}
.lg-hello .lg-go{animation:lgup .5s .85s ease-out both}
@keyframes lgup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* dòng nhỏ Client: nằm dưới nút, không làm đổi bố cục */
.lg-guest-line{margin:14px 0 0;font-size:calc(13px*var(--fs,1));color:var(--ink-soft);line-height:1.5}
.lg-guest{display:inline;padding:0;margin:0;font:inherit;font-weight:700;color:var(--accent);background:none;border:0;border-bottom:1px dashed var(--accent);cursor:pointer}
.lg-guest b{font-weight:800;letter-spacing:.06em}
.lg-guest:hover{filter:brightness(.85)}
.lg-guest:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* chip đổi người dùng, nằm cạnh dòng "Made by" */
.lg-chip{font:inherit;font-size:inherit;color:var(--ink-soft);background:none;border:0;border-bottom:1px dotted var(--ink-faint);padding:0 1px;margin-right:12px;cursor:pointer}
.lg-chip:hover{color:var(--accent-dark);border-bottom-color:var(--accent)}
@media (max-width:480px){.lg-card{padding:34px 22px 26px}.lg-brand h1{font-size:calc(24px*var(--fs,1))}.lg-greet{font-size:calc(26px*var(--fs,1))}}
@media (prefers-reduced-motion:reduce){.lg-seal.stamp,.lg-greet,.lg-sub,.lg-hello .lg-go,.lg-in.shake{animation:none}.lg{transition:none}}
/* ---- Giao diện riêng từng người (ví dụ, bỏ comment để dùng) ----
html[data-user="airi"][data-theme]{ --accent:#C2547A; }
html[data-user="ryosuke"][data-theme]{ --accent:#2E7FA6; }
*/

/* ---- con dấu mờ góc phải màn hình (đối xứng huy hiệu hoa ở góc trái) ---- */
:root{--lg-corner-o:.42;--lg-corner-size:84px}
.lg-corner{position:fixed;top:12px;right:20px;width:var(--lg-corner-size);height:var(--lg-corner-size);z-index:1;pointer-events:none;opacity:0;transform:rotate(-6deg);transition:opacity 1s ease .25s;mix-blend-mode:multiply}
.lg-corner.has,.lg-corner.noimg{opacity:var(--lg-corner-o)}
.lg-corner img{position:absolute;left:50%;top:50%;width:195%;max-width:none;height:auto;transform:translate(-50%,-50%);filter:brightness(1.07) contrast(1.1);-webkit-mask-image:radial-gradient(circle closest-side,#000 60%,transparent 72%);mask-image:radial-gradient(circle closest-side,#000 60%,transparent 72%)}
.lg-corner span{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:calc(40px*var(--fs,1));font-weight:800;color:var(--accent);border:4px solid var(--accent);border-radius:4px}
.lg-corner.noimg img{display:none}.lg-corner.noimg span{display:flex}
:root[data-theme="dark"]{--lg-corner-o:.55}
:root[data-theme="dark"] .lg-corner{mix-blend-mode:screen}
:root[data-theme="dark"] .lg-corner img{filter:invert(1) hue-rotate(180deg) brightness(1.1) contrast(1.15)}
@media (max-width:900px){.lg-corner{display:none}}
@media print{.lg-corner{display:none}}

/* =====================================================================
   地図 · BẢN ĐỒ HÀNH TRÌNH trong game 朱印帖
   ===================================================================== */
.kg-mp-head{border:1px solid var(--edge);background:var(--bg-card);padding:16px 18px;box-shadow:4px 4px 0 var(--border);margin:0 0 16px}
.kg-mp-head h2{margin:0 0 4px;font-size:calc(22px*var(--fs,1));font-weight:800;letter-spacing:.05em;line-height:1.3}
.kg-mp-head p{margin:0;color:var(--ink-soft);font-size:calc(14px*var(--fs,1));line-height:1.65}
.kg-mp-prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:calc(14px*var(--fs,1))}
.kg-mp-prog span{font-weight:800;letter-spacing:.08em}
.kg-mp-prog i{flex:1;height:10px;border:1px solid var(--edge);background:var(--bg)}
.kg-mp-prog s{display:block;height:100%;background:var(--accent);text-decoration:none;transition:width .5s}
.kg-note{border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft);padding:10px 14px;margin:0 0 14px;font-weight:800;font-size:calc(14px*var(--fs,1))}
.kg-map{position:relative;border:1px solid var(--edge);background-color:var(--bg-card);box-shadow:5px 5px 0 var(--border);overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--border) 60%,transparent) 27px 28px),repeating-linear-gradient(90deg,transparent 0 27px,color-mix(in srgb,var(--border) 60%,transparent) 27px 28px)}
.kg-map::before{content:"北";position:absolute;top:10px;right:12px;z-index:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink-faint);border-radius:50%;color:var(--ink-faint);font-size:calc(16px*var(--fs,1));font-weight:800}
.kg-mp-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kg-mp-path path{fill:none;stroke:var(--ink-faint);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;vector-effect:non-scaling-stroke}
.kg-mp-path path.on{stroke:var(--accent);stroke-width:4;stroke-dasharray:none}
.kg-mp-n{position:absolute;left:0;width:100%;transform:translateY(-50%);display:flex;align-items:center;gap:14px;padding:0 0 0 calc(24% - 38px);margin:0;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.kg-mp-n.r{flex-direction:row-reverse;padding:0 calc(24% - 38px) 0 0;text-align:right}
.kg-mp-med{position:relative;flex:none;width:76px;height:76px;border-radius:50%;background:var(--bg);border:4px solid var(--c);box-shadow:3px 3px 0 var(--edge);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.kg-mp-med b{font-size:calc(36px*var(--fs,1));line-height:1;font-weight:800;color:var(--c)}
.kg-mp-n.kl2 .kg-mp-med b{font-size:calc(27px*var(--fs,1));white-space:nowrap;letter-spacing:-.04em}
.kg-mk.k2 b{font-size:calc(32px*var(--fs,1));white-space:nowrap;letter-spacing:-.04em}
.kg-mp-n:hover .kg-mp-med{transform:translate(-1px,-1px) scale(1.06)}
.kg-mp-ok,.kg-mp-lk{position:absolute;right:-12px;top:-10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(16px*var(--fs,1));font-weight:800;border-radius:3px;transform:rotate(8deg)}
.kg-mp-ok{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3px rgba(255,255,255,.75)}
.kg-mp-lk{background:var(--ink);color:var(--bg);font-size:calc(14px*var(--fs,1))}
.kg-mp-n.r .kg-mp-ok,.kg-mp-n.r .kg-mp-lk{right:auto;left:-12px;transform:rotate(-8deg)}
.kg-mp-lab{min-width:0;flex:0 1 auto;max-width:min(310px,58%);background:var(--bg-card);border:1px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:9px 12px 10px;line-height:1.35}
.kg-mp-lab small{display:inline-block;background:var(--c);color:var(--cf,#fff);padding:1px 9px;font-size:calc(12px*var(--fs,1));font-weight:800;letter-spacing:.08em}
.kg-mp-n.sp{--cf:var(--bg)}
.kg-mp-lab strong{display:block;margin-top:6px;font-size:calc(22px*var(--fs,1));font-weight:800;letter-spacing:.04em;line-height:1.2}
.kg-mp-lab em{display:block;font-style:normal;font-size:calc(14.5px*var(--fs,1));font-weight:700;color:var(--accent);margin-top:2px}
.kg-mp-pl{display:block;margin-top:3px;font-size:calc(12.5px*var(--fs,1));color:var(--ink-soft)}
.kg-mp-pl::before{content:"◎ ";color:var(--ink-faint)}
.kg-mp-pg{display:block;margin-top:5px;font-size:calc(12px*var(--fs,1));font-weight:700;color:var(--ink-soft)}
.kg-here{display:block;margin-top:5px;font-size:calc(12px*var(--fs,1));font-weight:800;color:var(--accent);letter-spacing:.05em}
.kg-mp-n.lock .kg-mp-med{border-style:dashed;filter:grayscale(1);opacity:.75}
.kg-mp-n.lock .kg-mp-lab{border-style:dashed;box-shadow:none;opacity:.7}
.kg-mp-n.cur .kg-mp-med{animation:kgpulse 1.8s ease-out infinite}
.kg-mp-n.cur .kg-mp-lab{box-shadow:3px 3px 0 var(--c)}
@keyframes kgpulse{0%{box-shadow:3px 3px 0 var(--edge),0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:3px 3px 0 var(--edge),0 0 0 20px transparent}}
/* chương truyện */
.kg-back{width:auto;display:inline-block;margin:0 0 14px;padding:8px 16px}
.kg-ch{border:1px solid var(--edge);border-top:6px solid var(--c,var(--edge));background:var(--bg-card);padding:20px 18px 22px;box-shadow:5px 5px 0 var(--border)}
.kg-ch-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.kg-mk{flex:none;width:88px;height:88px;border-radius:50%;border:4px solid var(--c);background:var(--bg);box-shadow:3px 3px 0 var(--edge);display:flex;align-items:center;justify-content:center}
.kg-mk b{font-size:calc(44px*var(--fs,1));line-height:1;font-weight:800;color:var(--c)}
.kg-ch-head small{display:block;color:var(--ink-soft);font-weight:800;letter-spacing:.1em;font-size:calc(13px*var(--fs,1))}
.kg-ch-head h2{margin:2px 0 0;font-size:calc(30px*var(--fs,1));font-weight:800;letter-spacing:.05em;line-height:1.2;text-align:left}
.kg-ch-ti{margin:4px 0 0;font-size:calc(16px*var(--fs,1));line-height:1.5;color:var(--accent);font-weight:700}
.kg-story{border-left:4px solid var(--kg-gold);padding:2px 0 2px 16px;margin:14px 0;font-size:calc(16.5px*var(--fs,1));line-height:1.9}
.kg-story p{margin:0 0 .9em}.kg-story p:last-child{margin-bottom:0}
.kg-story2{border-left-color:var(--accent)}
.kg-story blockquote{margin:0 0 .9em;padding:10px 14px;background:var(--bg-subtle);border:1px solid var(--border);font-size:calc(16px*var(--fs,1));line-height:1.85}
.kg-pact{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--accent);background:var(--accent-soft);padding:12px 14px;margin:14px 0}
.kg-pact b{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:calc(22px*var(--fs,1));border-radius:3px;transform:rotate(-5deg)}
.kg-pact span{font-weight:700;line-height:1.65;font-size:calc(16px*var(--fs,1))}
.kg-tease{margin:14px 0;padding:10px 14px;border:1px dashed var(--ink-faint);color:var(--ink-soft);font-size:calc(15px*var(--fs,1))}
.kg-qh{margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--edge)}
.kg-duel{display:flex;gap:14px;align-items:center;border:2px solid var(--edge);background:var(--bg);box-shadow:4px 4px 0 var(--accent);padding:14px 16px}
.kg-duel>div{flex:1;min-width:0}
.kg-duel b{display:block;font-size:calc(19px*var(--fs,1));font-weight:800}
.kg-duel span{display:block;margin:4px 0;color:var(--ink-soft);font-size:calc(14px*var(--fs,1));line-height:1.6}
.kg-duel small{color:var(--ink-faint);font-size:calc(12px*var(--fs,1));font-weight:700}
.kg-duel .kg-btn{width:auto;margin:0;flex:none;padding:14px 22px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:calc(17px*var(--fs,1))}
@media (max-width:520px){.kg-duel{flex-direction:column;align-items:stretch}.kg-duel .kg-btn{width:100%}.kg-ch-head h2{font-size:calc(26px*var(--fs,1))}.kg-mk{width:72px;height:72px}.kg-mk b{font-size:calc(36px*var(--fs,1))}}
.kg-sealrow{display:flex;align-items:center;gap:14px;margin:8px 0}
.kg-sealrow .kg-sealbox{width:84px;height:84px;margin:0}
.kg-sealrow b{font-size:calc(17px*var(--fs,1))}.kg-sealrow small{display:block;color:var(--ink-soft);font-size:calc(13px*var(--fs,1))}
.kg-pacts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 18px}
.kg-pact-i{text-align:center;font-size:calc(12px*var(--fs,1))}
.kg-pact-i .kg-sealbox,.kg-pact-i .kg-sealbox.got{width:100%;height:auto;aspect-ratio:1;margin:0 0 4px}
.kg-pact-i b{display:block}
.kg-win .kg-btn,.kg-lose .kg-btn{margin-top:12px}
@media (prefers-reduced-motion:reduce){.kg-mp-n.cur .kg-mp-med{animation:none}}

/* =====================================================================
   GAME v3 — 2 chế độ (Thu thập · Thách đấu Boss có đồng hồ)
   ===================================================================== */
.kg-nav button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;padding:8px 2px}
.kg-nav button b{font-size:calc(16px*var(--fs,1));letter-spacing:.06em}
.kg-nav button small{font-size:calc(11.5px*var(--fs,1));font-weight:600;opacity:.85}
.kg-lvbar:empty{display:none}
.kg-steps{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kg-steps li{border:1px solid var(--edge);background:var(--bg);padding:10px 12px}
.kg-steps li b{display:block;font-size:calc(13px*var(--fs,1));letter-spacing:.06em;color:var(--ink-soft)}
.kg-steps li span{display:block;margin-top:3px;font-size:calc(15.5px*var(--fs,1));font-weight:800;color:var(--accent);line-height:1.35}
.kg-steps li small{display:block;margin-top:4px;font-size:calc(12.5px*var(--fs,1));line-height:1.55;color:var(--ink-soft)}
@media (max-width:620px){.kg-steps{grid-template-columns:1fr}}
.kg-sx{display:grid;grid-template-columns:76px 1fr;gap:8px 14px;align-items:center;border:1px solid var(--edge);background:var(--bg);box-shadow:3px 3px 0 var(--border);padding:12px 14px;margin:0 0 14px}
.kg-sx.got{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.kg-sx-seal{width:76px;height:76px}.kg-sx-seal .kg-sealbox{width:76px;height:76px;margin:0}
.kg-sx-main b{display:block;font-size:calc(18px*var(--fs,1));font-weight:800;line-height:1.3}
.kg-sx-bar{height:8px;border:1px solid var(--edge);background:var(--bg-card);margin:7px 0 5px}
.kg-sx-bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .4s}
.kg-sx-main small{font-size:calc(13px*var(--fs,1));font-weight:700;color:var(--ink-soft)}
.kg-sx-act{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap}
.kg-sx-act .kg-btn{flex:1 1 150px;width:auto;margin:0;padding:11px 12px;font-size:calc(15px*var(--fs,1))}
.kg-sx-act .kg-btn:not(.ghost){background:var(--accent);border-color:var(--accent);color:#fff}
.kg-sx-act .kg-btn:disabled{background:transparent;border:1px dashed var(--ink-faint);color:var(--ink-faint)}
.kg-sx-hint{grid-column:1 / -1;font-size:calc(12.5px*var(--fs,1));color:var(--ink-faint);margin-top:-2px}
/* Boss: đồng hồ */
.kg-bh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 8px}
.kg-bn{font-size:calc(18px*var(--fs,1));font-weight:800}
.kg-tmw b{display:block;font-size:calc(34px*var(--fs,1));line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:5px 14px;border:2px solid var(--edge);background:var(--bg-card)}
.kg-tmw.low b{color:#fff;background:var(--accent);border-color:var(--accent);animation:kgblink 1s steps(2) infinite}
@keyframes kgblink{50%{opacity:.72}}
.kg-tbar{height:10px;border:1px solid var(--edge);background:var(--bg-card);margin-bottom:8px}
.kg-tbar i{display:block;height:100%;background:var(--kg-ok);transition:width .25s linear}
.kg-bs{font-size:calc(14px*var(--fs,1));color:var(--ink-soft);margin-bottom:10px}
/* Thu thập: điền vào chỗ trống */
.kg-cz{font-size:calc(28px*var(--fs,1));line-height:1.7}
.kg-blank{display:inline-block;min-width:3.4em;height:1em;margin:0 .2em;border-bottom:3px solid var(--accent);vertical-align:baseline}
.kg-cz mark{background:var(--accent-soft);color:var(--accent);padding:0 .15em;font-weight:800}
.kg-wl{list-style:none;margin:14px 0;padding:0;text-align:left}
.kg-wl li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--border);font-size:calc(15px*var(--fs,1))}
.kg-wl .y{color:var(--kg-ok);font-weight:800}.kg-wl .n{color:var(--accent);font-weight:800}
.kg-wl b{font-size:calc(18px*var(--fs,1))}
/* Sổ ấn */
.kg-lh{display:flex;align-items:center;gap:10px;margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--edge);font-size:calc(17px*var(--fs,1))}
.kg-lh span{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:3px solid var(--c);border-radius:50%;color:var(--c);font-size:calc(17px*var(--fs,1));font-weight:800;line-height:1;white-space:nowrap;overflow:hidden}
.kg-lh small{margin-left:auto;font-size:calc(13px*var(--fs,1));color:var(--ink-soft);font-weight:700}
@media (prefers-reduced-motion:reduce){.kg-tmw.low b{animation:none}}
.kg-ghost span{white-space:nowrap}
.kg-pact-i .kg-ghost span{font-size:calc(30px*var(--fs,1));letter-spacing:-.06em}
.kg-sx-seal .kg-ghost span{font-size:calc(34px*var(--fs,1));letter-spacing:-.06em}
.kg-tbx{border:2px solid var(--accent);background:var(--bg);padding:10px 14px;margin:10px 0;text-align:center;line-height:1.7;border-radius:3px}.kg-tbx strong{color:var(--accent)}

/* ===== 地図 v5: bản đồ đảo nổi, tất cả điểm nằm trên ảnh map.jpg ===== */
.kg-map.kg-route{aspect-ratio:736/1274;height:auto;background-color:#2a1d12;background-image:url(img/ui/map.jpg);background-size:100% 100%;background-repeat:no-repeat;border:2px solid var(--edge);box-shadow:6px 6px 0 var(--border)}
.kg-map.kg-route::before{display:none}
.kg-map.kg-route::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:rgba(14,11,8,0)}
:root[data-theme="dark"] .kg-map.kg-route::after{background:rgba(14,11,8,.34)}
.kg-route .kg-mp-path{z-index:1}
.kg-route .kg-mp-path path{stroke:#2b1d10;stroke-width:4;stroke-dasharray:1 10;stroke-linecap:round;opacity:.9}
.kg-route .kg-mp-path path.cs{stroke:rgba(251,246,233,.9);stroke-width:12;stroke-dasharray:none;opacity:1}
:root[data-theme="dark"] .kg-route .kg-mp-path path{stroke:#F0E7D4}
:root[data-theme="dark"] .kg-route .kg-mp-path path.cs{stroke:rgba(10,8,6,.65)}
.kg-route .kg-mp-path path.on{stroke:var(--accent);stroke-width:5;stroke-dasharray:none;opacity:1}
.kg-route .kg-mp-path path.ch{stroke:#C25A34;stroke-width:4;stroke-dasharray:2 7;opacity:1}
.kg-pt{position:absolute;z-index:3;width:60px;height:60px;transform:translate(-50%,-50%);padding:0;margin:0;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.kg-pt .kg-mp-med{display:flex;width:60px;height:60px;border-width:3px}
.kg-pt .kg-mp-med b{font-size:calc(28px*var(--fs,1))}
.kg-pt.kl2 .kg-mp-med b{font-size:calc(21px*var(--fs,1));white-space:nowrap;letter-spacing:-.04em}
.kg-pt:hover .kg-mp-med{transform:translate(-1px,-1px) scale(1.1)}
.kg-pt .kg-mp-lab{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:max-content;max-width:clamp(84px,24vw,170px);box-sizing:border-box;padding:5px 9px 6px;text-align:center;line-height:1.3}
.kg-pt .kg-mp-lab small{font-size:calc(11px*var(--fs,1));padding:1px 7px}
.kg-pt .kg-mp-lab strong{font-size:calc(16px*var(--fs,1));margin-top:4px}
.kg-pt .kg-mp-pl,.kg-pt .kg-mp-lab em{display:none}
.kg-pt .kg-mp-pg{font-size:calc(11px*var(--fs,1));margin-top:3px}
.kg-pt.ch .kg-mp-med{width:54px;height:54px;border-radius:6px;transform:rotate(45deg)}
.kg-pt.ch .kg-mp-med b{transform:rotate(-45deg);font-size:calc(19px*var(--fs,1));white-space:nowrap;letter-spacing:-.06em}
.kg-pt.ch:hover .kg-mp-med{transform:rotate(45deg) translate(-1px,-1px) scale(1.1)}
.kg-pt.ch{width:54px;height:54px}
.kg-pt.ch .kg-mp-lab{top:calc(100% + 12px);border-color:var(--c);box-shadow:3px 3px 0 var(--c)}
.kg-pt.ch .kg-mp-ok,.kg-pt.ch .kg-mp-lk{transform:rotate(-37deg)}
.kg-pt.sp{--cf:var(--bg)}
.kg-pt.lock .kg-mp-med{border-style:dashed;filter:grayscale(1);opacity:.8}
.kg-pt.lock .kg-mp-lab{border-style:dashed;box-shadow:none;opacity:.78}
.kg-pt.cur .kg-mp-med{animation:kgpulse 1.8s ease-out infinite}
.kg-pt.cur .kg-mp-lab{box-shadow:3px 3px 0 var(--c)}
.kg-rt-leg{position:absolute;left:50%;top:86.5%;transform:translateX(-50%);z-index:2;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:84%;padding:5px 12px;background:var(--bg-card);border:1px solid var(--edge);box-shadow:2px 2px 0 var(--edge);font-size:calc(12px*var(--fs,1));font-weight:800}
.kg-rt-leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.kg-rt-leg i{display:inline-block;width:18px;height:0;border-top:4px solid var(--accent)}
.kg-rt-leg i.b{width:12px;height:12px;border:2px solid #C25A34;border-radius:50%;box-shadow:0 0 0 2px #E8DFCF,0 0 0 4px #C25A34;margin:0 4px}
@media (prefers-reduced-motion:reduce){.kg-pt.cur .kg-mp-med{animation:none}}
/* ===== quái thú: huy hiệu tròn trên bản đồ + khung tranh ===== */
.kg-pt .kg-mp-med{position:relative;border-radius:50%;background:var(--cf,var(--bg-card))}
.kg-mp-phw{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1;display:block}
.kg-pt .kg-mp-med .kg-mp-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kg-pt .kg-mp-ok,.kg-pt .kg-mp-lk{z-index:3}
.kg-pt .kg-mp-med:has(.kg-mp-ph) b{opacity:0}

<script>
/* KHỞI ĐỘNG: quét giờ máy một lần. 18:00 → 06:00 = tối (涼介 dark), còn lại = sáng (涼介 light).
   Sau đó không quét lại: người dùng bấm đổi giao diện thì giữ nguyên lựa chọn đó đến khi tải lại trang. */
(function(){var r=document.documentElement,d=new Date(),m=d.getHours()*60+d.getMinutes(),t=(m>=18*60||m<=6*60)?'dark':'light';r.setAttribute('data-theme',t);})();

<script>
(function(){
/* =====================================================================
   ĐĂNG NHẬP TỰ ĐỘNG THEO THƯ MỤC story/
   ---------------------------------------------------------------------
   Thêm người mới chỉ cần 1 việc:  bỏ file  story/<Tên>.js  vào thư mục story/
     → gõ <Tên> ở ô đăng nhập là vào được ngay (không cần sửa index.html).
   Ảnh con dấu (tuỳ chọn):  img/ui/<Tên>.jpg   (thiếu thì hiện chữ cái đầu)
   File bắt đầu bằng dấu _ (ví dụ _template.js) bị bỏ qua, không đăng nhập được.
   Trong file story có thể thêm: "greet" (lời chào, dùng {name}), "sub" (lời nhắn),
   "img" (tên file ảnh khác), "share" (dùng chung truyện của một người khác).
   Cách hoạt động: trình duyệt không được phép liệt kê thư mục, nên web thử nạp
   story/<tên đã gõ>.js (thử cả dạng Hoa/thường/IN HOA). Nếu server có bật
   liệt kê thư mục thì web còn tự đọc danh sách để khớp chính xác hơn.
   ===================================================================== */
var USERS = {};   /* tự điền khi đăng nhập thành công: { Tên: {greet,sub,img,story} } */
var DEFAULT_GREET = 'Sa-wa-đi-khạp, {name}';   /* lời chào cố định cho mọi tài khoản; {name} = tên đăng nhập (= tên file trong story/) */
var DEFAULT_SUB   = 'ようこそ。今日も一緒に頑張ろう！';

var IMG_DIR = 'img/ui/';   // thư mục chứa ảnh con dấu
var IMG_EXT = '.jpg';      // đuôi ảnh: img/ui/<Tên>.jpg
var STORY_DIR = 'story/';  // thư mục chứa cốt truyện  story/<Tên>.js
/* tài khoản cố định (không cần file story mới đăng nhập được; có story/Client.js thì dùng làm cốt truyện) */
var FIXED = {client:{key:'Client',img:'client.jpg'}};
var BLOCKED = {template:1,_template:1};   /* file mẫu: không phải tài khoản */
var REMEMBER_LOGIN = false; // true = nhớ tên trên máy này, lần sau vào thẳng không hỏi lại
var AUTO_ENTER_MS = 3800;   // tự vào web sau lời chào (0 = chỉ vào khi bấm nút)
/* ===================== hết phần cấu hình ===================== */

var $=function(id){return document.getElementById(id)};
var root=document.documentElement, gate=$('loginGate'), seal=$('lgSeal'), img=$('lgImg');
var STORE='fusou_user', cur=null, timer=0, KNOWN=null;
function norm(s){return String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase()}
window.FUSOU_STORY=window.FUSOU_STORY||{};
/* ---- tìm tên trong thư mục story/ ---- */
function regKey(t){var R=window.FUSOU_STORY,n=norm(t);for(var k in R){if(k.charAt(0)!=='_'&&norm(k)===n)return k}return null}
function loadStoryFile(name,done){
  /* Tài khoản = TÊN FILE (story/<name>.js). Khóa bên trong file (vd. file hana.js nhưng bên trong vẫn ghi Airi)
     chỉ là dữ liệu: gán lại về đúng tên file và trả khóa cũ về nguyên trạng, nên không bao giờ bị nhầm người. */
  var R=window.FUSOU_STORY,snap={},k,sc=document.createElement('script');
  for(k in R)snap[k]=R[k];
  sc.charset='utf-8'; sc.async=true;
  sc.onload=function(){
    sc.remove();
    var nk=null; for(k in R){if(R[k]!==snap[k]){nk=k;break}}
    if(nk===null){done(null);return}
    if(nk!==name){var v=R[nk]; if(Object.prototype.hasOwnProperty.call(snap,nk))R[nk]=snap[nk]; else delete R[nk]; R[name]=v}
    done(name);
  };
  sc.onerror=function(){sc.remove();done(null)};
  sc.src=STORY_DIR+encodeURIComponent(name)+'.js';
  document.head.appendChild(sc);
}
function resolveUser(t,cb){
  t=String(t||'').trim().replace(/\s+/g,'');
  if(!t||/^_|[\/\\.:?#%]/.test(t)||BLOCKED[norm(t)]){cb(null);return}
  var fx=FIXED[norm(t)];
  if(fx){ if(regKey(fx.key)){cb(fx.key);return} loadStoryFile(fx.key,function(){cb(fx.key)}); return }   /* Client: vào được kể cả chưa có file story */
  var k=regKey(t); if(k){cb(k);return}
  var c=[],add=function(v){if(v&&c.indexOf(v)<0)c.push(v)};
  if(KNOWN&&KNOWN[norm(t)])add(KNOWN[norm(t)]);
  add(t); add(t.charAt(0).toUpperCase()+t.slice(1)); add(t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()); add(t.toLowerCase()); add(t.toUpperCase());
  (function next(i){
    if(i>=c.length){cb(null);return}
    loadStoryFile(c[i],function(key){ if(key&&key.charAt(0)!=='_')cb(key); else next(i+1) });
  })(0);
}
/* nếu server cho phép liệt kê thư mục thì đọc sẵn danh sách (không bắt buộc) */
function scanFolder(){
  try{fetch(STORY_DIR,{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(tx){
    var re=/href="([^"?#\/]+)\.js"/gi,m,K={},n=0;
    while((m=re.exec(tx))){var f=decodeURIComponent(m[1]);if(f.charAt(0)==='_'||BLOCKED[norm(f)])continue;K[norm(f)]=f;n++}
    if(n)KNOWN=K;
  }).catch(function(){})}catch(e){}
}
/* tên hiển thị: viết hoa chữ đầu (hana → Hana); có thể ghi đè bằng "name" trong file story */
function capName(k){k=String(k||'');return k.charAt(0).toUpperCase()+k.slice(1)}
function dn(k){return(USERS[k]&&USERS[k].disp)||capName(k)}
function fill(t,n){return String(t).replace(/\{name\}/g,n)}
function lock(on){
  root.classList.toggle('lg-open',on);
  Array.prototype.forEach.call(document.body.children,function(el){
    if(el===gate||el.id==='lgsw'||el.tagName==='SCRIPT')return;
    if(on)el.setAttribute('inert','');else el.removeAttribute('inert');
  });
}
function imgSrc(key){var u=USERS[key]||{};return IMG_DIR+encodeURI(u.img||key+IMG_EXT)}
function announce(ev){try{document.dispatchEvent(new CustomEvent(ev,{detail:window.FUSOU_USER}))}catch(e){}}
function loadStory(sk){
  window.FUSOU_STORY=window.FUSOU_STORY||{};
  if(window.FUSOU_STORY[sk]){announce('fusou:story');return}
  loadStoryFile(sk,function(){announce('fusou:story')});   // thiếu file truyện -> game dùng giao diện không cốt truyện
}
/* con dấu mờ ở góc phải, đối xứng với huy hiệu hoa bên trái */
function mountCorner(){
  function run(){
    if(!cur)return;
    var c=$('lgCorner');
    if(!c){c=document.createElement('div');c.id='lgCorner';c.setAttribute('aria-hidden','true');c.innerHTML='<img alt=""><span></span>';document.body.appendChild(c)}
    c.className='lg-corner'; c.lastChild.textContent=dn(cur).charAt(0).toUpperCase(); c.title=dn(cur);
    var im=c.firstChild; im.onload=function(){c.classList.add('has')}; im.onerror=function(){c.classList.add('noimg')};
    im.src=imgSrc(cur);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
}
function resetSeal(){
  seal.className='lg-seal'; img.removeAttribute('src'); img.onload=img.onerror=null;
}
function showSeal(key){
  var u=USERS[key]; resetSeal();
  $('lgIni').textContent=dn(key).charAt(0).toUpperCase();
  img.onload=function(){seal.classList.add('has')};
  img.onerror=function(){seal.classList.add('noimg')};   // chưa có ảnh -> con dấu chữ cái thay thế
  img.src=imgSrc(key);
  seal.classList.remove('stamp'); void seal.offsetWidth; seal.classList.add('stamp');
}
function apply(key){
  var st=window.FUSOU_STORY[key]||{};
  var fx=FIXED[norm(key)];
  USERS[key]={sub:st.sub,img:st.img||(fx&&fx.img)||null,story:st.share||key,disp:capName(key)};
  cur=key; root.setAttribute('data-user',norm(key));
  window.FUSOU_USER={name:USERS[key].disp,key:key,id:norm(key),story:USERS[key].story};
  announce('fusou:login');
  if(REMEMBER_LOGIN){try{localStorage.setItem(STORE,key)}catch(e){}}
  loadStory(window.FUSOU_USER.story);
  mountChip(); mountCorner();
}
function enter(){
  clearTimeout(timer); timer=0;
  gate.classList.add('out'); lock(false);
  setTimeout(function(){gate.hidden=true},450);
}
function hello(key){
  var u=USERS[key];
  $('lgGreet').textContent=fill(DEFAULT_GREET,dn(key));
  $('lgSub').textContent=fill(u.sub||DEFAULT_SUB,dn(key));
  gate.setAttribute('data-stage','hello');
  showSeal(key);
  setTimeout(function(){$('lgStart').focus({preventScroll:true})},300);
  if(AUTO_ENTER_MS>0)timer=setTimeout(enter,AUTO_ENTER_MS);
}
function openGate(){
  cur=null; root.removeAttribute('data-user'); window.FUSOU_USER=null; announce('fusou:logout');
  var cn=$('lgCorner'); if(cn)cn.remove();
  try{localStorage.removeItem(STORE)}catch(e){}
  clearTimeout(timer); resetSeal();
  gate.hidden=false; gate.classList.remove('out'); gate.setAttribute('data-stage','form');
  $('lgName').value=''; $('lgErr').textContent=''; lock(true);
  setTimeout(function(){$('lgName').focus({preventScroll:true})},60);
}
var busy=false;
$('lgForm').addEventListener('submit',function(e){
  e.preventDefault(); if(busy)return;
  var t=$('lgName').value.trim(), go=gate.querySelector('.lg-go');
  function fail(){
    $('lgErr').textContent='Chưa có tên này trong danh sách. Nhập đúng tên admin đã cấp nhé.';
    var i=$('lgName'); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.select();
  }
  if(!t){fail();return}
  busy=true; $('lgErr').textContent=''; if(go)go.disabled=true;
  resolveUser(t,function(key){
    busy=false; if(go)go.disabled=false;
    if(!key){fail();return}
    $('lgErr').textContent=''; apply(key); hello(key);
  });
});
$('lgGuest').addEventListener('click',function(){var i=$('lgName');i.value='Client';$('lgErr').textContent='';$('lgForm').requestSubmit?$('lgForm').requestSubmit():$('lgForm').dispatchEvent(new Event('submit',{cancelable:true}))});
$('lgName').addEventListener('input',function(){$('lgErr').textContent=''});
$('lgStart').addEventListener('click',enter);
gate.addEventListener('click',function(e){ if(gate.getAttribute('data-stage')==='hello'&&!e.target.closest('#lgStart'))enter() });

/* chip "tên · đổi" cạnh dòng Made by */
function mountChip(){
  function run(){
    var c=document.querySelector('.credit'); if(!c)return;
    var b=$('lgChip');
    if(!b){ b=document.createElement('button'); b.type='button'; b.id='lgChip'; b.className='lg-chip'; b.title='Đổi người dùng'; b.addEventListener('click',openGate); c.insertBefore(b,c.firstChild); }
    b.textContent=cur?dn(cur)+' · 変更':'';
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
}

/* khởi động */
function startForm(){
  lock(true);
  document.addEventListener('DOMContentLoaded',function(){ if(!gate.hidden&&root.classList.contains('lg-open'))lock(true); });
  setTimeout(function(){$('lgName').focus({preventScroll:true})},60);
}
var saved=null; if(REMEMBER_LOGIN){try{saved=localStorage.getItem(STORE)}catch(e){}}
scanFolder();
if(saved){ resolveUser(saved,function(k){ if(k){apply(k);gate.hidden=true}else startForm() }); }
else startForm();
})();
</script>

<script id="topics-loader" charset="utf-8">
/* ===== Nạp dữ liệu chủ đề: thay cho <script src="data/speaking_data.js"> =====
   Mỗi chủ đề nằm trong data/<tên>.js, nội dung dạng:  window.__TOPIC_JS["<tên>"] = { ...chủ đề... };
   Nạp bằng thẻ <script> nên chạy được cả khi nhấp đúp (file://) lẫn trên GitHub Pages / hosting.
   Các file được nạp ĐỒNG BỘ, rồi ghép thành biến toàn cục TOPICS ngay tại vị trí này
   -> mọi script phía sau vẫn dùng TOPICS y như trước, không đổi logic / thứ tự khởi động.
   * Thứ tự hiển thị do số đầu của id quyết định (xem bên dưới), không phụ thuộc thứ tự trong TOPIC_FILES.
   * Thêm chủ đề mới: thêm file data/<tên>.js rồi thêm <tên> (không có .js) vào TOPIC_FILES. */
var TOPIC_DIR = 'data';
var TOPIC_FILES = [
  'お金・金融・行政手続',

  '数え方',
  '料理・グルメ',

  '法律・ルール',
  '漢文・古い漢字',

  '自動詞・他動詞',
  '買い物・消費',
  '防災・安全・トラブル',
  '類義語の使い分け'
];
window.__TOPIC_JS = window.__TOPIC_JS || {};
TOPIC_FILES.forEach(function(n){ document.write('<script src="' + TOPIC_DIR + '/' + encodeURIComponent(n) + '.js" charset="utf-8"><\/script>'); });
</script>
<script id="topics-assemble" charset="utf-8">
var TOPICS = (function(){
  var out = [], failed = [], odd = [], M = window.__TOPIC_JS;
  function norm(d){
    if(d && !Array.isArray(d) && Array.isArray(d.topics)) d = d.topics;
    return Array.isArray(d) ? d : [d];
  }
  TOPIC_FILES.forEach(function(name){
    var f = [name, name.normalize('NFC'), name.normalize('NFD')], r = null, i;   /* tên Nhật có thể lưu dạng NFC hoặc NFD */
    for(i = 0; i < f.length && !r; i++) if(M[f[i]]) r = norm(M[f[i]]);
    if(!r){ failed.push(name); return; }
    r.forEach(function(t){
      if(!t) return;
      if(!t.id || !(t.vocab || t.grammar || t.compare)) odd.push(name);
      out.push(t);
    });
  });
  console.info('[topics] Đã nạp ' + out.length + ' chủ đề từ ' + (TOPIC_FILES.length - failed.length) + '/' + TOPIC_FILES.length + ' file');
  if(odd.length) console.warn('[topics] Cấu trúc lạ (thiếu id/vocab/grammar/compare) ở:', odd.filter(function(v, i, a){ return a.indexOf(v) === i; }).join(', '));
  if(failed.length){
    console.warn('[topics] Thiếu ' + failed.length + ' file chủ đề:', failed.join(', '));
    try{
      document.body.insertAdjacentHTML('afterbegin', '<div data-no-i18n style="position:fixed;z-index:99999;left:8px;right:8px;top:8px;padding:10px 14px;background:#fff3f0;border:1px solid #c0392b;color:#7a1f14;font:13px/1.5 sans-serif;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)"><b>Không nạp được ' + failed.length + '/' + TOPIC_FILES.length + ' file chủ đề trong "' + TOPIC_DIR + '/"</b><br>Thiếu: ' + failed.slice(0, 3).join(', ').replace(/</g, '&lt;') + (failed.length > 3 ? '…' : '') + '<br><small>Cần file <b>' + TOPIC_DIR + '/&lt;tên&gt;.js</b> cho mỗi chủ đề (chạy <b>json_to_js.py</b> để sinh từ .json), và tên phải khớp từng ký tự với TOPIC_FILES. Chi tiết ở Console (F12).</small></div>');
    }catch(e){}
  }
  /* Thứ tự gốc = số đứng đầu id ("13.xxx" -> 13). Chủ đề không có số (ví dụ コンビニ) xếp sau, giữ thứ tự TOPIC_FILES.
     Nhóm chính và nhóm tham khảo (副詞, 四字熟語…) được lọc riêng theo category nên mỗi nhóm tự đúng thứ tự của nó. */
  var num = function(t){ var m = /^(\d+)\./.exec(String(t.id || '')); return m ? parseInt(m[1], 10) : Infinity; };
  out = out.map(function(t, i){ return {t: t, i: i, n: num(t)}; })
           .sort(function(x, y){ return x.n === y.n ? x.i - y.i : (x.n < y.n ? -1 : 1); })
           .map(function(o){ return o.t; });
  return out;
})();
</script>

<script>

];

const FREQ_CATS = [
  { key: 'f0', tag: 'フロー', name: '状況別シナリオ', color: '#3F8F5F' },
  { key: 'f1', tag: 'よく使う', name: '毎回の勤務で使う', color: '#C96442' },
  { key: 'f2', tag: '頻出', name: '仕事・手順', color: '#2E7FA6' },
  { key: 'f3', tag: 'たまに', name: '場面・手続き', color: '#8B5CB8' }
];
FREQ_CATS.forEach(l => LEVEL_MAP[l.key] = l);
const PROVERB_CATS = [
  { key: 'p1', tag: 'よく聞く', name: '毎日耳にする', color: '#C96442' },
  { key: 'p2', tag: '一般的', name: 'よく出会う', color: '#2E7FA6' },
  { key: 'p3', tag: '上級', name: '知っておくと便利', color: '#8B5CB8' }
];
PROVERB_CATS.forEach(l => LEVEL_MAP[l.key] = l);
const ADV_CATS = [
  { key: 'a1', tag: 'A', name: '形容動詞・名詞の副詞形（と／に）', color: '#C96442' },
  { key: 'b1', tag: 'B', name: 'オノマトペ（擬音語・擬態語）', color: '#2E7FA6' }
];
ADV_CATS.forEach(l => LEVEL_MAP[l.key] = l);
function groupsFor(topic){ return topic && topic.kind === 'adverb' ? ADV_CATS : topic && topic.kind === 'proverb' ? PROVERB_CATS : topic && topic.kind === 'freq' ? FREQ_CATS : (topic && topic.kind === 'slang' ? SLANG_CATS : LEVELS); }
LEVELS.forEach(l => LEVEL_MAP[l.key] = l);

function renderLegend(topic){
  const present = new Set((topic.vocab || []).map(v => v.level));
  legendEl.innerHTML = groupsFor(topic).map(l => {
    const has = present.has(l.key);
    const style = `--lg-color:${l.color};${has ? '' : 'opacity:.4;cursor:default'}`;
    return `<button type="button" data-lv="${l.key}" style="${style}"${has ? '' : ' disabled'}><i style="background:${l.color}"></i>${l.tag} · ${l.name}</button>`;
  }).join('');
  legendEl.querySelectorAll('button[data-lv]').forEach(btn => {
    if(btn.disabled) return;
    btn.addEventListener('click', () => {
      const target = document.getElementById('lvgroup-' + btn.dataset.lv);
      if(!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
    });
  });
}
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

function levelCounts(topic){
  const c = {};
  (topic.vocab || []).forEach(v => { c[v.level] = (c[v.level] || 0) + 1; });
  return c;
}

function makeTopicCard(t){
  const isCompare = t.kind === 'compare';
  const isRef = t.category === 'ref';
  const c = levelCounts(t);
  const bar = isCompare ? '' : groupsFor(t).map(l => {
    const n = c[l.key] || 0;
    if(!n) return '';
    return `<i style="flex:${n};background:${l.color}"></i>`;
  }).join('');

  const metaHtml = isCompare
    ? `<span><b>${t.compare.length}</b> 組</span>`
    : `<span><b>${(t.vocab||[]).length}</b> 語彙</span><span><b>${(t.grammar||[]).length}</b> 文法</span>`;

  const card = document.createElement('button');
  card.className = 'topic-card' + (isRef ? ' is-ref' : '');
  card.dataset.id = t.id;

    <div class="tc-bar">${bar}</div>
    <span class="tc-go">始める <span>&#8594;</span></span>

  card.addEventListener('click', () => selectTopic(t.id));

}

const mainTopics = TOPICS.filter(t => t.category !== 'ref');

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectTopic(id){
  const topic = TOPICS.find(t => t.id === id);
  if(!topic) return;
  currentTopic = topic;
  const isCompare = topic.kind === 'compare';
  const tabsEl = document.querySelector('.tabs');

  if(isCompare){
    currentTab = 'compare';
    if(tabsEl) tabsEl.style.display = 'none';
    topicMetaEl.textContent = `${topic.id.replace(/^\d+\.\s*/, '')} · ${topic.compare.length} 組の比較`;
  } else {

  }

  topicTitleEl.textContent = topic.title;

  pickerEl.style.display = 'none';
  topicPanelEl.classList.add('show');

  renderItems();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Chỉ dựng nút từ (không dựng nội dung chi tiết): 60 thẻ đầu ngay, phần còn lại chia lô theo từng frame */
let renderToken = 0;
function fillBatched(grid, arr, build){
  const token = renderToken; let i = 0;
  const run = n => { const end = Math.min(arr.length, i + n); const frag = document.createDocumentFragment(); for(; i < end; i++) frag.appendChild(build(arr[i], i)); grid.appendChild(frag); };
  run(60);
  (function more(){ if(i >= arr.length || token !== renderToken) return; requestAnimationFrame(() => { if(token !== renderToken) return; run(150); more(); }); })();
}
/* một listener chung cho mọi thẻ; nội dung chi tiết chỉ được dựng khi bấm */
itemContainerEl.addEventListener('click', e => {
  const c = e.target.closest('.item-card');
  if(!c || c.dataset.idx === undefined) return;
  const idx = +c.dataset.idx;
  if(c.classList.contains('compare-card')) openCompareModal(idx); else openModal(idx);
});

function renderItems(){
  renderToken++;
  itemContainerEl.innerHTML = '';
  if(!currentTopic) return;

  if(currentTab === 'compare'){
    legendEl.style.display = 'none';
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, currentTopic.compare, (grp, idx) => {
      const card = document.createElement('button');
      card.className = 'item-card compare-card';
      card.innerHTML = `<div class="jp compare-jp">${escapeHtml(grp.label)}</div>`;
      card.dataset.idx = idx;
      return card;
    });
    itemContainerEl.appendChild(grid);
    return;
  }

  const list = currentTopic[currentTab];
  legendEl.style.display = currentTab === 'vocab' ? 'flex' : 'none';
  if(currentTab === 'vocab') renderLegend(currentTopic);

  const makeCard = (item, idx) => {
    const card = document.createElement('button');
    const lv = currentTab === 'vocab' ? (item.level || 'n3') : null;
    card.className = 'item-card'
      + (currentTab === 'grammar' ? ' grammar' : ' lv ' + 'lv-' + lv);
    card.innerHTML = `<div class="jp">${escapeHtml(currentTab === 'vocab' ? item.word : item.pattern)}</div>`;
    card.dataset.idx = idx;
    return card;
  };

  if(currentTab === 'grammar'){
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, list, (item, idx) => makeCard(item, idx));
    itemContainerEl.appendChild(grid);
    return;
  }

  groupsFor(currentTopic).forEach(lv => {
    const items = list.map((it, idx) => ({ it, idx }))
                      .filter(o => o.it.level === lv.key);
    if(!items.length) return;

    const group = document.createElement('div');
    group.className = 'level-group lv-' + lv.key;
    group.id = 'lvgroup-' + lv.key;
    group.innerHTML = `
      <div class="level-head">
        <span class="level-tag">${lv.tag}</span>
        <span class="level-name">${lv.name}</span>
        <span class="level-count">${items.length} 件</span>
      </div>
      <div class="level-line"></div>
    `;
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, items, o => makeCard(o.it, o.idx));
    group.appendChild(grid);
    itemContainerEl.appendChild(group);
  });
}

/* Ô chữ Hán + âm Hán Việt bên dưới (cùng kiểu .char-chip của 四字熟語).
   - Số chữ Hán == số âm tiết: ghép lần lượt.
   - Ít âm hơn chữ Hán (ví dụ 値段が上がる có 3 chữ Hán nhưng dữ liệu chỉ ghi "trị đoạn"):
     tìm cách ghép khớp nhất dựa trên từ điển chữ Hán -> âm học từ chính dữ liệu; chữ nào thiếu âm
     thì điền âm đã gặp ở từ khác (hiển thị nhạt hơn), nếu chưa từng gặp thì để ô trống.
   - Nhiều âm hơn chữ Hán: gộp thành 1 ô để không ghép sai. */
const HV_KANJI = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff々〆]/;
let HV_MAP = null;
function hvKanjiOf(word){ return Array.from(String(word || '')).filter(c => HV_KANJI.test(c)); }
function hvSyllables(hv){ return String(hv || '').trim().split(/\s+/).filter(Boolean); }
function hvBuildMap(){
  const m = new Map();
  const add = (k, h) => {
    h = String(h || '').trim().toLowerCase();
    if(!k || !h) return;
    let e = m.get(k); if(!e){ e = new Map(); m.set(k, e); }
    e.set(h, (e.get(h) || 0) + 1);
  };
  const addWord = (word, hv) => {
    const k = hvKanjiOf(word), sy = hvSyllables(hv);
    if(k.length && k.length === sy.length) k.forEach((c, i) => add(c, sy[i]));
  };
  if(typeof TOPICS !== 'undefined') TOPICS.forEach(t => {
    (t.vocab || []).forEach(v => {
      addWord(v.word, v.hanviet);
      (v.chars || []).forEach(c => add(c.c, c.h));
      (v.pair || []).forEach(w => addWord(w.word, w.hanviet));
    });
    (t.compare || []).forEach(g => (g.items || []).forEach(w => addWord(w.word, w.hanviet)));
  });
  return m;
}
function hvAlign(kanji, syl){
  if(!HV_MAP) HV_MAP = hvBuildMap();
  const m = kanji.length, n = syl.length, NEG = -1e9;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(NEG));
  const back = Array.from({length: m + 1}, () => new Array(n + 1).fill(null));
  dp[0][0] = 0;
  for(let i = 0; i < m; i++) for(let j = 0; j <= n; j++){
    if(dp[i][j] === NEG) continue;
    const skip = dp[i][j] - (m - i) * 0.001;            // chữ thiếu âm: ưu tiên là chữ ở cuối
    if(skip > dp[i + 1][j]){ dp[i + 1][j] = skip; back[i + 1][j] = 'skip'; }
    if(j < n){
      const e = HV_MAP.get(kanji[i]);
      const sc = dp[i][j] + (e && e.has(syl[j].toLowerCase()) ? 1 : 0);
      if(sc > dp[i + 1][j + 1]){ dp[i + 1][j + 1] = sc; back[i + 1][j + 1] = 'take'; }
    }
  }
  const out = new Array(m);
  let j = n;
  for(let i = m; i > 0; i--){
    if(back[i][j] === 'take'){ out[i - 1] = [kanji[i - 1], syl[j - 1], false]; j--; }
    else {
      const e = HV_MAP.get(kanji[i - 1]);
      const fill = e ? [...e.entries()].sort((x, y) => y[1] - x[1])[0][0] : '';
      out[i - 1] = [kanji[i - 1], fill, !!fill];
    }
  }
  return out;
}
function hvChipsHtml(word, hanviet){
  const hv = String(hanviet || '').trim();
  if(!hv) return '';
  const kanji = hvKanjiOf(word);
  if(!kanji.length) return '';
  const syl = hvSyllables(hv);
  const chips = syl.length === kanji.length ? kanji.map((c, i) => [c, syl[i], false])
              : syl.length < kanji.length ? hvAlign(kanji, syl)
              : [[kanji.join(''), hv, false]];
  return `<div class="char-row">${chips.map(([c, h, inf]) =>
    `<span class="char-chip${inf ? ' inferred' : ''}"${inf ? ' title="Suy ra từ các từ khác trong dữ liệu"' : ''}><b>${escapeHtml(c)}</b><i>${h ? escapeHtml(h) : '&nbsp;'}</i></span>`).join('')}</div>`;
}

/* ===== Từ trái nghĩa (trường "antonym", ví dụ "晴れ（はれ）: nắng") =====
   Nhiều từ ngăn bằng ； / xuống dòng / 、 / ; (khi sau đó là chữ Nhật). Không có antonym -> không hiện gì. */
const ANT_ARROW_SVG = '<svg viewBox="48 54 284 192" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M212 92 L143.0 92.0 Q132 92 129.9 81.2 L129.1 76.8 Q127 66 118.3 72.8 L66.7 113.2 Q58 120 65.2 128.3 L104.8 173.7 Q112 182 116.7 172.0 L122.3 160.0 Q127 150 138.0 150.0 L242.0 150.0 Q253 150 257.7 140.0 L263.3 128.0 Q268 118 275.2 126.3 L314.8 171.7 Q322 180 313.3 186.8 L261.7 227.2 Q253 234 250.9 223.2 L250.1 218.8 Q248 208 237.0 208.0 L168 208"/></svg>';
function antParse(raw){
  const s = String(raw == null ? '' : raw).trim();
  if(!s || /^[-–—ー・…\s]+$/.test(s)) return [];
  const parts = s.split(/\s*[；\n]\s*|\s*;\s*(?=[\u3040-\u30ff\u3400-\u9fff])|、\s*(?=[\u3040-\u30ff\u3400-\u9fff][^、：:]*[：:])/);
  const out = [];
  parts.forEach(p => {
    p = p.trim(); if(!p) return;
    const m = p.match(/^(.+?)\s*(?:[（(]([^）)]*)[）)])?\s*[：:]\s*([\s\S]*)$/)
           || p.match(/^(.+?)\s*(?:[（(]([^）)]*)[）)])?$/);
    out.push({ w: (m[1] || p).trim(), r: (m[2] || '').trim(), m: (m[3] || '').trim() });
  });
  return out;
}
/* Khối đầu thẻ: [badge + từ gốc]  ⇄  [từ trái nghĩa]; hai bên chung lưới hàng nên nghĩa luôn thẳng hàng */
/* antonym_hanviet: một từ -> cả chuỗi; nhiều từ -> tách bằng ； ; / xuống dòng theo thứ tự của antonym */
function antHvList(raw, n){
  const s = String(raw == null ? '' : raw).trim();
  if(!s) return [];
  if(n <= 1) return [s];
  return s.split(/\s*[；;\n]\s*|\s+\/\s+|\s*、\s*/).map(x => x.trim());
}
function antHeadHtml(badgeHtml, leftHtml, ants, leftWord, antHvRaw){
  const len = w => Array.from(String(w || '')).length || 1;
  const hvs = antHvList(antHvRaw, ants.length);
  const one = (a, i) => `
        <div class="modal-headword">${escapeHtml(a.w)}</div>
        ${a.r ? `<div class="modal-reading">${escapeHtml(a.r)}</div>` : ''}
        ${hvChipsHtml(a.w, hvs[i] || '')}
        ${a.m ? `<div class="modal-meaning">${escapeHtml(a.m)}</div>` : ''}`;
  const more = ants.slice(1);
  return `<div class="ant-head">
      <div class="ant-l-top">${badgeHtml}</div>
      <div class="ant-l" style="--n:${len(leftWord)}">${leftHtml}</div>
      <div class="ant-arrow" aria-hidden="true">${ANT_ARROW_SVG}</div>
      <div class="ant-r" style="--n:${len(ants[0].w)}">${one(ants[0], 0)}</div>
      ${more.length ? `<div class="ant-more">${more.map((a, j) => `<div class="ant-item">${one(a, j + 1)}</div>`).join('')}</div>` : ''}
    </div>`;
}
/* Bản gọn (khung so sánh / cặp từ): nằm bên phải hàng tiêu đề của từng từ */
function antInlineHtml(raw){
  const ants = antParse(raw);
  if(!ants.length) return '';
  return `<span class="ant-inline" title="対義語 · Trái nghĩa">${ANT_ARROW_SVG.replace('<svg ', '<svg class="ant-ico" ')}${ants.map(a =>
    `<span class="compare-word">${escapeHtml(a.w)}</span>${a.r ? `<span class="compare-reading">${escapeHtml(a.r)}</span>` : ''}${a.m ? `<span class="ant-im">${escapeHtml(a.m)}</span>` : ''}`
  ).join('<span class="compare-reading">·</span>')}</span>`;
}

<script>
(function(){
  var MIN=240, DEF=370, root=document.documentElement, wrap=document.querySelector('.wrap'), side=document.getElementById('side');
  if(!wrap||!side) return;
  var max=function(){ return Math.max(MIN+40, Math.min(720, window.innerWidth*0.6)); };
  var clamp=function(w){ return Math.round(Math.max(MIN, Math.min(max(), w))); };
  var apply=function(w){ root.style.setProperty('--side-w', w+'px'); };
  var saved=null; try{ saved=parseInt(localStorage.getItem('sideW'),10); }catch(e){}
  apply(clamp(saved>0?saved:DEF));
  var h=document.createElement('div'); h.className='side-resizer'; h.title='Kéo để chỉnh độ rộng (nhấp đúp để đặt lại)';
  document.body.appendChild(h);
  var save=function(w){ try{ localStorage.setItem('sideW',String(w)); }catch(e){} };
  h.addEventListener('pointerdown',function(e){
    e.preventDefault(); h.setPointerCapture(e.pointerId); document.body.classList.add('side-resizing');
  });
  h.addEventListener('pointermove',function(e){
    if(!document.body.classList.contains('side-resizing')) return;
    apply(clamp(e.clientX));
  });
  var end=function(e){
    if(!document.body.classList.contains('side-resizing')) return;
    document.body.classList.remove('side-resizing');
    try{ h.releasePointerCapture(e.pointerId); }catch(_){}
    save(clamp(side.getBoundingClientRect().width));
  };
  h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  h.addEventListener('dblclick',function(){ apply(DEF); save(DEF); });
  window.addEventListener('resize',function(){ apply(clamp(side.getBoundingClientRect().width||DEF)); });
})();
</script>

  /* ---------- trạng thái ---------- */
  var S={active:false,used:null,need:'',score:0,busy:false,broke:false};

   '</div>';
  var anchor=document.getElementById('topicPanel'); wrap.insertBefore(panel,anchor);

  function setNeed(c){ S.need=c||''; guideEl.innerHTML=__XH('Chỉ nhập <span class="sh-k">danh từ</span>.','<span class="sh-k">名詞</span>だけを入力してください。','Enter <span class="sh-k">nouns</span> only.')+'<span class="sh-rule">'+__XH('Không dùng từ kết thúc bằng 「<span class="sh-k">ん</span>」.','「<span class="sh-k">ん</span>」で終わる言葉は使えません。','Words ending in 「<span class="sh-k">ん</span>」 are not allowed.')+'</span>'+(c?'<span class="sh-start">'+__XH('Từ bắt đầu bằng <b>「'+esc(c)+'」</b>','<b>「'+esc(c)+'」</b>で始まる言葉','Word starting with <b>「'+esc(c)+'」</b>')+'</span>':''); }

  function shake(){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
  function lookup(r){

  /* nghĩa hiển thị (đã escape HTML): ưu tiên nghĩa tiếng Việt trong kho từ vựng;

  function meaningOf(r,info){
    info=info||lookup(r);

    if(info&&info.kind==='v'){ vi=(info.e.m||'').trim(); han=(info.e.h||'').trim(); }

    if(han&&han!==vi) out+=out?' <i>· '+esc(han)+'</i>':'<i>'+esc(han)+'</i>';

  /* ---------- loại từ: chỉ danh từ (n) mới được dùng ----------

     dict.js nhận 3 dạng:  "reading":"nghĩa"  |  "reading":["nghĩa","n"]  |  "reading":{"m":"nghĩa","p":"n"}
     Nhiều loại từ viết cách nhau bằng dấu phẩy, ví dụ "n,vs" (danh từ + する). Chỉ cần có "n" là được dùng.

  var NOUN_STRICT=false;

     - Gõ kana → chỉ cần MỘT từ trùng cách đọc là danh từ (hoặc chưa gắn loại từ khi NOUN_STRICT=false) là được dùng. */
  function isNoun(r,e){
    if(e){ var t0=posTags(e.p); if(t0.length) return t0.some(tagIsNoun); }

  function dispInfo(r){

    if(e&&e.w&&e.w!==r) return '<ruby>'+esc(e.w)+'<rt>'+esc(r)+'</rt></ruby>';

  /* nghĩa của từ người chơi vừa nhập — hiện cả khi đúng lẫn khi sai */
  function showMean(r,info,cls,why){
    var m=meaningOf(r,info);
    meanEl.className='sh-mean'+(cls?' '+cls:'');
    meanEl.innerHTML='<div class="w">'+wordHtml(r,info)+'</div><div class="m">'+(m||'<i>意味が見つかりません</i>')+'</div>'+(why?'<div class="why">'+why+'</div>':'');
  }
  function msg(h){ meanEl.className='sh-mean warn'; meanEl.innerHTML='<div class="why">'+h+'</div>'; }

  /* ---------- chỉ mục từ cho CPU: chỉ dùng từ CÓ trong dict.js ---------- */
  var idx=null;
  function buildIdx(){
    var v={}, d={};
    VOCAB.forEach(function(e){ if(DICT[e.r]===undefined||!isNoun(e.r,e)) return; (v[e.r[0]]=v[e.r[0]]||[]).push(e.r); }); /* có nghĩa tiếng Việt, ưu tiên */
    Object.keys(DICT).forEach(function(r){ if(r.length<2||!HIRA.test(r)||!isNoun(r)) return; (d[r[0]]=d[r[0]]||[]).push(r); });

  function okWord(r){ return r.length>=2 && endKana(r)!=='ん' && !S.used.has(r); }
  function candidates(c){
    var a=(idx.v[c]||[]).filter(okWord), seen={}; a.forEach(function(r){seen[r]=1;});
    var b=(idx.d[c]||[]).filter(function(r){ return !seen[r] && okWord(r); });

  function pickWord(c){
    var x=candidates(c), all=x.v.length?x.v:x.d;

  /* ---------- vòng chơi ---------- */
  function start(){
    buildIdx(); S.used=new Set(); S.score=0; S.busy=false; S.broke=false; S.active=true;

    goBtn.hidden=true; goBtn.disabled=false;

    if(!pool.length) for(c in idx.d) pool=pool.concat(idx.d[c].filter(okWord));
    var w=null; for(var i=0;i<40&&pool.length;i++){ w=pool[Math.floor(Math.random()*pool.length)]; if(countFrom(endKana(w))>1) break; }
    if(!w){ end(true,'辞書から単語を選べませんでした。'); return; }
    S.used.add(w); showCpu(w); setNeed(endKana(w));

    overEl.hidden=false;
    overEl.innerHTML='<h3>'+(win?'あなたの勝ち！':'ゲームオーバー')+'</h3>'+(reason?'<p>'+reason+'</p>':'')+'<p>言った単語 <b>'+S.score+'</b>'+(S.broke&&S.score>0?' · 新記録！':'')+'</p>';

    if(!imeEl||!/[\u00C0-\u024F\u1E00-\u1EFF]/.test(inp.value)) return;
    imeEl.classList.remove('warn'); void imeEl.offsetWidth; imeEl.classList.add('warn');
    clearTimeout(imeT); imeT=setTimeout(function(){ imeEl.classList.remove('warn'); },7600);

    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;

<script>
(function(){
