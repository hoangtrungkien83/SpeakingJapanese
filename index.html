<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扶桑言葉磨 — Learn with passion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F1EA;
    --bg-card: #FFFFFF;
    --bg-subtle: #FAF8F5;
    --ink: #2E2B26;
    --ink-soft: #6F6A5E;
    --ink-faint: #9C9689;
    --accent: #C96442;
    --accent-dark: #AE5236;
    --accent-soft: #F1E2D3;
    --accent-soft-2: #ECD9C6;
    --border: #E6DECF;
    --border-soft: #EFE9DC;
    --grammar: #5B7A6B;
    --grammar-soft: #E3EAE3;
    --advanced: #8B5CB8;
    --advanced-dark: #6E4494;
    --advanced-soft: #EFE3F7;
    --advanced-soft-2: #E3CFF2;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow-card: 0 1px 2px rgba(60, 50, 30, 0.06), 0 1px 1px rgba(60,50,30,0.04);
    --shadow-modal: 0 20px 60px rgba(40, 30, 15, 0.25);
    --btn-border: #B5A98F;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0F1115; --bg-card: #171A21; --bg-subtle: #13161C;
    --ink: #ECEEF2; --ink-soft: #AAB0BD; --ink-faint: #8A91A0;
    --accent: #C4502D; --accent-dark: #FFB59A;
    --accent-soft: #2A1F1C; --accent-soft-2: #382823;
    --border: #2A2F3A; --border-soft: #1F232C;
    --grammar: #86C5A6; --grammar-soft: #172823;
    --advanced: #8450BE; --advanced-dark: #D6BEF2;
    --advanced-soft: #231B31; --advanced-soft-2: #30254A;
    --shadow-card: 0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.35);
    --shadow-modal: 0 20px 60px rgba(0,0,0,.65);
    --btn-border: #5A6272;
  }
  :root[data-theme="dark"] .btn-random:hover{ background: #AD4222; }
  :root[data-theme="dark"] .overlay{ background: rgba(0,0,0,.6); }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans CJK JP", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.55;
  }

  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 90px;
  }

  /* ---------- Header ---------- */
  header{
    position: relative; overflow: hidden;
    display:flex; align-items:center; justify-content: space-between;
    gap: 24px 32px; flex-wrap: wrap;
    margin-bottom: 34px;
    padding: 36px 36px 30px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow-card), 0 14px 36px -18px rgba(60,45,25,.28);
  }
  header::before{
    content:""; position:absolute; left:0; right:0; top:0; height:6px;
    background: linear-gradient(90deg,#3F8F5F 0 20%,#2E7FA6 20% 40%,#C08A22 40% 60%,#C25A34 60% 80%,#8B5CB8 80% 100%);
  }
  .brand{ display:flex; align-items:center; gap: 24px; min-width: 0; }
  .brand-mark{
    width: 84px; height: 84px; border-radius: 24px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #000));
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    font-size: 44px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .brand-text h1{ margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .brand-text p{ margin: 8px 0 0; font-size: 16.5px; line-height: 1.45; color: var(--ink-soft); }
  .theme-zone{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap: 8px;
    align-self: stretch; padding-left: 32px; border-left: 1px solid var(--border);
  }
  .theme-label{ font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .theme-switch{ display:inline-flex; gap: 4px; padding: 4px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 999px; }
  .theme-opt{
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft);
    background: transparent; border: 0; border-radius: 999px; padding: 8px 16px;
    display:inline-flex; align-items:center; gap: 7px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-opt:hover{ color: var(--ink); }
  .theme-opt .theme-ico{ width:28px; height:28px; border-radius:50%; object-fit:cover; background:#fff; flex:none; display:block; }
  .theme-opt[aria-checked="true"]{ background: var(--accent); color: #fff; box-shadow: var(--shadow-card); }
  @media (max-width: 760px){
    header{ padding: 30px 22px 22px; border-radius: 22px; }
    .brand{ gap: 16px; }
    .brand-mark{ width: 64px; height: 64px; border-radius: 19px; font-size: 32px; }
    .brand-text h1{ font-size: 26px; }
    .brand-text p{ font-size: 14.5px; }
    .theme-zone{ width: 100%; flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 0 0; border-left: 0; border-top: 1px solid var(--border); }
  }

  /* ---------- Hero / random panel ---------- */
  .hero{
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 30px 30px 26px;
    box-shadow: var(--shadow-card);
    margin-bottom: 26px;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-copy h2{
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 620;
  }
  .hero-copy p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 46ch;
  }

  .btn-random{
    display:inline-flex;
    align-items:center;
    gap: 9px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-random:hover{ background: var(--accent-dark); }
  .btn-random:active{ transform: scale(0.98); }
  .btn-random .dice{ font-size: 17px; display:inline-block; transition: transform .35s ease; }
  .btn-random.spin .dice{ transform: rotate(300deg); }

  /* topic pill picker */
  .topic-pills{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
  }
  .pill{
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 12.8px;
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
    transition: all .12s ease;
  }
  .pill:hover{ border-color: var(--accent); color: var(--ink); }
  .pill.active{
    background: var(--accent-soft);
    border-color: var(--accent-soft-2);
    color: var(--accent-dark);
    font-weight: 600;
  }

  /* ---------- Current topic panel ---------- */
  .topic-panel{
    display:none;
  }
  .topic-panel.show{ display:block; }

  .topic-header{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 6px 0 18px;
  }
  .topic-icon{ display:none; }
  .topic-header h2{
    margin: 0 0 4px;
    font-family: 'Zen Maru Gothic', -apple-system, "Hiragino Sans", sans-serif;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.01em;
    color: var(--ink);
    position: relative;
    padding-left: 16px;
  }
  .topic-header h2::before{
    content:"";
    position:absolute; left:0; top: 4px; bottom: 4px;
    width: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .topic-meta{
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* tabs */
  .tabs{
    display:flex;
    gap: 6px;
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 4px;
    width: fit-content;
    margin-bottom: 20px;
  }
  .tab-btn{
    border:none;
    background: transparent;
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: var(--bg-card);
    color: var(--ink);
    box-shadow: var(--shadow-card);
  }

  /* item grid */
  .item-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .item-card{
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 16px 17px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease, box-shadow .15s ease;
    text-align: left;
  }
  .item-card:hover{
    border-color: var(--accent-soft-2);
    box-shadow: var(--shadow-card);
    transform: translateY(-1px);
  }
  .item-card .jp{
    font-size: 19px;
    font-weight: 650;
    margin-bottom: 3px;
  }
  .item-card .reading{
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  .item-card.grammar .jp{ font-size: 16.5px; }
  .badge-type{
    display:inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 9px;
  }
  .badge-vocab{ background: var(--accent-soft); color: var(--accent-dark); }
  .badge-grammar{ background: var(--grammar-soft); color: var(--grammar); }
  .badge-advanced{ background: var(--advanced); color: #fff; }

  /* ===== Bộ chọn chủ đề ===== */
  .picker{ margin-bottom: 40px; }
  .picker-head{ margin-bottom: 20px; }
  .picker-head h2{
    margin: 0 0 6px;
    font-size: 25px;
    font-weight: 660;
    letter-spacing: -0.02em;
  }
  .picker-head p{
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .section-divider{
    display:flex; align-items:center; gap: 14px;
    margin: 34px 0 16px;
  }
  .section-divider:first-child{ margin-top: 0; }
  .section-divider span{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .section-divider::after{
    content:"";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .topic-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .topic-grid.ref-grid{
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 6px;
  }
  .topic-card{
    position: relative;
    text-align: left;
    background: var(--bg-card);
    border: 1.5px solid var(--accent-soft-2);
    border-radius: var(--radius-md);
    padding: 22px 20px 18px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .topic-card::before{
    content:"";
    position:absolute; inset: 0 auto 0 0;
    width: 4px;
    background: var(--accent);
    opacity: 1;
  }
  .topic-card:hover{
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 12px 28px rgba(60, 45, 25, 0.12);
  }
  .topic-card.is-ref{
    padding: 15px 16px 13px;
    border: 1px dashed var(--border);
    background: var(--bg-subtle);
    box-shadow: none;
  }
  .topic-card.is-ref::before{
    background: var(--grammar);
    width: 3px;
  }
  .topic-card.is-ref:hover{
    transform: translateY(-2px);
    border-color: var(--grammar);
    box-shadow: 0 6px 16px rgba(60, 45, 25, 0.08);
  }
  .tc-top{
    margin-bottom: 10px;
  }
  .tc-eyebrow{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-dark);
  }
  .is-ref .tc-eyebrow{
    color: var(--grammar);
    font-size: 10px;
  }
  .tc-jp{
    font-size: 13px;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .tc-title{
    margin: 0 0 10px;
    font-family: 'Zen Maru Gothic', -apple-system, "Hiragino Sans", sans-serif;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.28;
    color: var(--ink);
  }
  .is-ref .tc-title{
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .tc-meta{
    display:flex; gap: 12px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .is-ref .tc-meta{ font-size: 11.5px; margin-bottom: 8px; }
  .tc-meta b{ color: var(--ink); font-weight: 620; }
  .tc-bar{
    display:flex;
    height: 5px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--border-soft);
    margin-bottom: 12px;
  }
  .tc-bar i{ display:block; height: 100%; }
  .tc-go{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-dark);
    display:inline-flex; align-items:center; gap: 5px;
  }
  .topic-card:hover .tc-go span{ transform: translateX(3px); }
  .tc-go span{ display:inline-block; transition: transform .18s ease; }

  .btn-back{
    display:inline-flex; align-items:center; gap: 10.5px;
    position: sticky;
    top: calc(10px + env(safe-area-inset-top, 0px));
    z-index: 30;
    background: var(--bg);
    border: 2px solid var(--btn-border);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 19.5px;
    font-weight: 550;
    padding: 10.5px 19.5px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 18px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn-back:hover{
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-soft);
  }

  @media (max-width: 560px){
    .topic-grid{ grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 11px; }
    .topic-card{ padding: 15px 14px 14px; }
    .tc-title{ font-size: 19px; }
    .picker-head h2{ font-size: 21px; }
  }

  /* ===== Phân loại theo cấp độ ===== */
  .lv-n5{ --lv: #3F8F5F; --lv-dark: #2F6F49; --lv-soft: #E2F0E6; --lv-soft-2: #C9E3D2; }
  .lv-n4{ --lv: #2E7FA6; --lv-dark: #226484; --lv-soft: #DEECF4; --lv-soft-2: #C3DCEA; }
  .lv-n3{ --lv: #C08A22; --lv-dark: #96691A; --lv-soft: #F7EBD3; --lv-soft-2: #EDD9AE; }
  .lv-n2{ --lv: #C25A34; --lv-dark: #9B4527; --lv-soft: #F8E3D9; --lv-soft-2: #EFCBBA; }
  .lv-s1{ --lv: #D14D72; --lv-dark: #A63855; --lv-soft: #FBE4EA; --lv-soft-2: #F3C7D3; }
  .lv-s2{ --lv: #7A5CD1; --lv-dark: #5E43A8; --lv-soft: #EBE5FA; --lv-soft-2: #D6CBF3; }
  .lv-s3{ --lv: #D1822E; --lv-dark: #A56222; --lv-soft: #FAEBD9; --lv-soft-2: #F0D5B4; }
  .lv-s4{ --lv: #2E9BA6; --lv-dark: #227781; --lv-soft: #DEF1F3; --lv-soft-2: #BEE1E5; }
  .lv-s5{ --lv: #4E8C3F; --lv-dark: #3B6C30; --lv-soft: #E6F1E2; --lv-soft-2: #CCE2C5; }
  .lv-f0{ --lv: #3F8F5F; --lv-dark: #2F6F49; --lv-soft: #E2F0E6; --lv-soft-2: #C9E3D2; }
  .lv-p1{ --lv: #C96442; --lv-dark: #AE5236; --lv-soft: #F8E6DC; --lv-soft-2: #EFCDBB; }
  .lv-p2{ --lv: #2E7FA6; --lv-dark: #226383; --lv-soft: #DEEDF5; --lv-soft-2: #BCDAE8; }
  .lv-p3{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }
  .lv-f1{ --lv: #C96442; --lv-dark: #AE5236; --lv-soft: #F8E6DC; --lv-soft-2: #EFCDBB; }
  .lv-f2{ --lv: #2E7FA6; --lv-dark: #226383; --lv-soft: #DEEDF5; --lv-soft-2: #BCDAE8; }
  .lv-f3{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }
  .lv-n1{ --lv: #8B5CB8; --lv-dark: #6E4494; --lv-soft: #EFE3F7; --lv-soft-2: #E3CFF2; }

  .level-group{ margin-top: 22px; }
  .level-group:first-child{ margin-top: 4px; }
  .level-head{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: 11px; flex-wrap: wrap;
  }
  .level-tag{
    background: var(--lv);
    color:#fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .level-name{
    font-size: 13.5px;
    font-weight: 600;
    color: var(--lv-dark);
  }
  .level-count{
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-left: auto;
  }
  .level-line{
    height: 1px;
    background: var(--lv-soft-2);
    margin-bottom: 12px;
  }
  .item-card.lv{
    background: linear-gradient(180deg, var(--lv-soft) 0%, var(--bg-card) 70%);
    border: 1px solid var(--lv-soft-2);
  }
  .item-card.lv:hover{ border-color: var(--lv); }
  .item-card.lv .jp{ color: var(--lv-dark); }
  .badge-level{ background: var(--lv); color:#fff; }
  .modal.lv .modal-meaning,
  .modal.lv .modal-hanviet{
    color: var(--lv-dark);
    background: var(--lv-soft);
  }
  .modal.lv .compare-word{ color: var(--lv-dark); }

  /* chú thích màu */
  .legend{
    display:flex; flex-wrap: wrap; gap: 8px;
    margin: 2px 0 16px;
  }
  .legend button{
    display:inline-flex; align-items:center; gap: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 550;
    color: var(--ink-soft);
    background: var(--bg-subtle);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 4px 10px 4px 8px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease, transform .12s ease;
  }
  .legend button:hover{
    border-color: var(--lg-color, var(--accent));
    color: var(--ink);
    background: var(--bg-card);
    transform: translateY(-1px);
  }
  .legend button:active{ transform: translateY(0); }
  .legend button.flash{
    animation: legendFlash .7s ease;
  }
  @keyframes legendFlash{
    0%   { background: var(--lg-color, var(--accent)); color: #fff; border-color: var(--lg-color, var(--accent)); }
    100% { background: var(--bg-subtle); color: var(--ink-soft); border-color: var(--border-soft); }
  }
  .legend i{
    width: 9px; height: 9px; border-radius: 50%;
    display:inline-block;
    flex-shrink: 0;
  }
  .level-group{ scroll-margin-top: 80px; }

  /* ===== Credit ===== */
  .credit{
    position: fixed;
    right: 16px;
    bottom: 14px;
    z-index: 40;
    display: inline-flex;
    align-items: center;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--ink-faint);
    user-select: none;
    opacity: 0.75;
    transition: opacity .2s ease;
  }
  .credit:hover{ opacity: 1; }
  .credit b{
    font-weight: 650;

  /* ===== Minimal refresh (override layer) ===== */
  :root{ --radius-lg:16px; --radius-md:12px; --radius-sm:8px; --shadow-card:none; --ink-soft:#5E594D; --ink-faint:#6F695D; }
  :root[data-theme="dark"]{ --shadow-card:none; --ink-soft:#B8BECA; --ink-faint:#9AA2B1; }
  body{ font-family:"Inter","Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",sans-serif; }

  [class^="lv-"],[class*=" lv-"]{ --lv-soft:var(--bg-subtle); --lv-soft-2:var(--border-soft); --lv-dark:var(--ink); }
  .level-tag,.badge-level{ background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:12px; letter-spacing:.04em; display:inline-flex; align-items:center; gap:7px; }

  .tabs{ background:transparent; border:0; border-bottom:1px solid var(--border); border-radius:0; padding:0; gap:26px; width:100%; }
  .tab-btn{ border-radius:0; padding:12px 2px; margin-bottom:-1px; border-bottom:2px solid transparent; font-size:15px; }
  .tab-btn.active{ background:transparent; box-shadow:none; border-bottom-color:var(--accent); color:var(--ink); }
  /* masthead phẳng */

  .topbar-in{ max-width:900px; margin:0 auto; padding:10px 20px; padding-top:calc(10px + env(safe-area-inset-top,0px)); min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:12px; }

  /* ===== Ảnh nền mờ: 2 lớp, đổi chéo mờ dần ===== */
  :root{ --bg-art-opacity: .30; }
  :root[data-theme="dark"]{ --bg-art-opacity: .30; --border:#262B35; --border-soft:#1C2028; }
  .bg-layer{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-position:center; background-size:cover; background-repeat:no-repeat;
    opacity:0; transition: opacity 1.8s ease; will-change: opacity;
  }
  .bg-layer.on{ opacity: var(--bg-art-opacity); }
  /* chế độ tối: ảnh mờ hơn ở vùng nội dung giữa trang, rõ hơn ở hai bên */
  :root[data-theme="dark"] .bg-layer{
    -webkit-mask-image: linear-gradient(90deg,#000 0%,rgba(0,0,0,.65) calc(50% - 470px),rgba(0,0,0,.65) calc(50% + 470px),#000 100%);
    mask-image: linear-gradient(90deg,#000 0%,rgba(0,0,0,.65) calc(50% - 470px),rgba(0,0,0,.65) calc(50% + 470px),#000 100%);
  }
  :root[data-theme="dark"] .bg-layer.sketch{ filter:none; } /* bộ lọc mực vàng đã nướng sẵn vào ảnh */
  /* ánh ấm rất nhẹ ở hai góc để nền tối không bị lạnh */
  :root[data-theme="dark"] body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(ellipse at 12% 0%, rgba(196,80,45,.10), transparent 55%),
                radial-gradient(ellipse at 92% 100%, rgba(240,190,120,.07), transparent 50%);
  }
  :root[data-theme="dark"] .item-card{ border-color: var(--border-soft); }

  /* ===== Dark · Option C "Urushi": đen sơn mài – đỏ son – vàng kim ===== */
:root[data-theme="dark"]{
  --bg:#0D0B0C; --bg-card:#17110F; --bg-subtle:#120D0C;
  --ink:#F3EBDD; --ink-soft:#CFC3B0; --ink-faint:#A09482;
  --accent:#C4502D; --accent-dark:#F0A58A;
  --accent-soft:#2A1A15; --accent-soft-2:#3A241C;
  --border:#33262A; --border-soft:#241A1A;
  --gold:#C9A961; --gold-hi:#EBD59B;
  --btn-border:#6B5A44;
  --shadow-modal:0 30px 80px rgba(0,0,0,.8);
}
:root[data-theme="dark"] .overlay{ background:rgba(6,3,3,.84); }
/* thẻ từ vựng: viền sáng dốc từ góc trên, glow theo màu cấp độ */
:root[data-theme="dark"] .item-card,
:root[data-theme="dark"] .item-card.lv,

  box-shadow: 0 0 16px -6px color-mix(in srgb,var(--c) 70%,transparent), inset 0 1px 0 rgba(235,213,155,.12);

const btnBack = document.getElementById('btnBack');
const topicPanelEl = document.getElementById('topicPanel');
const topicTitleEl = document.getElementById('topicTitle');

const LEVELS = [
  { key: 'n5', tag: 'N5', name: '初級', color: '#3F8F5F' },
  { key: 'n4', tag: 'N4', name: '初中級', color: '#2E7FA6' },
  { key: 'n3', tag: 'N3', name: '中級', color: '#C08A22' },
  { key: 'n2', tag: 'N2', name: '中上級', color: '#C25A34' },
  { key: 'n1', tag: 'N1', name: '上級', color: '#8B5CB8' }
];
const SLANG_CATS = [
  { key: 's1', tag: 'SLANG', name: 'ネットスラング', color: '#D14D72' },
  { key: 's2', tag: 'TEEN', name: '若者言葉', color: '#7A5CD1' },
  { key: 's3', tag: 'REACT', name: '感情・リアクション', color: '#D1822E' },
  { key: 's4', tag: 'SNS', name: 'SNS用語', color: '#2E9BA6' },
  { key: 's5', tag: 'CASUAL', name: '会話の省略表現', color: '#4E8C3F' }
];
const LEVEL_MAP = {};
SLANG_CATS.forEach(l => LEVEL_MAP[l.key] = l);
const FREQ_CATS = [
  { key: 'f0', tag: 'フロー', name: '状況別シナリオ', color: '#3F8F5F' },
  { key: 'f1', tag: 'よく使う', name: '毎回の勤務で使う', color: '#C96442' },
  { key: 'f2', tag: '頻出', name: '仕事・手順', color: '#2E7FA6' },
  { key: 'f3', tag: 'たまに', name: '場面・手続き', color: '#8B5CB8' }
];
FREQ_CATS.forEach(l => LEVEL_MAP[l.key] = l);
const PROVERB_CATS = [
  { key: 'p1', tag: 'よく聞く', name: '毎日耳にする', color: '#C96442' },
  { key: 'p2', tag: '一般的', name: 'よく出会う', color: '#2E7FA6' },
  { key: 'p3', tag: '上級', name: '知っておくと便利', color: '#8B5CB8' }
];
PROVERB_CATS.forEach(l => LEVEL_MAP[l.key] = l);
function groupsFor(topic){ return topic && topic.kind === 'proverb' ? PROVERB_CATS : topic && topic.kind === 'freq' ? FREQ_CATS : (topic && topic.kind === 'slang' ? SLANG_CATS : LEVELS); }
LEVELS.forEach(l => LEVEL_MAP[l.key] = l);

function renderLegend(topic){
  const present = new Set((topic.vocab || []).map(v => v.level));
  legendEl.innerHTML = groupsFor(topic).map(l => {
    const has = present.has(l.key);
    const style = `--lg-color:${l.color};${has ? '' : 'opacity:.4;cursor:default'}`;
    return `<button type="button" data-lv="${l.key}" style="${style}"${has ? '' : ' disabled'}><i style="background:${l.color}"></i>${l.tag} · ${l.name}</button>`;
  }).join('');
  legendEl.querySelectorAll('button[data-lv]').forEach(btn => {
    if(btn.disabled) return;
    btn.addEventListener('click', () => {
      const target = document.getElementById('lvgroup-' + btn.dataset.lv);
      if(!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');
    });
  });
}
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

function levelCounts(topic){
  const c = {};
  (topic.vocab || []).forEach(v => { c[v.level] = (c[v.level] || 0) + 1; });
  return c;
}

function makeTopicCard(t){
  const isCompare = t.kind === 'compare';
  const isRef = t.category === 'ref';
  const c = levelCounts(t);
  const bar = isCompare ? '' : groupsFor(t).map(l => {
    const n = c[l.key] || 0;
    if(!n) return '';
    return `<i style="flex:${n};background:${l.color}"></i>`;
  }).join('');

  const metaHtml = isCompare
    ? `<span><b>${t.compare.length}</b> 組</span>`
    : `<span><b>${(t.vocab||[]).length}</b> 語彙</span><span><b>${(t.grammar||[]).length}</b> 文法</span>`;

  const card = document.createElement('button');
  card.className = 'topic-card' + (isRef ? ' is-ref' : '');
  card.dataset.id = t.id;
  card.innerHTML = `
    <div class="tc-top">
      <span class="tc-eyebrow">${escapeHtml(t.id.replace(/^\d+\.\s*/, ''))}</span>
    </div>
    <h3 class="tc-title">${escapeHtml(t.title)}</h3>
    <div class="tc-meta">${metaHtml}</div>
    <div class="tc-bar">${bar}</div>
    <span class="tc-go">始める <span>&#8594;</span></span>
  `;
  card.addEventListener('click', () => selectTopic(t.id));
  return card;
}

const mainTopics = TOPICS.filter(t => t.category !== 'ref');
const refTopics = TOPICS.filter(t => t.category === 'ref');

const mainGrid = document.createElement('div');
mainGrid.className = 'topic-grid';
mainTopics.forEach(t => mainGrid.appendChild(makeTopicCard(t)));
topicGridEl.appendChild(mainGrid);

if(refTopics.length){
  const divider = document.createElement('div');
  divider.className = 'section-divider';
  divider.innerHTML = '<span>文法・リファレンス</span>';
  topicGridEl.appendChild(divider);

  const refGrid = document.createElement('div');
  refGrid.className = 'topic-grid ref-grid';
  refTopics.forEach(t => refGrid.appendChild(makeTopicCard(t)));
  topicGridEl.appendChild(refGrid);
}

document.getElementById('footerNote').textContent =
  `${TOPICS.length} トピック · ${TOPICS.reduce((s,t)=>s+(t.vocab||[]).length,0)} 語彙 · ${TOPICS.reduce((s,t)=>s+(t.grammar||[]).length,0)} 文法パターン · ${TOPICS.reduce((s,t)=>s+(t.compare||[]).length,0)} 比較セット`;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectTopic(id){
  const topic = TOPICS.find(t => t.id === id);
  if(!topic) return;
  currentTopic = topic;
  const isCompare = topic.kind === 'compare';
  const tabsEl = document.querySelector('.tabs');

  if(isCompare){
    currentTab = 'compare';
    if(tabsEl) tabsEl.style.display = 'none';
    topicMetaEl.textContent = `${topic.id.replace(/^\d+\.\s*/, '')} · ${topic.compare.length} 組の比較`;
  } else {
    currentTab = 'vocab';
    if(tabsEl) tabsEl.style.display = 'flex';
    document.getElementById('tabVocab').classList.add('active');
    document.getElementById('tabGrammar').classList.remove('active');
    topicMetaEl.textContent = `${topic.id.replace(/^\d+\.\s*/, '')} · ${(topic.vocab||[]).length} 語彙 · ${(topic.grammar||[]).length} 文法パターン`;
  }

  topicTitleEl.textContent = topic.title;

  pickerEl.style.display = 'none';
  topicPanelEl.classList.add('show');

  renderItems();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Chỉ dựng nút từ (không dựng nội dung chi tiết): 60 thẻ đầu ngay, phần còn lại chia lô theo từng frame */
let renderToken = 0;
function fillBatched(grid, arr, build){
  const token = renderToken; let i = 0;
  const run = n => { const end = Math.min(arr.length, i + n); const frag = document.createDocumentFragment(); for(; i < end; i++) frag.appendChild(build(arr[i], i)); grid.appendChild(frag); };
  run(60);
  (function more(){ if(i >= arr.length || token !== renderToken) return; requestAnimationFrame(() => { if(token !== renderToken) return; run(150); more(); }); })();
}
/* một listener chung cho mọi thẻ; nội dung chi tiết chỉ được dựng khi bấm */
itemContainerEl.addEventListener('click', e => {
  const c = e.target.closest('.item-card');
  if(!c || c.dataset.idx === undefined) return;
  const idx = +c.dataset.idx;
  if(c.classList.contains('compare-card')) openCompareModal(idx); else openModal(idx);
});

function renderItems(){
  renderToken++;
  itemContainerEl.innerHTML = '';
  if(!currentTopic) return;

  if(currentTab === 'compare'){
    legendEl.style.display = 'none';
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, currentTopic.compare, (grp, idx) => {
      const card = document.createElement('button');
      card.className = 'item-card compare-card';
      card.innerHTML = `<div class="jp compare-jp">${escapeHtml(grp.label)}</div>`;
      card.dataset.idx = idx;
      return card;
    });
    itemContainerEl.appendChild(grid);
    return;
  }

  const list = currentTopic[currentTab];
  legendEl.style.display = currentTab === 'vocab' ? 'flex' : 'none';
  if(currentTab === 'vocab') renderLegend(currentTopic);

  const makeCard = (item, idx) => {
    const card = document.createElement('button');
    const lv = currentTab === 'vocab' ? (item.level || 'n3') : null;
    card.className = 'item-card'
      + (currentTab === 'grammar' ? ' grammar' : ' lv ' + 'lv-' + lv);
    card.innerHTML = `<div class="jp">${escapeHtml(currentTab === 'vocab' ? item.word : item.pattern)}</div>`;
    card.dataset.idx = idx;
    return card;
  };

  if(currentTab === 'grammar'){
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, list, (item, idx) => makeCard(item, idx));
    itemContainerEl.appendChild(grid);
    return;
  }

  groupsFor(currentTopic).forEach(lv => {
    const items = list.map((it, idx) => ({ it, idx }))
                      .filter(o => o.it.level === lv.key);
    if(!items.length) return;

    const group = document.createElement('div');
    group.className = 'level-group lv-' + lv.key;
    group.id = 'lvgroup-' + lv.key;
    group.innerHTML = `
      <div class="level-head">
        <span class="level-tag">${lv.tag}</span>
        <span class="level-name">${lv.name}</span>
        <span class="level-count">${items.length} 件</span>
      </div>
      <div class="level-line"></div>
    `;
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    fillBatched(grid, items, o => makeCard(o.it, o.idx));
    group.appendChild(grid);
    itemContainerEl.appendChild(group);
  });
}

/* Ô chữ Hán + âm Hán Việt bên dưới (cùng kiểu .char-chip của 四字熟語).
   - Số chữ Hán == số âm tiết: ghép lần lượt.
   - Ít âm hơn chữ Hán (ví dụ 値段が上がる có 3 chữ Hán nhưng dữ liệu chỉ ghi "trị đoạn"):
     tìm cách ghép khớp nhất dựa trên từ điển chữ Hán -> âm học từ chính dữ liệu; chữ nào thiếu âm
     thì điền âm đã gặp ở từ khác (hiển thị nhạt hơn), nếu chưa từng gặp thì để ô trống.
   - Nhiều âm hơn chữ Hán: gộp thành 1 ô để không ghép sai. */
const HV_KANJI = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff々〆]/;
let HV_MAP = null;
function hvKanjiOf(word){ return Array.from(String(word || '')).filter(c => HV_KANJI.test(c)); }
function hvSyllables(hv){ return String(hv || '').trim().split(/\s+/).filter(Boolean); }
function hvBuildMap(){
  const m = new Map();
  const add = (k, h) => {
    h = String(h || '').trim().toLowerCase();
    if(!k || !h) return;
    let e = m.get(k); if(!e){ e = new Map(); m.set(k, e); }
    e.set(h, (e.get(h) || 0) + 1);
  };
  const addWord = (word, hv) => {
    const k = hvKanjiOf(word), sy = hvSyllables(hv);
    if(k.length && k.length === sy.length) k.forEach((c, i) => add(c, sy[i]));
  };
  if(typeof TOPICS !== 'undefined') TOPICS.forEach(t => {
    (t.vocab || []).forEach(v => {
      addWord(v.word, v.hanviet);
      (v.chars || []).forEach(c => add(c.c, c.h));
      (v.pair || []).forEach(w => addWord(w.word, w.hanviet));
    });
    (t.compare || []).forEach(g => (g.items || []).forEach(w => addWord(w.word, w.hanviet)));
  });
  return m;
}
function hvAlign(kanji, syl){
  if(!HV_MAP) HV_MAP = hvBuildMap();
  const m = kanji.length, n = syl.length, NEG = -1e9;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(NEG));
  const back = Array.from({length: m + 1}, () => new Array(n + 1).fill(null));
  dp[0][0] = 0;
  for(let i = 0; i < m; i++) for(let j = 0; j <= n; j++){
    if(dp[i][j] === NEG) continue;
    const skip = dp[i][j] - (m - i) * 0.001;            // chữ thiếu âm: ưu tiên là chữ ở cuối
    if(skip > dp[i + 1][j]){ dp[i + 1][j] = skip; back[i + 1][j] = 'skip'; }
    if(j < n){
      const e = HV_MAP.get(kanji[i]);
      const sc = dp[i][j] + (e && e.has(syl[j].toLowerCase()) ? 1 : 0);
      if(sc > dp[i + 1][j + 1]){ dp[i + 1][j + 1] = sc; back[i + 1][j + 1] = 'take'; }
    }
  }
  const out = new Array(m);
  let j = n;
  for(let i = m; i > 0; i--){
    if(back[i][j] === 'take'){ out[i - 1] = [kanji[i - 1], syl[j - 1], false]; j--; }
    else {
      const e = HV_MAP.get(kanji[i - 1]);
      const fill = e ? [...e.entries()].sort((x, y) => y[1] - x[1])[0][0] : '';
      out[i - 1] = [kanji[i - 1], fill, !!fill];
    }
  }
  return out;
}
function hvChipsHtml(word, hanviet){
  const hv = String(hanviet || '').trim();
  if(!hv) return '';
  const kanji = hvKanjiOf(word);
  if(!kanji.length) return '';
  const syl = hvSyllables(hv);
  const chips = syl.length === kanji.length ? kanji.map((c, i) => [c, syl[i], false])
              : syl.length < kanji.length ? hvAlign(kanji, syl)
              : [[kanji.join(''), hv, false]];
  return `<div class="char-row">${chips.map(([c, h, inf]) =>
    `<span class="char-chip${inf ? ' inferred' : ''}"${inf ? ' title="Suy ra từ các từ khác trong dữ liệu"' : ''}><b>${escapeHtml(c)}</b><i>${h ? escapeHtml(h) : '&nbsp;'}</i></span>`).join('')}</div>`;
}

function openModal(idx){
  const item = currentTopic[currentTab][idx];
  if(item.pair){ openPairModal(item); return; }
  const lv = item.level || 'n3';
  modal.className = 'modal' + (currentTab === 'grammar' ? ' grammar' : ' lv lv-' + lv);

  const lvInfo = LEVEL_MAP[lv] || LEVEL_MAP['n3'];
  const badgeHtml = currentTab === 'vocab'
    ? `<span class="badge-type badge-level">${lvInfo.tag} · ${lvInfo.name.toUpperCase()}</span>`
    : `<span class="badge-type badge-grammar">文法</span>`;

  if(currentTab === 'vocab'){
    modalBody.innerHTML = `
      ${badgeHtml}
      <div class="modal-headword">${escapeHtml(item.word)}</div>
      <div class="modal-reading">${escapeHtml(item.reading || '')}</div>
            ${item.chars ? `<div class="char-row">${item.chars.map(c=>`<span class="char-chip"><b>${escapeHtml(c.c)}</b><i>${escapeHtml(c.h)}</i></span>`).join('')}</div>` : hvChipsHtml(item.word, item.hanviet)}
      <div class="modal-meaning">${escapeHtml(item.meaning || '')}</div>
      ${item.note ? `<div class="modal-note">💡 ${escapeHtml(item.note)}</div>` : ''}
      ${item.poem ? `<div class="poem-box"><div class="poem-label">題詠 · 詩</div><div class="poem-han">${escapeHtml(item.poem.han).replace('／','<br>')}</div><div class="poem-hv">${escapeHtml(item.poem.hv).replace(' / ','<br>')}</div><div class="poem-vi">${escapeHtml(item.poem.vi)}</div></div>` : ''}
      <div class="modal-section-label">例文</div>
      ${(item.examples || [{example:item.example, example_reading:item.example_reading, example_meaning:item.example_meaning}]).map((e,i,a) => `
      <div class="example-box" style="${i ? 'margin-top:10px' : ''}">
        ${a.length > 1 ? `<div class="modal-section-label" style="margin-bottom:6px">例文 ${i+1}</div>` : ''}
        <div class="example-jp">${escapeHtml(e.example || '')}</div>
        <div class="example-reading">${escapeHtml(e.example_reading || '')}</div>
        <div class="example-meaning">${escapeHtml(e.example_meaning || '')}</div>
      </div>`).join('')}
    `;
  } else {
    modalBody.innerHTML = `
      ${badgeHtml}
      <div class="modal-headword">${escapeHtml(item.pattern)}</div>
      <div class="modal-meaning">${escapeHtml(item.usage || '')}</div>
      <div class="modal-section-label">例文</div>
      <div class="example-box">
        <div class="example-jp">${escapeHtml(item.example || '')}</div>
        <div class="example-reading">${escapeHtml(item.example_reading || '')}</div>
        <div class="example-meaning">${escapeHtml(item.example_meaning || '')}</div>
      </div>
    `;
  }

  overlay.classList.add('show');
}

function openCompareModal(idx){
  const grp = currentTopic.compare[idx];
  modal.className = 'modal compare';
  const itemsHtml = grp.items.map(w => `
    <div class="compare-item">
      <div class="compare-item-head">
        <span class="compare-word">${escapeHtml(w.word)}</span>
        <span class="compare-reading">${escapeHtml(w.reading || '')}</span>
      </div>
      ${hvChipsHtml(w.word, w.hanviet)}
      <div class="compare-meaning">${escapeHtml(w.meaning || '')}</div>
      <div class="compare-example">
        <div class="example-jp" style="font-size:14.5px">${escapeHtml(w.example || '')}</div>
        <div class="example-reading">${escapeHtml(w.example_reading || '')}</div>
        <div class="example-meaning">${escapeHtml(w.example_meaning || '')}</div>
      </div>
      ${(w.examples || []).map(e => `
      <div class="compare-example" style="margin-top:12px">
        <div class="example-jp" style="font-size:14.5px">${escapeHtml(e.example || '')}</div>
        <div class="example-reading">${escapeHtml(e.example_reading || '')}</div>
        <div class="example-meaning">${escapeHtml(e.example_meaning || '')}</div>
      </div>`).join('')}
    </div>
  `).join('');
  modalBody.innerHTML = `
    <span class="badge-type badge-grammar">比較</span>
    <div class="modal-headword" style="font-size:24px">${escapeHtml(grp.label)}</div>
    ${grp.note ? `<div class="modal-note">💡 ${escapeHtml(grp.note)}</div>` : ''}
    <div class="modal-section-label" style="margin-top:18px">語ごとの違い</div>
    <div class="compare-list">${itemsHtml}</div>
  `;
  overlay.classList.add('show');
}

// Thẻ cặp từ (tự động từ / tha động từ): 2 từ trong 1 thẻ, mỗi từ có nhiều ví dụ
function openPairModal(item){
  const lv = item.level || 'n3';
  const lvInfo = LEVEL_MAP[lv] || LEVEL_MAP['n3'];
  modal.className = 'modal lv lv-' + lv;
  const wordsHtml = item.pair.map(w => {
    const notesHtml = (w.notes || []).map(n =>
      `<div class="modal-note" style="margin-bottom:10px;padding:9px 12px;font-size:13px">💡 ${escapeHtml(n)}</div>`
    ).join('');
    const examplesHtml = (w.examples || []).map((e, i) => `
      <div class="compare-example"${i ? ' style="margin-top:12px"' : ''}>
        <div class="example-jp" style="font-size:14.5px">${escapeHtml(e.example || '')}</div>
        <div class="example-reading">${escapeHtml(e.example_reading || '')}</div>
        <div class="example-meaning">${escapeHtml(e.example_meaning || '')}</div>
      </div>
    `).join('');
    return `
      <div class="compare-item">
        <div class="compare-item-head">
          <span class="compare-word">${escapeHtml(w.word)}</span>
          <span class="compare-reading">${escapeHtml(w.reading || '')}</span>
        </div>
        ${hvChipsHtml(w.word, w.hanviet)}
        <div class="compare-meaning">${escapeHtml(w.meaning || '')}</div>
        ${notesHtml}
        ${examplesHtml}
      </div>
    `;
  }).join('');
  modalBody.innerHTML = `
    <span class="badge-type badge-level">${lvInfo.tag} · ${lvInfo.name.toUpperCase()}</span>
    <div class="modal-headword" style="font-size:26px">${escapeHtml(item.word)}</div>
    <div class="modal-reading">${escapeHtml(item.reading || '')}</div>
    <div class="modal-section-label" style="margin-top:16px">${escapeHtml(item.pair_label || '自動詞・他動詞のペア')}</div>
    <div class="compare-list">${wordsHtml}</div>
  `;
  overlay.classList.add('show');
}

function closeModal(){
  overlay.classList.remove('show');
}

overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeModal();
});
modalClose.addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

btnBack.addEventListener('click', () => {
  topicPanelEl.classList.remove('show');
  pickerEl.style.display = 'block';
  currentTopic = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('tabVocab').addEventListener('click', () => {
  currentTab = 'vocab';
  document.getElementById('tabVocab').classList.add('active');
  document.getElementById('tabGrammar').classList.remove('active');
  renderItems();
});
document.getElementById('tabGrammar').addEventListener('click', () => {
  currentTab = 'grammar';
  document.getElementById('tabGrammar').classList.add('active');
  document.getElementById('tabVocab').classList.remove('active');
  renderItems();
});

const creditBubble = document.getElementById('creditBubble');
creditName.addEventListener('click', (e) => {
  e.stopPropagation();
  creditBubble.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if(!creditBubble.contains(e.target) && e.target !== creditName){
    creditBubble.classList.remove('show');
  }
});</script>

<script>
(function(){
  var root=document.documentElement, btns=document.querySelectorAll('.theme-opt');

  var clamp=function(w){ return Math.round(Math.max(MIN, Math.min(max(), w))); };
  var apply=function(w){ root.style.setProperty('--side-w', w+'px'); };
  var saved=null; try{ saved=parseInt(localStorage.getItem('sideW'),10); }catch(e){}
  apply(clamp(saved>0?saved:DEF));
  var h=document.createElement('div'); h.className='side-resizer'; h.title='Kéo để chỉnh độ rộng (nhấp đúp để đặt lại)';
  document.body.appendChild(h);
  var save=function(w){ try{ localStorage.setItem('sideW',String(w)); }catch(e){} };
  h.addEventListener('pointerdown',function(e){
    e.preventDefault(); h.setPointerCapture(e.pointerId); document.body.classList.add('side-resizing');
  });
  h.addEventListener('pointermove',function(e){
    if(!document.body.classList.contains('side-resizing')) return;
    apply(clamp(e.clientX));
  });
  var end=function(e){
    if(!document.body.classList.contains('side-resizing')) return;
    document.body.classList.remove('side-resizing');
    try{ h.releasePointerCapture(e.pointerId); }catch(_){}
    save(clamp(side.getBoundingClientRect().width));
  };
  h.addEventListener('pointerup',end); h.addEventListener('pointercancel',end);
  h.addEventListener('dblclick',function(){ apply(DEF); save(DEF); });

})();

      if(c==='-'){ out+='ー'; i++; continue; }
      if(!/[a-z]/.test(c)){ out+=c; i++; continue; }
      if(c==='n'){
        var nx=str[i+1];
        if(nx==='n'){ out+='ん'; i+=2; continue; }
        if(nx===undefined){ if(final){ out+='ん'; i++; continue; } out+=c; i++; continue; }
        if(!isV(nx) && nx!=='y'){ out+='ん'; i++; continue; }
      }
      if(!isV(c) && c!=='n' && str[i+1]===c){ out+='っ'; i++; continue; }
      var m=null;
      for(var L=3;L>=1;L--){ var sub=str.substr(i,L); if(sub.length===L && RT[sub]){ m=sub; break; } }
      if(m){ out+=RT[m]; i+=m.length; } else { out+=c; i++; }
    }
    return out;
  }

  /* ---------- trạng thái ---------- */
  var S={active:false,used:null,need:'',score:0,chain:[],hint:0,pending:null,busy:false,last:null};
  var opt={lv:{n5:1,n4:1,n3:1,n2:1,n1:1},diff:'easy',bigDict:true,trust:true};
  var BEST=0; try{ BEST=parseInt(localStorage.getItem('shiritoriBest'),10)||0; }catch(e){}

  /* ---------- giao diện ---------- */
  var panel=document.createElement('section'); panel.className='game-panel'; panel.id='gamePanel';
  panel.innerHTML=
   '<div class="game-head"><h2>ゲーム · しりとり</h2>'+
   '<p>交代で一つずつ単語を言います。新しい単語は、前の単語の最後の音で始めなければなりません。同じ単語は使えません。「ん」で終わる単語を言うと負けです。ひらがな・カタカナ・ローマ字、または語彙にある漢字で入力できます。</p></div>'+
   '<div class="game-set">'+
     '<div class="gs"><b>単語レベル</b><span id="gLv"></span></div>'+
     '<div class="gs"><b>難易度</b><button type="button" class="g-chip" data-diff="easy" aria-pressed="true">やさしい</button><button type="button" class="g-chip" data-diff="hard" aria-pressed="false">むずかしい</button></div>'+
     '<div class="gs"><label><input type="checkbox" id="gBig" checked> 語彙が尽きたらCPUも大きな辞書を使う</label><label><input type="checkbox" id="gTrust" checked> プレイヤーを信じる（単語チェックなし）</label></div>'+
   '</div>'+
   '<div class="game-board">'+
     '<div class="game-stat"><div class="game-need"><span>次の単語の最初の文字</span><span class="big" id="gNeed">—</span></div>'+
       '<div class="game-nums"><div><span>スコア</span><b id="gScore">0</b></div><div><span>ハイスコア</span><b id="gBest">0</b></div></div></div>'+
     '<div class="game-chat"><div class="game-chain" id="gChain"></div>'+
        '<div class="game-over" id="gOver"><div class="g-empty" id="gOverMsg">「はじめる」を押してスタート。<br>最初の単語はCPUが言います。</div><button type="button" class="g-btn primary" id="gStart">はじめる</button></div></div>'+
     '<div class="game-ctl"><form id="gForm" autocomplete="off"><input type="text" id="gInput" placeholder="単語を入力… (例: さくら / sakura)" disabled><button class="g-btn primary" id="gSend" disabled>送信</button><button type="button" class="g-btn" id="gHintBtn" disabled>ヒント</button><button type="button" class="g-btn" id="gGive" disabled>降参</button></form>'+
       '<div class="game-note" id="gNote"></div><div class="game-prev" id="gPrev"></div></div>'+
     '<div class="game-end" id="gEnd" hidden></div>'+
   '</div>';
  var anchor=document.getElementById('topicPanel'); wrap.insertBefore(panel,anchor);
  $('#gBest').textContent=BEST;

  var lvBox=$('#gLv');
  ['n5','n4','n3','n2','n1'].forEach(function(k){
    var b=document.createElement('button'); b.type='button'; b.className='g-chip'; b.textContent=k.toUpperCase(); b.setAttribute('aria-pressed','true');
    b.addEventListener('click',function(){
      var on=b.getAttribute('aria-pressed')!=='true';
      var cnt=Object.keys(opt.lv).filter(function(x){return opt.lv[x];}).length;
      if(!on && cnt<=1) return;
      opt.lv[k]=on?1:0; b.setAttribute('aria-pressed',on);
    });
    lvBox.appendChild(b);
  });
  panel.querySelectorAll('[data-diff]').forEach(function(b){ b.addEventListener('click',function(){
    opt.diff=b.dataset.diff; panel.querySelectorAll('[data-diff]').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
  }); });
  $('#gBig').addEventListener('change',function(e){ opt.bigDict=e.target.checked; });
  $('#gTrust').addEventListener('change',function(e){ opt.trust=e.target.checked; });

  /* nút sidebar */
  var gbtn=document.createElement('button'); gbtn.className='side-branch-head game-btn';
  gbtn.innerHTML='<span class="bt"><b>ゲーム</b></span>';
  var homeBtn=nav.querySelector('.side-item.home');
  var gwrap=document.createElement('div'); gwrap.className='side-branch'; gwrap.appendChild(gbtn);
  nav.appendChild(gwrap); /* cuối sidebar, cùng kiểu với 2 thẻ trên */
  function openGame(){
    loadDict();
    $('#topicPanel').classList.remove('show');
    nav.querySelectorAll('.side-item').forEach(function(b){ b.classList.remove('active'); });
    var ctrl=nav.querySelector('.side-ctrl'); if(ctrl) ctrl.style.display='none';
    try{ currentTopic=null; }catch(e){}
    panel.classList.add('show'); gbtn.classList.add('active');
    document.body.classList.remove('side-open'); window.scrollTo({top:0});
  }
  function closeGame(){ panel.classList.remove('show'); gbtn.classList.remove('active'); }
  gbtn.addEventListener('click',openGame);
  if(homeBtn) homeBtn.addEventListener('click',closeGame);
  var origSel=selectTopic;
  selectTopic=function(id){ closeGame(); origSel(id); };

  /* ---------- helpers ---------- */
  var chainEl=$('#gChain'), noteEl=$('#gNote'), prevEl=$('#gPrev'), inp=$('#gInput'), endEl=$('#gEnd'), overEl=$('#gOver'), overMsg=$('#gOverMsg');
  function setNote(h,err){ noteEl.className='game-note'+(err?' err':''); noteEl.innerHTML=h||''; }
  function setNeed(c){ $('#gNeed').textContent=c||'—'; S.need=c||''; }
  function setScore(){ $('#gScore').textContent=S.score; if(S.score>BEST){ BEST=S.score; $('#gBest').textContent=BEST; try{ localStorage.setItem('shiritoriBest',String(BEST)); }catch(e){} } }
  function lookup(r){
    var v=vByRead[r]; if(v&&v.length) return {kind:'v',e:v[0]};
    if(DICT[r]!==undefined) return {kind:'d',en:DICT[r]};
    return null;
  }
  /* nghĩa hiển thị (đã escape HTML): ưu tiên nghĩa tiếng Việt trong kho từ vựng;
     nếu từ chưa có nghĩa tiếng Việt thì dùng nghĩa tiếng Anh trong từ điển, không gắn nhãn ngôn ngữ */
  function meaningOf(r,info){
    info=info||lookup(r);
    var vi='', han='';
    if(info&&info.kind==='v'){ vi=(info.e.m||'').trim(); han=(info.e.h||'').trim(); }
    var main=vi;
    if(!main&&DICT[r]!==undefined) main=String(DICT[r]).trim();
    var out=main?esc(main):'';
    if(han&&han!==vi) out+=out?' <i>· '+esc(han)+'</i>':'<i>'+esc(han)+'</i>';
    return out;
  }
  function addMsg(who,r,info){
    var d=document.createElement('div'); d.className='g-msg'+(who==='me'?' me':'');
    var shown=esc(r.slice(0,-1))+'<span class="hl">'+esc(r.slice(-1))+'</span>';
    var wHtml, meaning='';
    if(info&&info.kind==='v'){
      var e=info.e;
      wHtml=(e.w&&e.w!==r)?'<ruby>'+esc(e.w)+'<rt>'+esc(r)+'</rt></ruby>':shown;
    } else {
      wHtml=shown;
    }
    meaning=meaningOf(r,info);
    d.innerHTML='<div class="who">'+(who==='me'?'あなた':'CPU')+'</div><div class="w">'+wHtml+'</div>'+(meaning?'<div class="m">'+meaning+'</div>':'');
    var em=chainEl.querySelector('.g-empty'); if(em) em.remove();
    chainEl.appendChild(d); chainEl.scrollTop=chainEl.scrollHeight;
  }
  function lvOK(e){ var m=/^n([1-5])$/.exec(e.lv); return !m || opt.lv['n'+m[1]]; }
  var idx=null;
  function buildIdx(){
    var v={}, d={};
    VOCAB.forEach(function(e){ if(!lvOK(e)) return; (v[e.r[0]]=v[e.r[0]]||[]).push(e.r); });
    if(opt.bigDict) Object.keys(DICT).forEach(function(r){ (d[r[0]]=d[r[0]]||[]).push(r); });
    idx={v:v,d:d};
  }
  function okWord(r){ return r.length>=2 && endKana(r)!=='ん' && !S.used.has(r); }
  function candidates(c){
    var a=(idx.v[c]||[]).filter(okWord), seen={}; a.forEach(function(r){seen[r]=1;});
    var b=(idx.d[c]||[]).filter(function(r){ return !seen[r] && okWord(r); });
    return {v:a,d:b};
  }
  /* từ vựng (có nghĩa tiếng Việt) bỏ qua bộ lọc cấp độ — dùng khi cấp độ đã chọn hết từ */
  function vocabAny(c){ var seen={}, a=[]; VOCAB.forEach(function(e){ if(e.r[0]===c && !seen[e.r] && okWord(e.r)){ seen[e.r]=1; a.push(e.r); } }); return a; }
  function countFrom(c){ var x=candidates(c); return x.v.length+x.d.length; }
  function pickWord(c){
    var x=candidates(c), all=x.v.length?x.v:vocabAny(c); if(!all.length) all=x.d; if(!all.length) return null;
    if(opt.diff==='hard'){
      var pool=all.length>400?all.sort(function(){return Math.random()-.5;}).slice(0,400):all;
      var sc=pool.map(function(r){ return {r:r,n:countFrom(endKana(r))}; }).sort(function(a,b){return a.n-b.n;});
      var k=sc.slice(0,5); return k[Math.floor(Math.random()*k.length)].r;
    }
    var src=all;
    return src[Math.floor(Math.random()*src.length)];
  }
  function setEnabled(on){ ['gInput','gSend','gHintBtn','gGive'].forEach(function(id){ $('#'+id).disabled=!on; }); if(on) inp.focus(); }

  /* ---------- vòng chơi ---------- */
  function start(){
    buildIdx(); S.used=new Set(); S.score=0; S.chain=[]; S.hint=0; S.pending=null; S.busy=false; S.active=true;
    chainEl.innerHTML=''; endEl.hidden=true; overEl.hidden=true; setScore(); prevEl.textContent=''; setNote('');
    $('#gStart').textContent='もう一度'; setEnabled(false);
    var firstPool=[]; for(var c in idx.v) firstPool=firstPool.concat(idx.v[c].filter(okWord));
    var w=firstPool[Math.floor(Math.random()*firstPool.length)];
    S.used.add(w); addMsg('cpu',w,lookup(w)); setNeed(endKana(w)); setEnabled(true);
    setNote('あなたの番です。「'+esc(S.need)+'」で始まる単語を入力してください。');
  }
  function end(win,reason){
    S.active=false; setEnabled(false); S.pending=null;
    var missed='';
    if(!win && S.need){
      var x=candidates(S.need), ex=x.v.concat(x.d).sort(function(){return Math.random()-.5;}).slice(0,5);
      if(ex.length) missed='<div>使えた単語の例：<ul>'+ex.map(function(r){ var mm=meaningOf(r); return '<li>'+esc(r)+(mm?' — '+mm:'')+'</li>'; }).join('')+'</ul></div>';
    }
    endEl.hidden=false; overMsg.hidden=true; overEl.hidden=false;
    endEl.innerHTML='<h3>'+(win?'🎉 あなたの勝ち！':'ゲーム終了')+'</h3><div>'+reason+'</div><div>言った単語の数：<b>'+S.score+'</b>'+(S.score>=BEST&&S.score>0?' · ハイスコア更新！':'')+'</div>'+missed;
    setNote(''); chainEl.scrollTop=chainEl.scrollHeight;
  }
  function accept(r,info){
    S.pending=null; S.used.add(r); S.score++; setScore(); S.hint=0; prevEl.textContent='';
    addMsg('me',r,info||lookup(r)); inp.value=''; setNote('');
    if(endKana(r)==='ん'){ end(false,'「'+esc(r)+'」は「ん」で終わるので、あなたの負けです。'); return; }
    S.busy=true; setEnabled(false); setNeed(endKana(r)); setNote('CPUが考え中…');
    setTimeout(function(){
      var w=pickWord(S.need);
      if(!w){ S.busy=false; end(true,'CPUは「'+esc(S.need)+'」で始まる単語が思いつきません。'); return; }
      S.used.add(w); addMsg('cpu',w,lookup(w)); setNeed(endKana(w)); S.busy=false; setEnabled(true);
      setNote('あなたの番です。「'+esc(S.need)+'」で始まる単語を入力してください。');
    },650);
  }
  function submit(e){
    if(e) e.preventDefault();
    if(!S.active||S.busy) return;
    var raw=inp.value.trim(); if(!raw) return;
    S.pending=null;
    var r, info=null;
    if(vByWord[raw]){ r=vByWord[raw].r; info={kind:'v',e:vByWord[raw]}; }
    else r=toHira(toKana(raw,true));
    if(!HIRA.test(r)){ setNote('ひらがな・カタカナ・ローマ字で入力してください（漢字は語彙にあるものだけ使えます）。',true); return; }
    if(r.length<2){ setNote('単語は2文字以上必要です。',true); return; }
    if(r[0]!==S.need){ setNote('「'+esc(S.need)+'」で始めてください。「'+esc(r)+'」は「'+esc(r[0])+'」で始まっています。',true); return; }
    if(S.used.has(r)){ setNote('「'+esc(r)+'」はもう使われています。',true); return; }
    if(!opt.trust && !lookup(r)){
      S.pending=r;
      setNote('「'+esc(r)+'」はゲームの辞書にありません。それでも使いますか？ <button type="button" class="g-btn" id="gYes">使う</button><button type="button" class="g-btn" id="gNo">やめる</button>',true);
      $('#gYes').addEventListener('click',function(){ if(S.pending===r) accept(r,null); });
      $('#gNo').addEventListener('click',function(){ S.pending=null; setNote(''); inp.focus(); });
      return;
    }
    accept(r,info);
  }
  function hint(){
    if(!S.active||S.busy) return;
    var x=candidates(S.need), all=x.v.concat(x.d);
    if(!all.length){ prevEl.textContent='ヒントはもうありません。「降参」を押してもいいですよ。'; return; }
    if(!S.hint||S.hint.stage===undefined||!S.hint.word||S.used.has(S.hint.word)){ S.hint={stage:0,word:(x.v.length?x.v:all)[Math.floor(Math.random()*(x.v.length?x.v.length:all.length))]}; }
    var w=S.hint.word, mean=meaningOf(w);
    if(S.hint.stage===0){ prevEl.innerHTML='ヒント：<b>'+esc(w[0])+'＿'.repeat(w.length-1)+'</b>（'+w.length+'文字）'+(mean?' — '+mean:'')+' <i>（もう一度押すと答えが出ます）</i>'; S.hint.stage=1; }
    else { prevEl.innerHTML='ヒントの答え：<b>'+esc(w)+'</b>'+(mean?' — '+mean:''); }
    inp.focus();
  }
  $('#gForm').addEventListener('submit',submit);
  $('#gStart').addEventListener('click',function(){ loadDict(start); });
  $('#gHintBtn').addEventListener('click',hint);
  $('#gGive').addEventListener('click',function(){ if(S.active&&!S.busy) end(false,'降参しました。'); });
  inp.addEventListener('input',function(){
    var v=inp.value; if(/[a-zA-Z]/.test(v)) prevEl.textContent='→ '+toHira(toKana(v,false)); else if(S.hint===0||!S.hint) prevEl.textContent='';
  });
  window.__shiritori={endKana:endKana,toKana:toKana,start:start,state:S,vocab:VOCAB,dictSize:function(){return Object.keys(DICT).length;}};
})();

</script>

    else if(e.key==='Escape') closeK();
  });
  /* nút sidebar: nằm ngay trên ゲーム */
  var kbtn=document.createElement('button'); kbtn.className='side-branch-head kj-btn';
  kbtn.innerHTML='<span class="bt"><b>漢字</b></span>';
  var kwrap=document.createElement('div'); kwrap.className='side-branch'; kwrap.appendChild(kbtn);
  var gwrap=gb.parentNode; nav.insertBefore(kwrap,gwrap);
  function openK(){
    var tp=document.getElementById('topicPanel'); if(tp) tp.classList.remove('show');
    var gp=document.getElementById('gamePanel'); if(gp) gp.classList.remove('show'); gb.classList.remove('active');
    nav.querySelectorAll('.side-item').forEach(function(b){ b.classList.remove('active'); });
    var ctrl=nav.querySelector('.side-ctrl'); if(ctrl) ctrl.style.display='none';
    try{ currentTopic=null; }catch(e){}
    kbtn.classList.add('active'); document.body.classList.remove('side-open');
    page=Math.min(page,PAGES-1); render(); panel.classList.add('show');
  }
  function closeK(){ panel.classList.remove('show'); kbtn.classList.remove('active'); }
  kbtn.addEventListener('click',openK);
  panel.querySelector('#kjClose').addEventListener('click',closeK);
  gb.addEventListener('click',closeK);
  var home=nav.querySelector('.side-item.home'); if(home) home.addEventListener('click',closeK);
  var origSel=selectTopic; selectTopic=function(id){ closeK(); origSel(id); };
})();
</script>


<script>
/* ===== Thanh kéo thu gọn header + tìm kiếm toàn bộ nội dung ===== */
(function(){
  var side=document.getElementById('side');
  if(!side||typeof TOPICS==='undefined') return;
  var header=side.querySelector('header'), nav=side.querySelector('.side-nav');
  if(!header||!nav) return;

  /* ---------- 1) Thanh kéo ---------- */
  var grip=document.createElement('button');
  grip.type='button'; grip.className='hdr-grip';
  grip.title='Kéo lên để ẩn logo & tên app · kéo xuống để hiện lại';
  grip.setAttribute('aria-label','Ẩn/hiện logo và tên ứng dụng');

  var collapsed=false;
  try{ localStorage.removeItem('hdrCollapsed'); }catch(e){}
  var full=function(){ return header.scrollHeight; };
  function setState(c,animate){
    collapsed=c;
    grip.setAttribute('aria-expanded',c?'false':'true');
    try{ localStorage.setItem('hdrCollapsed',c?'1':'0'); }catch(e){}
    header.classList.toggle('dragging',!animate);
    if(c){
      header.style.height=header.getBoundingClientRect().height+'px';
      void header.offsetHeight;
      header.style.height='0px';
    }else{
      header.style.height=full()+'px';
    }
  }
  /* mở thì trả về auto để tự co giãn theo độ rộng sidebar */
  header.addEventListener('transitionend',function(e){
    if(e.propertyName==='height' && !collapsed) header.style.height='auto';
  });
  if(collapsed){ header.classList.add('dragging'); header.style.height='0px'; }
  grip.setAttribute('aria-expanded',collapsed?'false':'true');

  var drag=null;
  grip.addEventListener('pointerdown',function(e){
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add('active');
    drag={y:e.clientY,h:header.getBoundingClientRect().height,full:full(),moved:false,dy:0};
    header.classList.add('dragging');
    header.style.height=drag.h+'px';
  });
  grip.addEventListener('pointermove',function(e){
    if(!drag) return;
    var dy=e.clientY-drag.y; drag.dy=dy;
    if(Math.abs(dy)>3) drag.moved=true;
    if(drag.moved) header.style.height=Math.max(0,Math.min(drag.full,drag.h+dy))+'px';
  });
  function endDrag(e){
    if(!drag) return;
    var d=drag; drag=null; grip.classList.remove('active');
    try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
    if(!d.moved){ header.style.height=d.h+'px'; setState(!collapsed,true); return; }
    var h=parseFloat(header.style.height)||0;
    header.classList.remove('dragging');
    var c=h<d.full*0.5;
    /* thả ở giữa: theo hướng kéo */
    if(Math.abs(d.dy)>6){ c = d.dy<0 ? h<d.full*0.85 : h<d.full*0.15; }
    setState(c,true);
  }
  grip.addEventListener('pointerup',endDrag);
  grip.addEventListener('pointercancel',endDrag);
  grip.addEventListener('click',function(e){ if(e.detail===0) setState(!collapsed,true); }); /* bàn phím */
  window.addEventListener('resize',function(){ if(!collapsed && header.style.height!=='auto') header.style.height='auto'; });

  /* ---------- 2) Ô tìm kiếm ---------- */
  var box=document.createElement('div'); box.className='srch';
  box.innerHTML='<div class="srch-box" role="search">'
    +'<svg class="srch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>'
    +'<input id="sideSearch" type="search" placeholder="検索" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="検索">'
    +'<button type="button" class="srch-clear" aria-label="クリア">&#10005;</button></div>'
    +'<div class="srch-count" aria-live="polite"></div>';
  header.after(box);
  var results=document.createElement('div'); results.className='srch-results'; results.id='srchResults';
  box.after(results);
  var input=box.querySelector('input'), clearBtn=box.querySelector('.srch-clear'), countEl=box.querySelector('.srch-count');

  /* chuẩn hóa: bỏ dấu tiếng Việt, katakana→hiragana, full-width→half-width, không phân biệt hoa/thường */
  function norm(s){
    return String(s==null?'':s).normalize('NFKC').toLowerCase()
      .replace(/[ァ-ヶ]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')
      .replace(/\s+/g,' ').trim();
  }
  function strings(o,out,depth){
    if(o==null||depth>5) return out;
    if(typeof o==='string'){ out.push(o); return out; }
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) strings(o[i],out,depth+1); return out; }
    if(typeof o==='object'){ for(var k in o) if(k!=='level') strings(o[k],out,depth+1); }
    return out;
  }
  function topicName(t){ return t.id.replace(/^\d+\.\s*/,''); }

  var INDEX=null;
  function build(){
    var ix=[];
    TOPICS.forEach(function(t,ti){
      var nm=topicName(t);
      ix.push({k:'t',ti:ti,idx:-1,p:norm(nm+' '+t.title),r:'',m:'',x:'',w:t.title,rd:'',mn:(t.icon?t.icon+' ':'')+nm,tn:''});
      (t.vocab||[]).forEach(function(v,i){
        var w=v.word||'', ws=[w], ms=[v.meaning||'', v.hanviet||''], rs=[v.reading||''];
        if(v.pair) v.pair.forEach(function(q){ ws.push(q.word||''); rs.push(q.reading||''); ms.push(q.meaning||''); });
        var used=[w,v.reading,v.meaning,v.hanviet];
        var rest=strings({a:v.note,b:v.example,c:v.example_reading,d:v.example_meaning,e:v.examples,f:v.chars,g:v.poem,h:v.pair,i:v.pair_label},[],0);
        ix.push({k:'v',ti:ti,idx:i,lv:v.level||'',p:norm(ws.join(' ')),r:norm(rs.join(' ')),m:norm(ms.join(' ')),x:norm(rest.join(' ')),
          w:w,rd:v.reading||'',mn:(v.meaning||'')+(v.hanviet&&v.hanviet!==v.meaning?'  ·  '+v.hanviet:''),tn:nm});
      });
      (t.grammar||[]).forEach(function(g,i){
        ix.push({k:'g',ti:ti,idx:i,p:norm(g.pattern||''),r:'',m:norm(g.usage||''),
          x:norm(strings({a:g.example,b:g.example_reading,c:g.example_meaning},[],0).join(' ')),
          w:g.pattern||'',rd:'',mn:g.usage||'',tn:nm});
      });
      (t.compare||[]).forEach(function(c,i){
        var items=c.items||[];
        ix.push({k:'c',ti:ti,idx:i,
          p:norm((c.label||'')+' '+items.map(function(w){return w.word||'';}).join(' ')),
          r:norm(items.map(function(w){return w.reading||'';}).join(' ')),
          m:norm(items.map(function(w){return w.meaning||'';}).join(' ')),
          x:norm(strings([c.note,items],[],0).join(' ')),
          w:c.label||'',rd:'',mn:items.map(function(w){return w.meaning||'';}).filter(Boolean).join(' / '),tn:nm});
      });
    });
    var gb=document.querySelector('.game-btn');
    if(gb) ix.push({k:'game',ti:-1,idx:-1,p:norm('しりとり shiritori game trò chơi nối từ ゲーム'),r:'',m:'',x:'',w:'しりとり',rd:'',mn:'Trò chơi nối từ',tn:'ゲーム',el:gb});
    return ix;
  }

  var KIND={t:'題',v:'語',g:'文',c:'比',game:'遊'};
  function score(e,q,toks){
    if(e.p===q) return 0;
    if(e.p.indexOf(q)===0) return 1;
    if(e.r===q) return 1;
    if(e.r.indexOf(q)===0) return 2;
    if(e.p.indexOf(q)>=0) return 3;
    if(e.r.indexOf(q)>=0) return 4;
    if(e.m===q) return 4;
    if((' '+e.m).indexOf(' '+q)>=0) return 5;
    if(e.m.indexOf(q)>=0) return 6;
    if(e.x.indexOf(q)>=0) return 8;
    if(toks.length>1){
      var all=e.p+' '+e.r+' '+e.m, ok=true, ok2=true;
      for(var i=0;i<toks.length;i++){ if(all.indexOf(toks[i])<0) ok=false; if((all+' '+e.x).indexOf(toks[i])<0) ok2=false; }
      if(ok) return 7;
      if(ok2) return 9;
    }
    return -1;
  }

  var shown=0, list=[], curKey=null, PAGE=60, curQ='';
  function render(){
    var frag=document.createDocumentFragment();
    for(var i=shown;i<Math.min(list.length,shown+PAGE);i++){
      var e=list[i], b=document.createElement('button'); b.type='button'; b.className='srch-item'; b.dataset.i=i;
      var color='';
      if(e.k==='v'&&typeof LEVEL_MAP!=='undefined'&&LEVEL_MAP[e.lv]) color=LEVEL_MAP[e.lv].color;
      else if(e.k==='g') color='#5B7A6B';
      else if(e.k==='c') color='#8B5CB8';
      b.innerHTML='<span class="srch-tag"'+(color?' style="--c:'+color+'"':'')+'>'+KIND[e.k]+'</span>'
        +'<span class="srch-main"><span class="srch-w">'+escapeHtml(e.w)+'</span>'+(e.rd?'<span class="srch-r">'+escapeHtml(e.rd)+'</span>':'')
        +(e.mn?'<span class="srch-m">'+escapeHtml(e.mn)+'</span>':'')
        +(e.tn?'<span class="srch-t">'+escapeHtml(e.tn)+(e.k==='g'?' · 文法':e.k==='c'?' · 比較':'')+'</span>':'')+'</span>';
      if(curKey===e.k+':'+e.ti+':'+e.idx) b.classList.add('cur');
      frag.appendChild(b);
    }
    var old=results.querySelector('.srch-more'); if(old) old.remove();
    results.appendChild(frag);
    shown=Math.min(list.length,shown+PAGE);
    if(shown<list.length){
      var m=document.createElement('button'); m.type='button'; m.className='srch-more';
      m.textContent='Hiện thêm ('+(list.length-shown)+')'; results.appendChild(m);
    }
  }

  function run(){
    var raw=input.value, q=norm(raw);
    box.classList.toggle('has-q',!!raw);
    curQ=q;
    if(!q){ side.classList.remove('searching'); results.innerHTML=''; countEl.textContent=''; list=[]; shown=0; return; }
    if(!INDEX) INDEX=build();
    var toks=q.split(' ').filter(Boolean), hits=[];
    for(var i=0;i<INDEX.length;i++){
      var s=score(INDEX[i],q,toks);
      if(s>=0) hits.push({e:INDEX[i],s:s,o:i});
    }
    hits.sort(function(a,b){ return a.s-b.s || (a.e.k==='t'?-1:0)-(b.e.k==='t'?-1:0) || a.e.p.length-b.e.p.length || a.o-b.o; });
    list=hits.map(function(h){return h.e;}); shown=0;
    side.classList.add('searching'); results.innerHTML=''; (function(){ var t=results.offsetTop-box.offsetHeight-4; if(side.scrollTop>t) side.scrollTop=Math.max(0,t); })();
    if(!list.length){
      countEl.textContent='';
      results.innerHTML = `<div class="srch-empty">“${escapeHtml(raw.trim())}” が見つかりません。<br>より短いキーワードを試すか、ベトナム語の意味、漢字、または読み方を入力してください。</div>`;
      return;
    }
    countEl.textContent=list.length+' 件';
    render();
  }
  var tmr=0;
  input.addEventListener('input',function(){ clearTimeout(tmr); tmr=setTimeout(run,110); });
  input.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ input.value=''; run(); }
    else if(e.key==='Enter'){ clearTimeout(tmr); run(); var f=results.querySelector('.srch-item'); if(f) f.click(); }
    else if(e.key==='ArrowDown'){ var f2=results.querySelector('.srch-item'); if(f2){ e.preventDefault(); f2.focus(); } }
  });
  results.addEventListener('keydown',function(e){
    var cur=document.activeElement; if(!cur||!cur.classList.contains('srch-item')) return;
    if(e.key==='ArrowDown'&&cur.nextElementSibling&&cur.nextElementSibling.classList.contains('srch-item')){ e.preventDefault(); cur.nextElementSibling.focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(cur.previousElementSibling) cur.previousElementSibling.focus(); else input.focus(); }
  });
  clearBtn.addEventListener('click',function(){ input.value=''; run(); input.focus(); });

  /* ---------- 3) Nhấp kết quả → nhảy tới đúng vị trí ---------- */
  function focusCard(c){
    var go=function(){ c.scrollIntoView({block:'center'}); };
    go(); setTimeout(go,160); setTimeout(go,520);
    c.classList.remove('srch-hit'); void c.offsetWidth; c.classList.add('srch-hit');
    setTimeout(function(){ c.classList.remove('srch-hit'); },3600);
  }
  function locate(sel){
    var tries=0;
    (function wait(){
      var c=document.querySelector('#itemContainer '+sel);
      if(c){ focusCard(c); return; }
      if(++tries<240) requestAnimationFrame(wait);
    })();
  }
  results.addEventListener('click',function(ev){
    var more=ev.target.closest('.srch-more'); if(more){ render(); return; }
    var b=ev.target.closest('.srch-item'); if(!b) return;
    var e=list[+b.dataset.i]; if(!e) return;
    results.querySelectorAll('.srch-item.cur').forEach(function(x){ x.classList.remove('cur'); });
    b.classList.add('cur'); curKey=e.k+':'+e.ti+':'+e.idx;
    if(e.k==='game'){ e.el.click(); document.body.classList.remove('side-open'); return; }
    var t=TOPICS[e.ti];
    selectTopic(t.id);
    if(e.k==='g'){ var tg=document.getElementById('tabGrammar'); if(tg) tg.click(); }
    if(e.k==='t'){ return; }
    locate('.item-card[data-idx="'+e.idx+'"]');
  });
})();
</script>
</body>
