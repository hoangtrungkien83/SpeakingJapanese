function hkRec(k,kind,ok){var ix='okv'.indexOf(kind),e=S.hk[k.c];if(!e)e=S.hk[k.c]={s:[0,0,0],l:[0,0,0],w:0};
if(ok){if(e.l[ix]!==B.run){e.s[ix]=Math.min(2,e.s[ix]+1);e.l[ix]=B.run}}else{e.s[ix]=0;e.w=(e.w||0)+1}
var h=S.hs[kind]||(S.hs[kind]=[0,0]);h[1]++;if(ok)h[0]++}

/* ---- chọn chữ / kiểu hỏi / đáp án nhiễu ---- */
function hkLevels(){if(B.mode=='tower'){var f=B.fl;return f<=2?['n5','n4']:f<=4?['n5','n4','n3']:f<=6?['n5','n4','n3','n2']:['n5','n4','n3','n2','n1']}
return B.lv=='all'||B.lv=='weak'?['n5','n4','n3','n2','n1']:[B.lv]}
function hkWeight(k){var e=S.hk[k.c];if(!e)return 2;if(hkMast(k))return .3;return 1+Math.min(4,e.w||0)}
function hkPick(again){var lvs=hkLevels(),pool=B.lv=='weak'?B.wk.map(function(c){return KJM[c]}).filter(Boolean):KJD,by={};
pool.forEach(function(k){if(lvs.indexOf(k.l)<0)return;if(B.pk!='mix'&&!hkOk(k,B.pk))return;if(B.recent.indexOf(k.c)>=0)return;(by[k.l]=by[k.l]||[]).push(k)});
var ks=Object.keys(by);if(!ks.length){if(again||!B.recent.length)return null;B.recent=[];return hkPick(1)}
var a=by[ks[Math.floor(Math.random()*ks.length)]],tot=0,w=a.map(function(k){var x=hkWeight(k);tot+=x;return x}),r=Math.random()*tot;
for(var i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]}
function hkKind(k){var ks=B.pk=='mix'?['o','k','v'].filter(function(x){return hkOk(k,x)}):[B.pk];if(ks.length==1)return ks[0];
var e=S.hk[k.c],tot=0,w=ks.map(function(x){var h=S.hs[x],acc=h&&h[1]?h[0]/h[1]:.5,v=Math.max(.25,1.25-acc);if(e&&e.s['okv'.indexOf(x)]>=2)v*=.4;tot+=v;return v}),r=Math.random()*tot;
for(var i=0;i<ks.length;i++){r-=w[i];if(r<=0)return ks[i]}return ks[0]}
function hkSim(a,b){a=String(a);b=String(b);var n=0;while(n<a.length&&n<b.length&&a.charAt(n)===b.charAt(n))n++;return n*2+(a.length===b.length?1:0)-Math.abs(a.length-b.length)*.3}
function hkDis(t,kind,n){var tl=hkLab(t,kind),near=B.mode=='tower'?B.fl>=4:true,c=[];
KJD.forEach(function(k){if(k.c===t.c||!hkOk(k,kind)||hkShare(t,k,kind))return;
c.push([Math.random()*1.5+(k.l===t.l?2:0)+(near?hkSim(tl,hkLab(k,kind))*1.2:0),k])});
c.sort(function(x,y){return y[0]-x[0]});
var out=[],used={};used[tl]=1;for(var i=0;i<c.length&&out.length<n;i++){var lb=hkLab(c[i][1],kind);if(used[lb])continue;used[lb]=1;out.push(c[i][1])}return out}
function hkMake(k,kind,rev,n){var d=hkDis(k,kind,n-1);return{kj:k,kind:kind,rev:rev,opts:d.concat([k]).sort(rnd)}}
function hkRevQ(){return B.mode=='tower'?(B.fl>=6&&Math.random()<(B.fl>=8?.4:.3)):Math.random()<.2}
function hkQ(){var q=null,rq=B.rq;
for(var i=0;i<rq.length;i++){if(rq[i].due<=B.i&&KJM[rq[i].c]){q=rq.splice(i,1)[0];break}}
var k,kind,rev;
if(q){k=KJM[q.c];kind=q.kind;rev=q.rev}else{k=hkPick();if(!k){B.q=null;return}kind=hkKind(k);rev=hkRevQ()}
var n=B.mode=='tower'&&B.fl>=7?6:4;B.q=hkMake(k,kind,rev,n);B.ans=null;B.ok=null;B.qt0=Date.now();
B.sec=B.mode=='tower'?HK_SEC:0;B.dl=B.qt0+B.sec*1000;
B.recent.push(k.c);if(B.recent.length>25)B.recent.shift()}

/* ---- vào chơi ---- */
function hkStart(mode,cfg){abort();cfg=cfg||{};var tw=mode=='tower';S.hkn=(S.hkn||0)+1;
var me={kind:'hak',mode:mode,pk:tw?'mix':(cfg.k||'mix'),lv:tw?'all':(cfg.l||'all'),wk:cfg.wk||[],run:S.hkn,fl:1,fc:0,lives:HK_LIVES,i:0,right:0,wrong:0,rq:[],recent:[],miss:{},st:{o:[0,0],k:[0,0],v:[0,0]},q:null,ans:null,ok:null,act:0,t0:Date.now(),fin:0,over:null,won:0,banner:'',el:0};
if(!tw&&me.lv=='weak'&&!me.wk.length)me.wk=hkWeak().map(function(k){return k.c});
B=me;hkQ();if(!B.q){abort();return}
if(tw){me.tid=setInterval(function(){if(B!==me){clearInterval(me.tid);return}if(me.fin||me.over||!me.q||me.ans!=null)return;
var left=(me.dl-Date.now())/1000;if(left<=0){hakAns(-1);draw();return}
var a=document.getElementById('kgTm'),b=document.getElementById('kgTb'),w=document.getElementById('kgTmw');
if(a)a.textContent=fmt(left);if(b)b.style.width=(left/me.sec*100)+'%';if(w)w.classList.toggle('low',left<me.sec*.3)},200)}
save()}
function hakAns(j){if(!B||B.kind!='hak'||B.ans!=null||B.fin||B.over||!B.q)return;var q=B.q,ok=j>=0&&q.opts[j]===q.kj;
B.ans=j;B.ok=ok;B.leftA=Math.max(0,(B.dl-Date.now())/1000);B.act+=Date.now()-B.qt0;B.banner='';tick();B.i++;
var st=B.st[q.kind];st[1]++;if(ok){st[0]++;B.right++;if(B.mode=='tower')B.fc++}
else{B.wrong++;B.miss[q.kj.c]=1;if(B.mode=='tower')B.lives--;if(B.rq.length<12)B.rq.push({c:q.kj.c,kind:q.kind,rev:q.rev,due:B.i+3+Math.floor(Math.random()*3)})}
hkRec(q.kj,q.kind,ok);save()}
function hakNext(){if(!B||B.kind!='hak'||B.ans==null||B.fin||B.over)return;
if(B.mode=='tower'){
if(B.lives<=0){hkEnd('lose');return}
if(B.fc>=HK_FLOOR){var cl=B.fl;B.fc=0;if(cl>(S.hkb||0)){S.hkb=cl;S.xp+=10}B.fl++;
var up={3:'N3',5:'N2',7:'N1'}[B.fl],gl=B.lives<HK_LIVES;if(gl)B.lives++;
B.banner='⬆ Qua tầng '+cl+'! Lên tầng '+B.fl+(gl?' · +1 mạng':'')+(up?' · mở thêm chữ '+up:'')+(B.fl>=7?' · 6 đáp án':'');
save();head();
if(cl>=HK_WIN&&!B.won){B.won=1;hkWin();return}}}
hkQ();if(!B.q)hkEnd('done')}
function hkWin(){var first=!S.st['hak|hak'];S.st['hak|hak']=1;B.first=first;B.gain=first?300:0;if(first)S.xp+=300;
B.el=Math.max(1,Math.round(B.act/1000));var key='hak|hak',R=recs(),old=R[key];B.prev=old||null;
if(!old||B.el<old.sec){R[key]={sec:B.el,n:B.i,name:who(),id:(window.FUSOU_USER&&window.FUSOU_USER.id)||'',date:new Date().toLocaleDateString('sv-SE')};B.rec=old?'beat':'first';try{localStorage.setItem(RK_KEY,JSON.stringify(R))}catch(e){}}
award();save();head();B.over='win'}
function hkEnd(why){if(B.fin)return;B.fin=1;B.over=why;if(B.tid)clearInterval(B.tid);B.el=Math.max(1,Math.round(B.act/1000));save();head()}
function hakKey(e){if(!B||B.kind!='hak')return false;var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return false;
if((e.key===' '||e.key==='Spacebar'||e.key==='Enter')&&B.ans!=null&&!B.fin&&!B.over&&tg!=='BUTTON'){e.preventDefault();hakNext();draw();gtop();return true}
if(B.ans==null&&!B.over&&!B.fin&&B.q&&/^[1-6]$/.test(e.key)&&+e.key<=B.q.opts.length){e.preventDefault();hakAns(+e.key-1);draw();return true}
return false}

/* ---- giao diện ---- */
function hkRows(k,hit){var r=function(key,lab,txt){return'<div class="hk-r'+(hit==key?' hit':'')+'"><span>'+lab+'</span><b>'+esc(txt||'—')+'</b></div>'};
return r('o','音 On',k.on.join('・'))+r('k','訓 Kun',k.kun.map(hkRdc).join('・'))+r('v','Hán Việt',k.hv)}
function hkCard(k,hit,cls){return'<div class="hk-card'+(cls?' '+cls:'')+'"><div class="hk-kc"><b class="jp">'+esc(k.c)+'</b><i>'+k.l.toUpperCase()+'</i></div><div class="hk-rows">'+hkRows(k,hit)+'</div></div>'}
function hkEx(k){var a=(HKW[k.c]||[]).slice().sort(function(x,y){return Math.abs(x.w.length-2)-Math.abs(y.w.length-2)}).slice(0,2);
return a.length?'<ul class="hk-ex">'+a.map(function(x){return'<li><b class="jp">'+esc(x.w)+'</b>'+(x.r?' <span class="kg-rd">'+esc(x.r)+'</span>':'')+' — '+esc(String(x.m).split('\n')[0])+'</li>'}).join('')+'</ul>':''}
function hkFb(q){var ok=B.ok,k=q.kj,ch=B.ans>=0?q.opts[B.ans]:null;
var o='<div class="kg-fb hk-fb"><div class="kg-fb-h '+(ok?'ok':'bad')+'">'+(ok?'✔ Chính xác':B.ans<0?'⏱ Hết giờ':'✘ Chưa đúng')+'</div>'+hkCard(k,q.kind)+hkEx(k);
if(q.kind=='o'&&k.on.length){var sm=(HKON[k.on[0]]||[]).filter(function(x){return x.c!==k.c}).slice(0,8);if(sm.length)o+='<div class="kg-sub" style="margin:6px 0 0">Cùng âm On '+esc(k.on[0])+': <b class="jp">'+esc(sm.map(function(x){return x.c}).join(' '))+'</b></div>'}
if(!ok&&ch)o+='<div class="kg-fb-h bad">✘ Bạn đã chọn '+(q.rev?'chữ':'<b>'+esc(hkLab(ch,q.kind))+'</b> — đó là '+HK_KL[q.kind]+' của chữ')+':</div>'+hkCard(ch,q.kind,'bad');
var rest=q.opts.filter(function(x){return x!==k&&x!==ch});
if(rest.length)o+='<details'+(ok?'':' open')+'><summary>Các đáp án còn lại</summary>'+rest.map(function(x){return hkCard(x,q.kind)}).join('')+'</details>';
return o+'</div>'}
function hkOpts(q){return'<div class="kg-opts hk-o'+(q.opts.length>4&&q.rev?' o6':'')+'">'+q.opts.map(function(x,j){var k='';if(B.ans!=null){if(x===q.kj)k='ok';else if(j==B.ans)k='bad'}
var inner=q.rev?'<span class="jp">'+esc(x.c)+'</span>'+(B.ans!=null?'<small>'+esc(hkLab(x,q.kind))+'</small>':''):esc(hkLab(x,q.kind));
return'<button class="'+k+'" data-o="'+j+'"'+(B.ans!=null?' disabled':'')+'>'+'<i class="kg-nk">'+(j+1)+'</i>'+inner+'</button>'}).join('')+'</div>'}
function hkHearts(){return new Array(Math.max(0,B.lives)+1).join('❤')+new Array(Math.max(0,HK_LIVES-B.lives)+1).join('♡')}
function hkPracLab(){return({mix:'Hỗn hợp',o:'On',k:'Kun',v:'Hán Việt'})[B.pk]+' · '+(B.lv=='all'?'Tất cả cấp':B.lv=='weak'?'Chữ yếu':B.lv.toUpperCase())}
function playHak(){if(B.over)return hakEnd();var q=B.q,tw=B.mode=='tower',o='';
if(tw){var left=B.ans!=null?(B.leftA||0):Math.max(0,(B.dl-Date.now())/1000),pct=left/B.sec*100;
o+='<div class="kg-bh"><span class="kg-bn">白澤 · Tầng '+B.fl+' <span class="hk-lv">'+hkHearts()+'</span></span><div class="kg-tmw'+(pct<30?' low':'')+'" id="kgTmw"><b id="kgTm">'+fmt(left)+'</b></div></div><div class="kg-tbar"><i id="kgTb" style="width:'+pct+'%"></i></div>'
+'<div class="kg-hud"><span>Tầng '+B.fl+' · '+B.fc+' / '+HK_FLOOR+' chữ</span><div class="kg-hp"><i style="width:'+(B.fc/HK_FLOOR*100)+'%"></i></div><span>'+B.right+' đúng</span></div>'}
else o+='<div class="kg-hud"><span>練習 · '+hkPracLab()+'</span><div class="kg-hp"><i style="width:'+(B.i?B.right/B.i*100:0)+'%"></i></div><span>'+B.right+' / '+B.i+' đúng</span></div>';
o+='<div class="kg-panel'+(B.ok===false?' kg-shake':'')+'">'+(B.banner?'<div class="hk-banner">'+esc(B.banner)+'</div>':'')
+'<div class="kg-sub">'+(q.rev?'Chọn chữ Hán có '+HK_KL[q.kind]+':':'Chữ này có '+HK_KL[q.kind]+' là gì?')+'</div><div class="kg-big'+(q.rev?' hk-lab':'')+'">'+esc(q.rev?hkLab(q.kj,q.kind):q.kj.c)+'</div>'+hkOpts(q);
if(B.ans!=null)o+=hkFb(q)+'<button class="kg-btn" data-act="hnext" style="margin-top:12px">'+(tw&&B.lives<=0?'結果 Xem kết quả':'次へ')+' → <small>hoặc nhấn Space</small></button>';
if(!tw)o+='<button class="kg-btn ghost" data-act="hend" style="margin-top:8px">Kết thúc luyện tập</button>';
return o+'</div>'}
function hakEnd(){var st=B.st,ac=function(k){var s=st[k];return s[1]?Math.round(s[0]/s[1]*100)+'% ('+s[0]+'/'+s[1]+')':'–'};
var stats='<p class="kg-sub" style="text-align:center">On: <b>'+ac('o')+'</b> · Kun: <b>'+ac('k')+'</b> · Hán Việt: <b>'+ac('v')+'</b></p>',tw=B.mode=='tower';
if(B.over=='win')return'<div class="kg-panel kg-win" style="text-align:center"><div class="kg-big" style="color:var(--accent)">白澤 · 降伏</div><p class="kg-sub" style="text-align:center;margin-top:0">Bạch Trạch đã khuất phục · Ấn thử thách về tay bạn</p><div class="kg-sealbox big got">'+hkSeal()+'</div><p><b>Ấn Bạch Trạch</b>'+(B.first?' · +'+B.gain+' XP':' · (đã nhận từ trước)')+'</p>'
+'<div class="kg-tbx"><span>⏱ Qua '+HK_WIN+' tầng trong <strong>'+fmt(B.el)+'</strong> · '+B.i+' câu<br>'+(B.rec=='first'?'🏆 <strong>Kỷ lục mới!</strong> '+esc(who()):B.rec=='beat'?'🏆 <strong>Phá kỷ lục!</strong> '+esc(who())+' phá '+fmt(B.prev.sec)+' của '+esc(B.prev.name):(function(){var r=recGet({id:'hak'},'hak');return r?recTxt(r,r.n):''})())+'</span></div>'+stats
+'<button class="kg-btn" data-act="hcont">登る Leo tiếp (không giới hạn)</button><button class="kg-btn ghost" data-act="menu">Về Bạch Trạch</button><button class="kg-btn ghost" data-act="map">Về bản đồ</button></div>';
var ms=Object.keys(B.miss).filter(function(c){return KJM[c]});
return'<div class="kg-panel kg-lose" style="text-align:center"><div class="kg-big" style="color:var(--accent)">'+(tw?'挑戦失敗 · Hết mạng':'練習 · Kết quả')+'</div>'
+'<p>'+(tw?'Bạn dừng ở <b>tầng '+B.fl+'</b> · đã qua '+(B.fl-1)+' tầng · ':'')+'<b>'+B.right+'</b> / '+B.i+' câu đúng</p>'+stats+'<p>Thời gian trả lời: '+fmt(B.el)+'</p>'
+(tw?'<p>Bạch Trạch lắc đầu: chữ chưa thuộc thì tháp chưa mở. Ôn lại rồi leo tiếp.</p>':'')
+(ms.length?'<div style="text-align:left"><h4 class="kg-h">Chữ cần ôn ('+ms.length+')</h4>'+ms.slice(0,12).map(function(c){return hkCard(KJM[c],'')}).join('')+(ms.length>12?'<p class="kg-sub">… và '+(ms.length-12)+' chữ nữa — xem trong mục Chữ yếu.</p>':'')+'</div>':'')
+(tw?'<button class="kg-btn" data-act="hakt">もう一度 Leo lại</button>':'')
+(ms.length?'<button class="kg-btn'+(tw?' ghost':'')+'" data-act="hakw">復習 Ôn '+ms.length+' chữ vừa sai</button>':'')
+'<button class="kg-btn ghost" data-act="menu">Về Bạch Trạch</button></div>'}
function hkSeg(key,arr,cur){return'<div class="hk-seg">'+arr.map(function(a){return'<button class="'+(cur==a[0]?'on':'')+'" data-hk="'+key+':'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>'}
function hakChapter(){var g=!!S.st['hak|hak'],r=recGet({id:'hak'},'hak'),m=hkMastN(),tot=KJD.length,H=S.hkc,hs=S.hs,weak=hkWeak().length,cnt=hkCount(H.k,H.l),sy=STY(),hst=(sy&&sy.hak)||{};

if(hst.setup)o+='<div class="kg-story">'+paras(hst.setup)+'</div>';
o+='<div class="kg-story"><p>Đây là màn thử thách tuỳ chọn: muốn nhận ấn của ông, bạn phải leo hết '+HK_WIN+' tầng tháp của ông.</p><p>Tầng thấp chỉ có chữ N5–N4. Mỗi câu chỉ có '+HK_SEC+' giây (đồng hồ tạm dừng khi bạn xem lại đáp án). Càng lên cao chữ càng khó: đáp án nhiễu càng gần giống, từ tầng 7 có tới 6 lựa chọn, và có cả câu đảo chiều — cho âm đọc, chọn đúng mặt chữ. Qua mỗi tầng được hồi 1 mạng.</p></div>';
o+='<div class="kg-sx'+(g?' got':'')+'" style="--c:'+HK_COL+'"><div class="kg-sx-seal">'+(g?'<div class="kg-sealbox got">'+hkSeal()+'</div>':'<div class="kg-ghost"><span>白澤</span><small>瑞</small></div>')+'</div>'

+'<div class="kg-sx-act"><button class="kg-btn" data-act="hakt">挑戦 Leo tháp<small>'+HK_LIVES+' mạng · '+HK_SEC+' giây / câu</small></button></div></div>';
if(g&&hst.resolve)o+='<div class="kg-story kg-story2">'+paras(hst.resolve)+'</div>';
if(g&&hst.moral)o+='<div class="kg-pact"><b>誓</b><span>'+esc(hst.moral)+'</span></div>';
o+='<h3 class="kg-h kg-qh">Tiến độ hán tự</h3><p class="kg-sub">Đã thuộc <b>'+m+' / '+tot+'</b> chữ (đúng cả On, Kun, Hán Việt ở 2 lượt chơi khác nhau).</p><div class="hk-prog"><i style="width:'+(tot?m/tot*100:0)+'%"></i></div><p class="kg-sub">Tỉ lệ đúng · On '+ac('o')+' · Kun '+ac('k')+' · Hán Việt '+ac('v')+'</p>';
o+='<h3 class="kg-h kg-qh">練習 Luyện tập</h3><p class="kg-sub">Không giới hạn mạng, không đồng hồ. Câu sai sẽ quay lại sau vài câu. Chữ hay sai được ưu tiên.</p>'
+hkSeg('k',[['mix','Hỗn hợp'],['o','On 音'],['k','Kun 訓'],['v','Hán Việt']],H.k)
+hkSeg('l',[['n5','N5'],['n4','N4'],['n3','N3'],['n2','N2'],['n1','N1'],['all','Tất cả'],['weak','Chữ yếu ('+weak+')']],H.l)
+'<button class="kg-btn" data-act="hakp"'+(cnt?'':' disabled')+'>練習 Bắt đầu luyện<small>'+cnt+' chữ phù hợp</small></button></div>';
return o}
function hkShuin(){var g=!!S.st['hak|hak'];return'<h3 class="kg-h kg-lh" style="--c:'+HK_COL+'"><span>白澤</span>任意 · Tháp Bạch Trạch<small>'+(g?'✔':'chưa')+'</small></h3><div class="kg-stamps"><div class="kg-book"><div class="kg-sealbox'+(g?' got':'')+'">'+(g?hkSeal():'<div class="kg-ghost"><span>白澤</span><small>瑞</small></div>')+'</div><b>漢字 · On · Kun · Hán Việt</b><div class="kg-sub" style="margin:2px 0 0;font-size:calc(12px*var(--fs,1))">Tầng cao nhất '+(S.hkb||0)+' · thuộc '+hkMastN()+' / '+KJD.length+' chữ</div></div></div>'}

function play(){return B.kind=='col'?playCol():B.kind=='hak'?playHak():playBoss()}

/* ================= TAB 2 · SỔ ẤN ================= */
function shuin(){var o='<h2 class="kg-h">朱印 · Sổ ấn</h2><p class="kg-sub">Mỗi chủ đề thách đấu thành công cho một ấn. Đủ ấn của một cấp là qua chặng và nhận dấu son.</p><div class="kg-pacts">'+pacts()+'</div>';
LS.forEach(function(l){var ss=stations(l);if(!ss.length)return;var g=ss.filter(function(x){return got(x.t,l)}).length;
o+='<h3 class="kg-h kg-lh" style="--c:'+LC[l]+'"><span>'+LV[l][0]+'</span>'+l.toUpperCase()+' · '+esc(bossInfo(l).name)+'<small>'+g+' / '+ss.length+' ấn</small></h3><div class="kg-stamps">'
+ss.map(function(x){var gt=got(x.t,l);return'<div class="kg-book"><div class="kg-sealbox'+(gt?' got':'')+'">'+(gt?seal(ch(x.t),l):ghost(ch(x.t),l))+'</div><b>'+esc(x.t.title)+'</b><div class="kg-sub" style="margin:4px 0 0">'+colN(x)+' / '+x.a.length+' từ'+(gt?' · ✔':'')+'</div><div class="kg-sub" style="margin:2px 0 0;font-size:calc(12px*var(--fs,1))">'+recLine(x.t,l,x.a.length)+'</div></div>'}).join('')+'</div>'});
var fg=endOpen()||!!S.st['fin|fin'];o+='<h3 class="kg-h kg-lh" style="--c:var(--accent)"><span>九尾</span>終章 · Cửu Vĩ Hồ đồng hành<small>'+(fg?'✔':'chưa')+'</small></h3><div class="kg-stamps"><div class="kg-book"><div class="kg-sealbox'+(fg?' got':'')+'">'+(fg?finSeal():'<div class="kg-ghost"><span>九尾</span><small>妖</small></div>')+'</div><b>Phần thưởng cuối hành trình</b><div class="kg-sub" style="margin:2px 0 0;font-size:calc(12px*var(--fs,1))">'+(fg?'Hồ ly đã đi cùng bạn':'Nhận đủ 5 ấn N5 → N1 để gặp')+'</div></div></div>';
o+='<h3 class="kg-h kg-lh" style="--c:#7A5CD1"><span>四妖</span>任意 · Tiểu yêu quái<small>'+ykN()+' / '+YK.length+'</small></h3><div class="kg-stamps">'+YK.map(function(q){var g=ykGot(q.id),r=recGet({id:q.id},'yk');return'<div class="kg-book"><div class="kg-sealbox'+(g?' got':'')+'">'+ykStamp(q,g)+'</div><b>'+esc(q.ja)+'</b><div class="kg-sub" style="margin:4px 0 0">'+esc(q.topic)+(g?' · ✔':'')+'</div><div class="kg-sub" style="margin:2px 0 0;font-size:calc(12px*var(--fs,1))">'+(r?recTxt(r,r.n||YK_N):'🏆 Chưa có kỷ lục')+'</div></div>'}).join('')+'</div>';
o+=hkShuin();return o+'<h3 class="kg-h kg-lh" style="--c:var(--ink)">称号 · Huy hiệu</h3><div class="kg-badges">'+BG.map(function(b){return'<span class="kg-bd'+(S.b[b[0]]?' on':'')+'">'+b[1]+' · '+b[2]+'</span>'}).join('')+'</div>'}

/* ================= TAB 3 · TỪ VỰNG (đã thu thập) ================= */
function none(){return'<p class="kg-sub">Chưa có từ vựng cấp '+S.lv.toUpperCase()+'.</p>'}
function zukan(){var L=stations(S.lv);if(!L.length)return none();if(zt>=L.length)zt=0;var o0=L[zt],c=colN(o0);
var o='<h2 class="kg-h">図鑑 · Từ vựng '+S.lv.toUpperCase()+'</h2><p class="kg-sub">Đã thu thập '+c+' / '+o0.a.length+' từ của chủ đề này. Từ mới được mở khi thu thập ở màn Hành trình.</p>'
+'<select class="kg-sel" id="kgZ">'+L.map(function(x,i){return'<option value="'+i+'"'+(i==zt?' selected':'')+'>'+esc(x.t.title)+' ('+colN(x)+'/'+x.a.length+')</option>'}).join('')+'</select><div class="kg-grid">';
o0.a.forEach(function(a,i){o+=col(a)?'<button class="kg-tile" style="--c:'+LC[S.lv]+'" data-i="'+i+'">'+esc(a.w)+'<small>✔ đã thu thập</small></button>':'<div class="kg-tile lock">？<small>'+S.lv.toUpperCase()+'</small></div>'});
o+='</div>';if(sel!=null&&o0.a[sel]&&col(o0.a[sel])){var a=o0.a[sel];o+='<div class="kg-panel"><div class="kg-big">'+esc(a.w)+'</div><div class="kg-rd">'+esc(a.r)+' <button class="kg-btn ghost" style="width:auto;padding:2px 10px;margin:0" data-sp="'+esc(a.w)+'">🔊</button></div>'+(a.h?'<span class="kg-hv">Hán Việt: '+esc(a.h)+'</span>':'')+'<div><b>'+esc(a.m)+'</b></div>'+(a.e?'<div class="kg-ex">'+esc(a.e)+'<span>'+esc(a.em)+'</span></div>':'')+'</div>'}return o}

/* ================= TAB 4 · LƯU ================= */
function data(){return'<h2 class="kg-h">保存 · Sao lưu tiến độ</h2><p class="kg-sub">Tiến độ lưu trong trình duyệt này'+(window.FUSOU_USER?', riêng cho <b>'+esc(window.FUSOU_USER.name)+'</b>':'')+'. Muốn chuyển máy: sao chép mã bên dưới, dán vào máy kia rồi bấm Nhập.</p><textarea class="kg-ta" id="kgTa">'+esc(JSON.stringify(S))+'</textarea><button class="kg-btn" data-act="imp">Nhập mã này</button><button class="kg-btn ghost" data-act="rst">Xóa toàn bộ tiến độ</button><div class="kg-sub" id="kgMsg" style="margin-top:8px"></div>'}

/* ================= KHUNG CHÍNH ================= */
function draw(){var T=[['map','地図','Hành trình'],['shuin','朱印','Sổ ấn'],['zukan','図鑑','Từ vựng'],['data','保存','Lưu']];
document.getElementById('kgNav').innerHTML=T.map(function(t){return'<button class="'+(view==t[0]?'on':'')+'" data-v="'+t[0]+'"><b>'+t[1]+'</b><small>'+t[2]+'</small></button>'}).join('');
document.getElementById('kgLv').innerHTML=view=='zukan'?'<span>Cấp độ</span>'+LS.map(function(l){return'<button class="'+(S.lv==l?'on':'')+'" data-l="'+l+'">'+l.toUpperCase()+'</button>'}).join(''):'';
head();
var inPlay=!!B&&view=='map'&&TP.length>0;
if(inPlay){PV.innerHTML=play()+(B.over||B.fin||(B.kind=='col'&&B.i>=B.q.length)?'':'<p class="kg-keyhint">Phím <b>1</b>–<b>'+((B.kind=='hak'?(B.q&&B.q.opts.length):4)||4)+'</b> chọn đáp án · <b>Space</b>/<b>Enter</b> sang câu sau · <b>Esc</b> thoát</p>');
PL.classList.add('on');if(B.ans==null||B.over||B.fin)PL.scrollTop=0;var f=document.activeElement;if(f&&f.blur&&PL.contains(f))f.blur();return}
PL.classList.remove('on');
V.innerHTML=view=='data'?data():!TP.length?'<p class="kg-sub">Chưa có dữ liệu từ vựng.</p>':view=='map'?(nd?chapter():mapv()):view=='shuin'?shuin():zukan()}
/* mở game → tự lướt thẳng tới bản đồ (cùng cách focusPic lướt tới ảnh quái thú) */
function focusMap(){var go=function(){var m=V.querySelector('.kg-map');if(!m)return;var rr=root.getBoundingClientRect(),mr=m.getBoundingClientRect(),t=mr.top-rr.top+root.scrollTop-12;root.scrollTo({top:Math.max(0,t),behavior:'smooth'})};
requestAnimationFrame(go);Array.prototype.forEach.call(V.querySelectorAll('.kg-map img'),function(im){if(!im.complete)im.addEventListener('load',go,{once:true})})}
function open(){build();hkBuild();root.classList.add('on');document.body.style.overflow='hidden';draw();gtop();if(view=='map'&&!B&&!nd)focusMap()}
function close(){abort();PL.classList.remove('on');root.classList.remove('on');document.body.style.overflow=''}
var sf=document.querySelector('.side-foot');if(sf){var sb=document.createElement('button');sb.type='button';sb.className='kg-open kg-side';sb.innerHTML='<span class="kb-seal" aria-hidden="true">朱</span><span class="kb-ot"><b>朱印帖 · Game を始める</b><small>Bắt đầu hành trình ôn từ</small></span>';sf.insertBefore(sb,sf.firstChild);
var ct=document.createElement('div');ct.className='kg-contrast';ct.innerHTML='<button type="button" class="ct-dot" aria-label="コントラスト" title="コントラスト"></button><div class="ct-body"><span>コントラスト</span><button type="button" data-c="soft">やさしい</button><button type="button" data-c="mid">ふつう</button><button type="button" data-c="hi">くっきり</button></div>';document.body.appendChild(ct);
var setC=function(c){document.documentElement.setAttribute('data-contrast',c);try{localStorage.setItem('fusou_contrast',c)}catch(e){}Array.prototype.forEach.call(ct.querySelectorAll('.ct-body button'),function(b){b.classList.toggle('on',b.dataset.c===c)})};
var ctT=0,ctOpen=function(){ct.classList.add('open');ctRe();ctPos()},ctClose=function(){clearTimeout(ctT);ct.classList.remove('open')},ctRe=function(){clearTimeout(ctT);ctT=setTimeout(ctClose,10000)};
var tsw=document.querySelector('.theme-switch');
var ctPos=function(){var r=(tsw||sf).getBoundingClientRect(),vw=window.innerWidth;ct.classList.toggle('away',r.width===0||r.right<=8||r.left>=vw);var w=ct.classList.contains('open')?(ct.querySelector('.ct-body').offsetWidth+30):22,l=r.right+10;if(l+w>vw-8)l=Math.max(8,vw-w-8);ct.style.setProperty('--ct-l',l+'px')};
ct.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.classList.contains('ct-dot')){ct.classList.contains('open')?ctClose():ctOpen();return}setC(b.dataset.c);ctRe()};
ct.addEventListener('mouseenter',function(){clearTimeout(ctT)});ct.addEventListener('mouseleave',function(){if(ct.classList.contains('open'))ctRe()});
window.addEventListener('resize',ctPos);
if(window.ResizeObserver){var ro=new ResizeObserver(ctPos);ro.observe(sf.closest('.side')||sf)}
new MutationObserver(ctPos).observe(document.body,{attributes:true,attributeFilter:['class']});
var sd=sf.closest('.side');if(sd)sd.addEventListener('transitionend',ctPos);
new MutationObserver(function(){if(document.documentElement.getAttribute('data-theme')==='dark')ctOpen();else ctClose();ctPos()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
var cc='soft';try{cc=localStorage.getItem('fusou_contrast')||'soft'}catch(e){}setC(cc);ctPos();setTimeout(ctPos,600)}
document.addEventListener('fusou:login',function(e){setUser(e.detail)});
document.addEventListener('fusou:logout',function(){setUser(null)});
document.addEventListener('fusou:story',function(){if(root.classList.contains('on'))draw()});
if(window.FUSOU_USER)setUser(window.FUSOU_USER);
Array.prototype.forEach.call(document.querySelectorAll('.kg-open'),function(el){el.onclick=open});
document.getElementById('kgClose').onclick=close;
document.getElementById('kgPlayX').onclick=leave;
document.addEventListener('keydown',function(e){if(!root.classList.contains('on'))return;if(e.key==='Escape'){if(B)leave();else close()}
else if(hakKey(e)){}
else if(B&&(B.kind=='col'||B.kind=='boss')&&!B.fin&&B.ans==null&&B.opt&&B.q[B.i]&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-4]$/.test(e.key)&&B.opt[+e.key-1]&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();B.ans=+e.key-1;ansr(B.opt[B.ans].k==B.q[B.i].a.k)}
else if((e.key===' '||e.key==='Enter')&&B&&(B.kind=='col'||B.kind=='boss')&&!B.fin&&B.ans!=null&&e.target.tagName!=='BUTTON'){e.preventDefault();nxt()}});
document.getElementById('kgNav').onclick=function(e){var b=e.target.closest('button');if(!b)return;
if(view==b.dataset.v&&view=='map')nd=null;abort();view=b.dataset.v;draw()};
document.getElementById('kgLv').onclick=function(e){var b=e.target.closest('button');if(b){S.lv=b.dataset.l;zt=0;sel=null;save();draw()}};
V.onchange=function(e){if(e.target.id=='kgZ'){zt=+e.target.value;sel=null;draw()}};
V.onclick=PL.onclick=function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset;
if(d.nd){openNode(d.nd)}
else if(d.hk){var hp=d.hk.split(':');S.hkc[hp[0]]=hp[1];save();draw()}
else if(d.act=='hakt'){hkStart('tower');draw();gtop()}
else if(d.act=='hakp'){hkStart('prac',{k:S.hkc.k,l:S.hkc.l});draw();gtop()}
else if(d.act=='hakw'){var hw=B&&B.miss?Object.keys(B.miss):[];hkStart('prac',{k:'mix',l:'weak',wk:hw});draw();gtop()}
else if(d.act=='hnext'){hakNext();draw();gtop()}
else if(d.act=='hend'){if(B&&B.kind=='hak'){hkEnd('done');draw();gtop()}}
else if(d.act=='hcont'){if(B&&B.kind=='hak'&&B.over=='win'){B.over=null;hkQ();draw();gtop()}}
else if(d.o!=null&&B&&B.kind=='hak'){hakAns(+d.o);draw()}
else if(d.zoom){zoomPic(d.zoom)}
else if(d.act=='map'){if(B&&B.kind=='boss'&&B.newClear){var ni=LS.indexOf(B.l)+1;mapMsg=ni<5?'Chặng mới đã mở: '+bossInfo(LS[ni]).name+' ('+LS[ni].toUpperCase()+')':'Năm dấu son đã đủ — 終章 đã mở. Cửu Vĩ Hồ đang chờ ở cuối hành trình!'}abort();nd=null;draw();gtop()}
else if(d.act=='pro'){S.pro=1;save();abort();nd=null;draw();gtop()}
else if(d.act=='menu'){abort();draw();gtop()}
else if(d.act=='col'){startCol(+d.s);draw();gtop()}
else if(d.act=='boss'){startBoss(+d.s);draw();gtop()}
else if(d.act=='fm'){fmShow()}
else if(d.act=='yk'){startYk(d.y);draw();gtop()}
else if(d.o!=null&&B&&B.ans==null&&!B.fin){B.ans=+d.o;ansr(B.opt[B.ans].k==B.q[B.i].a.k)}
else if(d.act=='next'&&B&&(B.kind=='col'||(B.kind=='boss'&&!B.fin&&B.ans!=null)))nxt();
else if(d.i!=null){sel=+d.i;draw();var L=stations(S.lv);if(L[zt])speak(L[zt].a[sel].w)}
else if(d.sp)speak(d.sp);
else if(d.act=='imp'){try{var x=JSON.parse(document.getElementById('kgTa').value);if(!x.w)throw 0;S=norm(x);save();draw();document.getElementById('kgMsg').textContent='Đã nhập!'}catch(er){document.getElementById('kgMsg').textContent='Mã không hợp lệ.'}}
else if(d.act=='rst'){if(confirm('Xóa hết tiến độ?')){S=fresh();save();draw()}}};
})();

</script>

<style id="kg-nextbar-css">
/* Thanh 次へ cố định ở đáy — chỉ điện thoại / màn cảm ứng */
.kg-nextbar{display:none}
.kg-bh,.kg-hud,.kg-panel{scroll-margin-top:10px}
@media (max-width:820px),(pointer:coarse){
  html.kg-nb-js .kg-btn[data-act="next"],html.kg-nb-js .kg-btn[data-act="hnext"]{display:none!important}
  .kg-nextbar{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:block;
    padding:14px 14px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg-card,#f3ead7) 38%);
    transform:translateY(110%);transition:transform .18s ease;pointer-events:none}
  .kg-nextbar.show{transform:none}
  .kg-nextbar button{pointer-events:none;width:100%;min-height:54px;font-size:calc(18px*var(--fs,1));font-weight:800;letter-spacing:.06em;
    border:2px solid var(--accent,#b08d4c);border-radius:4px;background:var(--bg-card,#f3ead7);color:var(--ink,#2a1d0e);
    box-shadow:3px 3px 0 var(--accent,#b08d4c);cursor:pointer;font-family:inherit}
  .kg-nextbar.arm.show button{pointer-events:auto}
  .kg-nextbar button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent,#b08d4c)}
  body.kg-nb-on{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
</style>

<script id="kg-nextbar-js">
(function(){
  var mq=window.matchMedia('(max-width:820px),(pointer:coarse)'),bar,btn,armT,shown=false,raf=0;
  function find(){return document.querySelector('.kg-btn[data-act="next"],.kg-btn[data-act="hnext"]')}
  function label(b){var c=b.cloneNode(true),sm=c.querySelectorAll('small');for(var i=0;i<sm.length;i++)sm[i].remove();return c.textContent.trim()||'次へ →'}
  /* sau khi qua câu: cuộn về đầu câu hỏi mới (đồng hồ + câu hỏi); scrollIntoView đúng với mọi vùng cuộn */
  function toQuestion(){
    var go=function(){var t=document.querySelector('.kg-bh,.kg-hud,.kg-panel');if(!t)return;
      var r=t.getBoundingClientRect();
      if(r.top<0||r.top>window.innerHeight*.25){try{t.scrollIntoView({block:'start',behavior:'smooth'})}catch(e){t.scrollIntoView(true)}}};
    setTimeout(function(){requestAnimationFrame(go)},30);setTimeout(go,260); /* chạy lại phòng khi giao diện dựng chậm */
  }
  function build(){
    bar=document.createElement('div');bar.className='kg-nextbar';bar.setAttribute('aria-live','polite');
    btn=document.createElement('button');btn.type='button';bar.appendChild(btn);document.body.appendChild(bar);
    btn.addEventListener('click',function(){var b=find();if(b){b.click();toQuestion()}});
    document.documentElement.classList.add('kg-nb-js');
  }
  function sync(){
    raf=0;if(!bar)build();
    var b=mq.matches?find():null;
    if(b){
      btn.textContent=label(b);
      if(!shown){shown=true;bar.classList.remove('arm');clearTimeout(armT);
        bar.classList.add('show');document.body.classList.add('kg-nb-on');
        armT=setTimeout(function(){bar.classList.add('arm')},400)} /* chờ 400ms để không lỡ chạm đúp */
    }else if(shown){shown=false;clearTimeout(armT);bar.classList.remove('show','arm');document.body.classList.remove('kg-nb-on')}
  }
  function qs(){if(!raf)raf=requestAnimationFrame(sync)}
  new MutationObserver(qs).observe(document.body,{childList:true,subtree:true});
  if(mq.addEventListener)mq.addEventListener('change',qs);
  document.addEventListener('DOMContentLoaded',qs);qs();
})();
</script>
